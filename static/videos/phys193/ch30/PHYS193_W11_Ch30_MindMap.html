  @media print { header, footer { display:none } #wrap { position:static; height:100vh } body { background:#fff } }

<body>
<header>
  <h1>Chapter 30 · Faraday's Law <span>— mind map · PHYS 193 · Serway &amp; Jewett 11e · §30.1–30.5</span></h1>

<footer>Click a node to fold or unfold it · drag to pan · scroll to zoom · Content generated by Claude (Anthropic) and verified by Dr. K. Khelifa-Kerfa</footer>
<script>
// ---------------- the map ----------------
// A node: [label, children] ; a label starting with "=" is an equation (italic math font); "!" marks a pitfall.
const DATA = ["Chapter 30 · Faraday's Law", [
  ["§30.1 Faraday's law of induction", [
    ["Two experiments, one conclusion", [["magnet moved near a loop → current", []], ["switch closed in a primary coil → momentary current", []], ["a current is induced only while the flux changes", []]]],
    ["=Φ_B = B A cos θ   (uniform B, flat loop)", [["three knobs: B, A, θ — or any combination", []], ["unit: 1 Wb = 1 T·m²", []]]],
    ["=ℰ = −N dΦ_B/dt   (Eq. 30.1 / 30.2)", [["N turns multiply the emf", []], ["the minus sign is Lenz's law", []]]],
    ["Example 30.1 · emf in a coil", [["B linear in t ⇒ constant ℰ = NA dB/dt", []], ["B ∝ e^(−at) ⇒ ℰ decays with B", []]]],
    ["Applications", [["GFCI: net flux through the sensing coil is zero unless current leaks", []], ["guitar pickup: vibrating magnetised string ⇒ changing flux ⇒ emf", []]]],
    ["!Pitfall: a large flux ≠ a large emf — only dΦ/dt counts", []],
  ]],
  ["§30.2 Motional emf", [
    ["Conductor moving through B", [["electrons feel qvB, pile up at one end", []], ["equilibrium: qE = qvB ⇒ E = vB", []], ["=ΔV = Bℓv   (Eq. 30.4)", []]]],
    ["Sliding bar on rails", [["=ℰ = Bℓv,   I = Bℓv/R   (Eqs. 30.5, 30.6)", []], ["Faraday's route: Φ = Bℓx ⇒ dΦ/dt = Bℓv", []], ["magnetic force on the bar F_B = IℓB opposes the motion", []]]],
    ["Energy", [["=F_app v = I²R   (Eq. 30.7)", []], ["the agent pushing the bar supplies all the power", []], ["P ∝ v²: double v ⇒ 2F and 4P (Quick Quiz 30.2)", []]]],
    ["Example 30.2 · bar coasting: v = v_i e^(−t/τ), τ = mR/(B²ℓ²)", []],
    ["Example 30.3 · rotating bar: ℰ = ½Bωℓ²", []],
    ["!Pitfall: the energy does not come from the magnetic field", []],
  ]],
  ["§30.3 Lenz's law", [
    ["The induced current opposes the CHANGE in flux", [["flux increasing ⇒ induced B against the external B", []], ["flux decreasing ⇒ induced B along the external B", []]]],
    ["Magnet and loop (Conceptual Ex. 30.4)", [["N pole pushed in: loop shows N face, repels", []], ["N pole pulled out: loop shows S face, attracts", []]]],
    ["Energy conservation", [["assume the opposite ⇒ runaway bar, energy from nothing", []], ["Lenz's law = conservation of energy in disguise", []]]],
    ["Loop crossing a field region (Conceptual Ex. 30.5)", [["Φ rises, flat, falls ⇒ ℰ only on entry and exit", []], ["force on the loop opposes motion only while entering/leaving", []]]],
    ["!Pitfall: 'opposes the field' is wrong — it opposes the change", []],
  ]],
  ["§30.4 General form of Faraday's law", [
    ["A changing B induces an E in space", [["the charges in a stationary loop are pushed by E, not by a magnetic force", []], ["the loop is only a detector — E exists without any wire", []]]],
    ["=∮ E·ds = −dΦ_B/dt   (Eq. 30.8)", [["one of Maxwell's equations", []], ["circular symmetry: E(2πr) = −dΦ_B/dt (Eq. 30.9)", []]]],
    ["Example 30.6 · solenoid, I = I_max cos ωt", [["=inside (r<R): E = ½ r dB/dt ∝ r", []], ["=outside (r>R): E = R²/(2r) dB/dt ∝ 1/r", []], ["E ≠ 0 outside, where B = 0", []]]],
    ["Non-conservative field", [["∮E·ds ≠ 0 ⇒ no potential function", []], ["field lines close on themselves", []]]],
    ["!Pitfall (PP 30.1): do not write V = −∫E·ds for an induced E", []],
  ]],
  ["§30.5 Generators and motors", [
    ["AC generator", [["coil rotating at ω: θ = ωt", []], ["=Φ_B = BA cos ωt,   ℰ = NBAω sin ωt   (Eq. 30.10)", []], ["=ℰ_max = NBAω   (Eq. 30.11), at θ = 90°, 270°", []], ["slip rings ⇒ alternating output", []]]],
    ["DC generator", [["split-ring commutator reverses contacts every half turn", []], ["pulsating emf, never changes sign", []]]],
    ["Motor = generator run backwards", [["supplied current + torque on the coil ⇒ rotation", []], ["rotation induces a back emf opposing the supply", []], ["=I = (ΔV − ℰ_back)/R: current falls as speed rises", []], ["stall: no back emf ⇒ maximum current and I²R heating (Ex. 30.8, jammed saw)", []]]],
    ["!Pitfall: lower-resistance wire raises I into a load, not ℰ (Quick Quiz 30.4)", []],
  ]],
]];
const COLORS = ["#0E8A6B", "#D4322B", "#8E2C8E", "#E07A1F", "#1F5FBF"];

// ---------------- layout: root in the middle, sections 1-3 to the right, 4-5 to the left ----------------
let nodes = [], links = [];
function build(d, depth, parent, side, color, idx) {
  const n = { label: d[0], depth, parent, side, color, open: depth < 1 ? true : depth === 1, children: [], idx };
  n.eq = n.label.startsWith("="); n.pit = n.label.startsWith("!");
  if (n.eq || n.pit) n.label = n.label.slice(1);
  nodes.push(n);
  d[1].forEach((c, i) => n.children.push(build(c, depth + 1, n, depth === 0 ? (i < 3 ? 1 : -1) : side, depth === 0 ? COLORS[i] : color, i)));
  return n;
}
const root = build(DATA, 0, null, 0, "#8A1538", 0);
const ctx = document.createElement("canvas").getContext("2d");
function width(n) { ctx.font = n.eq ? 'italic 15px Georgia, "Times New Roman", serif' : (n.depth === 0 ? "700 20px" : n.depth === 1 ? "700 16px" : "14px") + " Inter, system-ui, sans-serif"; return ctx.measureText(n.label).width + 30; }
const ROWH = 34, GAPX = 56;
function visible(n) { return n.depth === 0 || (n.parent.open && visible(n.parent)); }
function layout() {
  for (const n of nodes) { n.w = width(n); n.h = n.depth === 0 ? 46 : 30; }
  // subtree heights
  function hgt(n) { if (!n.open || !n.children.length) return n.h + 10; return Math.max(n.h + 10, n.children.reduce((s, c) => s + hgt(c), 0)); }
  function place(n, x, y) {   // y = centre of the subtree, x = inner edge
    n.y = y; n.x = n.side >= 0 ? x : x - n.w;
    if (!n.open) return;
    let cy = y - hgt(n) / 2;
    for (const c of n.children) { const hh = hgt(c); place(c, n.side >= 0 ? n.x + n.w + GAPX : n.x - GAPX, cy + hh / 2); cy += hh; }
  }
  root.x = -root.w / 2; root.y = 0;
  const right = root.children.filter(c => c.side > 0), left = root.children.filter(c => c.side < 0);
  let cy = -right.reduce((s, c) => s + hgt(c), 0) / 2;
  for (const c of right) { const hh = hgt(c); place(c, root.w / 2 + GAPX, cy + hh / 2); cy += hh; }
  cy = -left.reduce((s, c) => s + hgt(c), 0) / 2;
  for (const c of left) { const hh = hgt(c); place(c, -root.w / 2 - GAPX, cy + hh / 2); cy += hh; }
}
// ---------------- render ----------------
const svg = document.getElementById("svg");
let view = { x: 0, y: 0, k: 1 };
function render() {
  layout();
  let s = `<g transform="translate(${view.x} ${view.y}) scale(${view.k})">`;
  for (const n of nodes) {
    if (n.depth === 0 || !visible(n)) continue;
    const p = n.parent, px = p.side >= 0 || p.depth === 0 ? (n.side > 0 ? p.x + p.w : p.x) : (n.side > 0 ? p.x + p.w : p.x);
    const x1 = n.side > 0 ? (p.depth === 0 ? p.x + p.w : p.x + p.w) : (p.depth === 0 ? p.x : p.x), y1 = p.y;
    const x2 = n.side > 0 ? n.x : n.x + n.w, y2 = n.y, mx = (x1 + x2) / 2;
    s += `<path class="link" d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" stroke="${n.color}"/>`;
  }
  for (const n of nodes) {
    if (!visible(n)) continue;
    const cls = "node" + (n.depth === 0 ? " root" : n.depth === 1 ? " sec" : "") + (n.pit ? " pit" : "") + (n.children.length ? "" : " leaf");
    s += `<g class="${cls}" data-i="${nodes.indexOf(n)}" transform="translate(${n.x} ${n.y - n.h / 2})"><rect width="${n.w}" height="${n.h}" rx="${n.h / 2}" stroke="${n.color}"/>` +
      `<text x="14" y="${n.h / 2 + 5}" class="${n.eq ? "eq" : ""}">${esc(n.label)}</text>`;
    if (n.children.length && n.depth > 0) { const tx = n.side > 0 ? n.w : 0; s += `<circle cx="${tx}" cy="${n.h / 2}" r="9" fill="${n.color}"/><text class="toggle" x="${tx}" y="${n.h / 2 + 4}" text-anchor="middle">${n.open ? "−" : "+"}</text>`; }
    s += `</g>`;
  }
  svg.innerHTML = s + "</g>";
}
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
svg.addEventListener("click", e => { const g = e.target.closest(".node"); if (!g) return; const n = nodes[+g.dataset.i]; if (n.children.length) { n.open = !n.open; render(); } });
function expandAll(open) { for (const n of nodes) if (n.depth >= 1) n.open = open; render(); fit(); }
function fit() {
  layout();
  const vis = nodes.filter(visible); const x0 = Math.min(...vis.map(n => n.x)) - 30, x1 = Math.max(...vis.map(n => n.x + n.w)) + 30;
  const y0 = Math.min(...vis.map(n => n.y - n.h / 2)) - 30, y1 = Math.max(...vis.map(n => n.y + n.h / 2)) + 30;
  const r = svg.getBoundingClientRect(); view.k = Math.min(r.width / (x1 - x0), r.height / (y1 - y0), 1.6);
  view.x = r.width / 2 - view.k * (x0 + x1) / 2; view.y = r.height / 2 - view.k * (y0 + y1) / 2; render();
}
// pan & zoom
let drag = null;
svg.addEventListener("mousedown", e => { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; });
window.addEventListener("mousemove", e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; render(); } });
window.addEventListener("mouseup", () => drag = null);
svg.addEventListener("wheel", e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.1 : 1 / 1.1; const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f; render(); }, { passive: false });
window.addEventListener("resize", fit);
window.MINDMAP = { expandAll, fit };
document.fonts ? document.fonts.ready.then(() => { render(); fit(); }) : (render(), fit());
</script>
