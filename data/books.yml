shelf:
  - subject: { en: Introductory physics, ar: الفيزياء التمهيدية }
    books:
      - { title: Fundamentals of Physics, authors: "D. Halliday, R. Resnick & J. Walker", edition: "10th ed., Wiley, 2011", course: "PHYS101 · PHYS102" }
  - subject: { en: Electromagnetism, ar: الكهرومغناطيسية }
    books:
      - { title: Introduction to Electrodynamics, authors: D. J. Griffiths, edition: Prentice Hall, course: UEF224 }
      - { title: Classical Electrodynamics, authors: J. D. Jackson, edition: Wiley, course: UEF224 }
      - { title: The Feynman Lectures on Physics, Vol. II, authors: "R. P. Feynman, R. B. Leighton & M. Sands", course: UEF224 }
  - subject: { en: Quantum mechanics, ar: ميكانيكا الكم }
    books:
      - { title: Introduction to Quantum Mechanics, authors: D. J. Griffiths, edition: "2nd ed.", course: PHYS401 }
      - { title: The Principles of Quantum Mechanics, authors: P. A. M. Dirac, edition: Oxford, course: PHYS401 }
      - { title: Introductory Quantum Mechanics, authors: R. L. Liboff, course: PHYS401 }
  - subject: { en: "Modern, thermal & mathematical physics", ar: "الفيزياء الحديثة والحرارية والرياضية" }
    books:
      - { title: Modern Physics, authors: "R. A. Serway, C. J. Moses & C. A. Moyer", edition: "3rd ed., Cengage, 2004", course: PHYS342 }
      - { title: Concepts in Thermal Physics, authors: "S. J. Blundell & K. M. Blundell", edition: "OUP, 2010", course: PHYS321 }
      - { title: Fundamentals of Statistical and Thermal Physics, authors: F. Reif, course: PHYS321 }
      - { title: Statistical Physics, authors: F. Mandl, course: PHYS321 }
      - { title: Mathematical Methods for Physicists, authors: "G. B. Arfken & H. J. Weber", edition: "6th ed., Academic Press", course: PHYS352 }
      - { title: Mathematical Methods in the Physical Sciences, authors: M. L. Boas, course: PHYS352 }

