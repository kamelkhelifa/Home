# ─────────────────────────────────────────────────────────────
#  Books
#  `theses`, `notes` : theses and lecture-note volumes (add a real cover in static/img/books/ with `cover:`).
#  `in_progress`      : books being written or translated, grouped.
#  `shelf`    : the textbooks my courses are built on (titles stay in the original).
#  `library`  : online libraries and classic works (from the old "المكتبة" pages).
# ─────────────────────────────────────────────────────────────

hero_title: { en: "Written, <em>and read.</em>", ar: "ما كتبتُ، <em>وما قرأت.</em>" }
intro:
  en: >
    My theses and lecture notes, the books I am writing and translating into Arabic, and the
    books I teach from. The library gathers online collections and classics of the Islamic
    scientific tradition.
  ar: >
    رسائلي ومذكرات محاضراتي، والكتب التي أؤلّفها أو أترجمها إلى العربية، والكتب التي أدرّس منها.
    وتجمع المكتبة مجموعاتٍ إلكترونية وأمّهاتِ الكتب من التراث العلمي الإسلامي.

theses:
  - title: { en: "QCD Resummation for High-pT Jet Shapes at Hadron Colliders", ar: "إعادة جمع الكروموديناميكا الكمية لأشكال النفثات ذات الزخم العرضي العالي في مصادمات الهادرونات" }
    cover_title: QCD Resummation for High-pT Jet Shapes at Hadron Colliders
    kind: { en: PhD thesis, ar: أطروحة دكتوراه }
    publisher: { en: "The University of Manchester · supervised by Prof. M. Dasgupta", ar: "جامعة مانشستر · بإشراف البروفيسور م. داسغوبتا" }
    year: 2012
    language: { en: English, ar: بالإنجليزية }
    description:
      en: >
        Non-global logarithms, jet algorithms and the all-order resummation of jet-mass
        distributions in Z + jet and dijet events at the LHC: the work that grew into my
        research programme.
      ar: >
        اللوغاريتمات غير الشاملة، وخوارزميات النفثات، وإعادة الجمع بجميع الرتب لتوزيعات كتلة
        النفثة في أحداث Z + نفثة والنفثتين في مصادم الهادرونات الكبير: العمل الذي انبثق منه
        برنامجي البحثي.
    url: https://khelifak.wordpress.com/wp-content/uploads/2014/12/phd_thesis_kk.pdf
    accent: maroon
  - title: { en: Looking for Extra Dimensions, ar: البحث عن أبعاد إضافية }
    cover_title: Looking for Extra Dimensions
    kind: { en: "Master's thesis (MPhys)", ar: "رسالة ماجستير (MPhys)" }
    publisher: { en: "The University of Manchester · supervised by Prof. Apostolos Pilaftsis", ar: "جامعة مانشستر · بإشراف البروفيسور أبوستولوس بيلافتسيس" }
    year: 2009
    language: { en: English, ar: بالإنجليزية }
    description:
      en: >
        Final-year research project (MPhys Project I & II) in theoretical physics, searching for
        signatures of extra spatial dimensions, completed for the Master of Physics with
        Theoretical Physics.
      ar: >
        مشروع بحثي في السنة الأخيرة (المشروع الأول والثاني) في الفيزياء النظرية، يبحث عن آثار
        الأبعاد المكانية الإضافية، أُنجز ضمن ماجستير الفيزياء مع الفيزياء النظرية.
    accent: ink

notes:
  - title: { en: Quantum Mechanics I, ar: ميكانيكا الكم 1 }
    cover_title: Quantum Mechanics I
    kind: { en: Lecture notes, ar: مذكرات محاضرات }
    publisher: { en: "Course UEF223 · Relizane University", ar: "مقرر UEF223 · جامعة غليزان" }
    description:
      en: From the wavefunction and the Schrödinger equation to the hydrogen atom, written for second-year physics students.
      ar: من الدالة الموجية ومعادلة شرودنغر إلى ذرة الهيدروجين، كُتبت لطلبة السنة الثانية فيزياء.
    course: relizane/uef223
    accent: maroon
  - title: { en: English for Physicists, ar: الإنجليزية للفيزيائيين }
    cover_title: English for Physicists
    kind: { en: Lecture notes, ar: مذكرات محاضرات }
    publisher: { en: "Course UET · Relizane University", ar: "مقرر UET · جامعة غليزان" }
    language: { en: English, ar: بالإنجليزية }
    description:
      en: Lecture notes for the English Language course I teach to physics students, with past exams and links to supplementary reading.
      ar: مذكرات مقرر اللغة الإنجليزية الذي أدرّسه لطلبة الفيزياء، مع اختبارات سابقة وروابط لقراءات إضافية.
    course: relizane/uet-english
    accent: gold

