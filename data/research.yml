field: High-energy physics · Theory & Phenomenology

overview: >
  I work on precision Quantum Chromodynamics for high-energy colliders. Most measurements
  at the LHC involve jets: collimated sprays of hadrons left behind by quarks and gluons.
  Predicting their properties reliably means resumming large logarithms to all orders in
  perturbation theory. My work focuses on the subtle, non-global parts of that problem:
  how soft gluons emitted into restricted regions of phase space, and the jet algorithms
  used to cluster them, shape the observables experimentalists measure.

themes:
  - title: Non-global logarithms
    text: Exact multi-loop computation of non-global logarithms at finite N<sub>c</sub>, including their structure beyond leading order and the question of their exponentiation.
    symbol: "α<sub>s</sub><sup>n</sup>L<sup>n</sup>"
  - title: Clustering logarithms
    text: All-order analytical structure of the k<sub>t</sub>, generalised-k<sub>t</sub> and Cambridge/Aachen algorithms, with clustering logarithms computed up to six loops.
    symbol: "k<sub>t</sub>"
  - title: Jet shapes & jet mass
    text: Resummed predictions for jet mass, hemisphere and dijet mass, and jet shapes in V/H + jet, Z + jet and dijet events at hadron colliders.
    symbol: "m<sub>j</sub><sup>2</sup>"
  - title: Eikonal amplitudes
    text: Soft-gluon (eikonal) amplitudes for processes with two and three hard legs at finite N<sub>c</sub>, and their link to the BMS evolution equation.
    symbol: "p·k"
  - title: Azimuthal decorrelation
    text: All-order description of azimuthal decorrelation between a jet and a Z boson at hadron colliders, and between dijets in e<sup>+</sup>e<sup>−</sup> annihilation.
    symbol: "Δφ"
  - title: Materials physics collaborations
    text: First-principles studies of Heusler and half-Heusler compounds for spintronic, thermoelectric and optoelectronic applications, with colleagues at Relizane University.
    symbol: "E<sub>g</sub>"

