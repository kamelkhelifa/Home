hero_title: { en: "Soft gluons, <em>hard questions.</em>", ar: "غلوونات ليّنة، <em>وأسئلة صعبة.</em>" }
field: { en: "High-energy physics · Theory & Phenomenology", ar: "فيزياء الطاقات العالية · النظرية والفينومينولوجيا" }
other_fields: { en: "Also: computational physics, materials science", ar: "إضافة إلى: الفيزياء الحاسوبية وعلم المواد" }

overview:
  en: >
    I work on precision Quantum Chromodynamics for high-energy colliders. Most measurements
    at the LHC involve jets: collimated sprays of hadrons left behind by quarks and gluons.
    Predicting their properties reliably means resumming large logarithms to all orders in
    perturbation theory. My work focuses on the subtle, non-global parts of that problem:
    how soft gluons emitted into restricted regions of phase space, and the jet algorithms
    used to cluster them, shape the observables experimentalists measure.
  ar: >
    أعمل على الكروموديناميكا الكمية الدقيقة في المصادمات عالية الطاقة. معظم القياسات في مصادم
    الهادرونات الكبير تتضمن النفثات: حزمًا متراصة من الهادرونات تخلّفها الكواركات والغلوونات.
    والتنبؤ الموثوق بخصائصها يستلزم إعادة جمع اللوغاريتمات الكبيرة بجميع رتب نظرية الاضطراب.
    يتركّز عملي على الجوانب الدقيقة غير الشاملة من هذه المسألة: كيف تُشكّل الغلوونات الليّنة
    المنبعثة في مناطق محدودة من فضاء الطور، وخوارزميات النفثات المستعملة لتجميعها، المقاديرَ
    التي يقيسها التجريبيون.

themes:
  - title: { en: Non-global logarithms, ar: اللوغاريتمات غير الشاملة }
    text:
      en: Exact multi-loop computation of non-global logarithms at finite N<sub>c</sub>, including their structure beyond leading order and the question of their exponentiation.
      ar: حساب دقيق متعدد الحلقات للوغاريتمات غير الشاملة عند N<sub>c</sub> منتهٍ، بما في ذلك بنيتها فيما وراء الرتبة الرائدة ومسألة قابليتها للأسّية.
    symbol: "α<sub>s</sub><sup>n</sup>L<sup>n</sup>"
  - title: { en: Clustering logarithms, ar: لوغاريتمات التجميع }
    text:
      en: All-order analytical structure of the k<sub>t</sub>, generalised-k<sub>t</sub> and Cambridge/Aachen algorithms, with clustering logarithms computed up to six loops.
      ar: البنية التحليلية بجميع الرتب لخوارزميات k<sub>t</sub> وk<sub>t</sub> المعمّمة وكامبريدج/آخن، مع حساب لوغاريتمات التجميع حتى ست حلقات.
    symbol: "k<sub>t</sub>"
  - title: { en: "Jet shapes & jet mass", ar: "أشكال النفثات وكتلتها" }
    text:
      en: Resummed predictions for jet mass, hemisphere and dijet mass, and jet shapes in V/H + jet, Z + jet and dijet events at hadron colliders.
      ar: تنبؤات معاد جمعها لكتلة النفثة وكتلة نصف الكرة وكتلة النفثتين، ولأشكال النفثات في أحداث V/H + نفثة وZ + نفثة والنفثتين في مصادمات الهادرونات.
    symbol: "m<sub>j</sub><sup>2</sup>"
  - title: { en: Eikonal amplitudes, ar: السعات الإيكونالية }
    text:
      en: Soft-gluon (eikonal) amplitudes for processes with two and three hard legs at finite N<sub>c</sub>, and their link to the BMS evolution equation.
      ar: سعات الغلوونات الليّنة (الإيكونالية) للعمليات ذات ساقين وثلاث سيقان صلبة عند N<sub>c</sub> منتهٍ، وصلتها بمعادلة التطور BMS.
    symbol: "p·k"
  - title: { en: Azimuthal decorrelation, ar: فقدان الترابط السمتي }
    text:
      en: All-order description of azimuthal decorrelation between a jet and a Z boson at hadron colliders, and between dijets in e<sup>+</sup>e<sup>−</sup> annihilation.
      ar: وصف بجميع الرتب لفقدان الترابط السمتي بين نفثة وبوزون Z في مصادمات الهادرونات، وبين نفثتين في فناء e<sup>+</sup>e<sup>−</sup>.
    symbol: "Δφ"
  - title: { en: Materials physics collaborations, ar: تعاونات في فيزياء المواد }
    text:
      en: First-principles studies of Heusler and half-Heusler compounds for spintronic, thermoelectric and optoelectronic applications, with colleagues at Relizane University.
      ar: دراسات من المبادئ الأولى لمركبات هويسلر ونصف هويسلر لتطبيقات الإلكترونيات السبينية والكهروحرارية والإلكتروضوئية، مع زملاء من جامعة غليزان.
    symbol: "E<sub>g</sub>"

