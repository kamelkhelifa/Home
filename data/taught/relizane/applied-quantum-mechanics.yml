# DRAFTED syllabus (Kamel to review): the usual M1 course on approximation methods and their applications, continuing UEF131 (which ends with "generalities on approximation methods").
description:
  en: |
    Exact solutions of the Schrödinger equation exist for only a handful of systems. This Master 1 course gives the methods used for everything else, and applies them to atoms, molecules, solids and the interaction of matter with light.

    It treats time-independent perturbation theory (non-degenerate and degenerate) with the Stark and Zeeman effects and the fine structure of hydrogen; the variational method and the WKB approximation; time-dependent perturbation theory, two-level systems, Fermi's golden rule and the emission and absorption of radiation; systems of identical particles; and an introduction to scattering theory.
  ar: |
    لا توجد حلول مضبوطة لمعادلة شرودنغر إلا لعدد قليل من الأنظمة. يقدّم مقرر الماستر 1 هذا الطرق المستعملة في سائر الحالات، ويطبّقها على الذرات والجزيئات والأجسام الصلبة وعلى تفاعل المادة مع الضوء.

    ويتناول نظرية الاضطراب المستقلة عن الزمن (غير المنحلّة والمنحلّة) مع ظاهرتي شتارك وزيمان والبنية الدقيقة لذرة الهيدروجين؛ والطريقة التغيّرية وتقريب WKB؛ ونظرية الاضطراب المتعلقة بالزمن والأنظمة ذات المستويين وقاعدة فيرمي الذهبية وإصدار الإشعاع وامتصاصه؛ وأنظمة الجسيمات المتطابقة؛ ومدخلًا إلى نظرية التصادم.
  fr: |
    L'équation de Schrödinger n'a de solution exacte que pour une poignée de systèmes. Ce cours de Master 1 présente les méthodes utilisées pour tous les autres, et les applique aux atomes, aux molécules, aux solides et à l'interaction de la matière avec la lumière.

    Il traite la théorie des perturbations stationnaires (non dégénérée et dégénérée) avec les effets Stark et Zeeman et la structure fine de l'hydrogène ; la méthode variationnelle et l'approximation WKB ; la théorie des perturbations dépendant du temps, les systèmes à deux niveaux, la règle d'or de Fermi et l'émission et l'absorption de rayonnement ; les systèmes de particules identiques ; et une introduction à la théorie de la diffusion.

objectives:
  - { en: "Give students the standard approximation methods of quantum mechanics.", ar: "تزويد الطلاب بالطرق التقريبية المعتمدة في ميكانيكا الكم.", fr: "Donner aux étudiants les méthodes d'approximation classiques de la mécanique quantique." }
  - { en: "Apply them to real systems: atoms, molecules, solids and light–matter interaction.", ar: "تطبيقها على أنظمة حقيقية: الذرات والجزيئات والأجسام الصلبة وتفاعل الضوء مع المادة.", fr: "Les appliquer à des systèmes réels : atomes, molécules, solides et interaction lumière-matière." }

outcomes:
  - id: CLO1
    text: { en: "Apply non-degenerate and degenerate time-independent perturbation theory, including the Stark effect, the Zeeman effect and the fine structure of hydrogen.", ar: "يطبّق نظرية الاضطراب المستقلة عن الزمن غير المنحلّة والمنحلّة، بما في ذلك ظاهرتا شتارك وزيمان والبنية الدقيقة للهيدروجين.", fr: "Appliquer la théorie des perturbations stationnaires non dégénérée et dégénérée, y compris les effets Stark et Zeeman et la structure fine de l'hydrogène." }
  - id: CLO2
    text: { en: "Estimate ground-state energies with the variational method (e.g. the helium atom).", ar: "يقدّر طاقات الحالة الأساسية بالطريقة التغيّرية (مثل ذرة الهيليوم).", fr: "Estimer des énergies de l'état fondamental par la méthode variationnelle (par ex. l'atome d'hélium)." }
  - id: CLO3
    text: { en: "Use the WKB approximation for bound states and tunnelling.", ar: "يستعمل تقريب WKB للحالات المقيّدة وللنفق الكمومي.", fr: "Utiliser l'approximation WKB pour les états liés et l'effet tunnel." }
  - id: CLO4
    text: { en: "Compute transition probabilities with time-dependent perturbation theory and Fermi's golden rule, and derive selection rules for electric-dipole transitions.", ar: "يحسب احتمالات الانتقال بنظرية الاضطراب المتعلقة بالزمن وقاعدة فيرمي الذهبية، ويستنتج قواعد الانتقاء للانتقالات ثنائية القطب الكهربائي.", fr: "Calculer des probabilités de transition par la théorie des perturbations dépendant du temps et la règle d'or de Fermi, et établir les règles de sélection des transitions dipolaires électriques." }
  - id: CLO5
    text: { en: "Build symmetric and antisymmetric states of identical particles and use them for atoms and the free-electron gas.", ar: "يبني الحالات المتناظرة وضد المتناظرة للجسيمات المتطابقة ويستعملها للذرات ولغاز الإلكترونات الحرة.", fr: "Construire les états symétriques et antisymétriques de particules identiques et les utiliser pour les atomes et le gaz d'électrons libres." }
  - id: CLO6
    text: { en: "Describe scattering by partial waves and in the Born approximation, and compute simple cross sections.", ar: "يصف التصادم بطريقة الأمواج الجزئية وبتقريب بورن، ويحسب مقاطع عرضية بسيطة.", fr: "Décrire la diffusion par la méthode des ondes partielles et dans l'approximation de Born, et calculer des sections efficaces simples." }

