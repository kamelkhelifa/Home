schedule:
  - week: "1–2"
    title: { en: "Review and tools", ar: "مراجعة وأدوات", fr: "Rappels et outils" }
    topics:
      en: ["Postulates and Dirac notation", "Angular momentum and spin", "Exactly solvable systems"]
      ar: ["المسلّمات وترميز ديراك", "الزخم الزاوي واللف المغزلي", "الأنظمة القابلة للحل المضبوط"]
      fr: ["Postulats et notation de Dirac", "Moment cinétique et spin", "Systèmes exactement solubles"]
  - week: "3–5"
    title: { en: "Time-independent perturbation theory", ar: "نظرية الاضطراب المستقلة عن الزمن", fr: "Perturbations stationnaires" }
    topics:
      en: ["Non-degenerate and degenerate cases", "Stark effect", "Fine structure and Zeeman effect"]
      ar: ["الحالتان غير المنحلّة والمنحلّة", "ظاهرة شتارك", "البنية الدقيقة وظاهرة زيمان"]
      fr: ["Cas non dégénéré et dégénéré", "Effet Stark", "Structure fine et effet Zeeman"]
  - week: "6–7"
    title: { en: "Variational method and WKB", ar: "الطريقة التغيّرية وتقريب WKB", fr: "Méthode variationnelle et WKB" }
    topics:
      en: ["Variational principle; the helium atom", "WKB approximation; tunnelling and alpha decay"]
      ar: ["المبدأ التغيّري؛ ذرة الهيليوم", "تقريب WKB؛ النفق الكمومي وتفكك ألفا"]
      fr: ["Principe variationnel ; l'atome d'hélium", "Approximation WKB ; effet tunnel et désintégration alpha"]
  - week: "8–10"
    title: { en: "Time-dependent perturbation theory", ar: "نظرية الاضطراب المتعلقة بالزمن", fr: "Perturbations dépendant du temps" }
    topics:
      en: ["Two-level systems and Rabi oscillations", "Fermi's golden rule", "Emission and absorption of radiation; selection rules"]
      ar: ["الأنظمة ذات المستويين وتذبذبات رابي", "قاعدة فيرمي الذهبية", "إصدار الإشعاع وامتصاصه؛ قواعد الانتقاء"]
      fr: ["Systèmes à deux niveaux et oscillations de Rabi", "Règle d'or de Fermi", "Émission et absorption de rayonnement ; règles de sélection"]
  - week: "11–12"
    title: { en: "Identical particles", ar: "الجسيمات المتطابقة", fr: "Particules identiques" }
    topics:
      en: ["Bosons and fermions; exchange", "Atoms and the periodic table", "Free-electron gas in solids"]
      ar: ["البوزونات والفرميونات؛ التبادل", "الذرات والجدول الدوري", "غاز الإلكترونات الحرة في الأجسام الصلبة"]
      fr: ["Bosons et fermions ; échange", "Atomes et tableau périodique", "Gaz d'électrons libres dans les solides"]
  - week: "13–14"
    title: { en: "Scattering theory", ar: "نظرية التصادم", fr: "Théorie de la diffusion" }
    topics:
      en: ["Cross sections", "Partial-wave analysis", "Born approximation"]
      ar: ["المقاطع العرضية", "تحليل الأمواج الجزئية", "تقريب بورن"]
      fr: ["Sections efficaces", "Analyse en ondes partielles", "Approximation de Born"]

