notes: >
  Single original page (English); the cleaned ar file is its translation. Course information, description,
  the 5 learning outcomes, the detailed outcomes (put in the description), the 18-week thematic calendar,
  assessment (assignments 50%, final 50%), the lecture notes and the textbook list are as on the page.
  The course code is written "UET/221/131/231" (semesters 4/5/6) on the page, while the exam tables are headed
  "Semesters 3 & 5 & 7" and "Semesters 4 & 6 & 8"; levels L2, L3 and M1 all followed the same course.
  The lecture notes are listed as the required "textbook" and are assumed to be the professor's own (please confirm;
  no author shown, per the no-names rule). Years are not given: 2021-2024 inferred from the past-exam years (2022, 2023, 2024)
  and the Relizane period; the session of the current L2/L3 final papers is not stated. The two supplementary
  links were misspelled and not hyperlinked (www.bbc.co.uk/learningenglis, www.learnigenglish.org.uk); corrected
  to BBC Learning English and British Council LearnEnglish. "Einsenberg" corrected to Eisenberg.
  Not kept: online timetable, office hours, assignment-submission Google Forms (L2/L3/M1), student-portal marks
  links, course-evaluation questionnaire. M1 papers, resit papers and the 2023-2024 past papers were never uploaded.
