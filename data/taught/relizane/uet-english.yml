description:
  en: |
    <p>This is a continuation of previous courses on English for scientists. It focuses on improving both oral and written skills.</p>
    <p>Credits: 1 · Coefficient: 1. Each week is built around a physics topic, studied through a text in the lecture notes.</p>
    <h4>Detailed learning outcomes</h4>
    <ul>
      <li><strong>Oral comprehension</strong>: 1.1 understand a simple technical conversation or presentation; 1.2 understand technical instructions; 1.3 understand simple mathematical expressions.</li>
      <li><strong>Written comprehension</strong>: 2.1 read an elementary technical text; 2.2 recall information in a simple technical document; 2.3 understand simple technical instructions.</li>
      <li><strong>Oral expression</strong>: 3.1 give a simple technical presentation; 3.2 convey scientific and technical information; 3.3 summarise or rephrase orally an elementary technical document.</li>
      <li><strong>Written expression</strong>: 4.1 write a simple report on a technical document; 4.2 describe a simple technical object; 4.3 write a simple technical manual.</li>
    </ul>
  ar: |
    <p>هذا المقرر تتمة للمقررات السابقة في اللغة الإنجليزية الموجهة للعلميين، ويركز على تحسين المهارات الشفهية والكتابية معًا.</p>
    <p>الأرصدة: 1 · المعامل: 1. يُبنى كل أسبوع حول موضوع فيزيائي يُدرَس من خلال نص في مذكرة المحاضرات.</p>
    <h4>مخرجات التعلم التفصيلية</h4>
    <ul>
      <li><strong>الفهم الشفهي</strong>: 1.1 فهم محادثة أو عرض تقني بسيط؛ 1.2 فهم التعليمات التقنية؛ 1.3 فهم العبارات الرياضية البسيطة.</li>
      <li><strong>الفهم الكتابي</strong>: 2.1 قراءة نص تقني أولي؛ 2.2 استرجاع المعلومات الواردة في وثيقة تقنية بسيطة؛ 2.3 فهم التعليمات التقنية البسيطة.</li>
      <li><strong>التعبير الشفهي</strong>: 3.1 تقديم عرض تقني بسيط؛ 3.2 نقل المعلومات العلمية والتقنية؛ 3.3 تلخيص وثيقة تقنية أولية أو إعادة صياغتها شفهيًا.</li>
      <li><strong>التعبير الكتابي</strong>: 4.1 كتابة تقرير بسيط عن وثيقة تقنية؛ 4.2 وصف شيء تقني بسيط؛ 4.3 كتابة دليل استعمال تقني بسيط.</li>
    </ul>
  fr: |
    <p>Ce cours fait suite aux cours d'anglais pour scientifiques des années précédentes. Il vise à améliorer les compétences orales et écrites.</p>
    <p>Crédits : 1 · Coefficient : 1. Chaque semaine s'articule autour d'un thème de physique, étudié à travers un texte du polycopié.</p>
    <h4>Acquis d'apprentissage détaillés</h4>
    <ul>
      <li><strong>Compréhension orale</strong> : 1.1 comprendre une conversation ou une présentation technique simple ; 1.2 comprendre des consignes techniques ; 1.3 comprendre des expressions mathématiques simples.</li>
      <li><strong>Compréhension écrite</strong> : 2.1 lire un texte technique élémentaire ; 2.2 restituer les informations d'un document technique simple ; 2.3 comprendre des consignes techniques simples.</li>
      <li><strong>Expression orale</strong> : 3.1 faire une présentation technique simple ; 3.2 transmettre une information scientifique et technique ; 3.3 résumer ou reformuler oralement un document technique élémentaire.</li>
      <li><strong>Expression écrite</strong> : 4.1 rédiger un compte rendu simple d'un document technique ; 4.2 décrire un objet technique simple ; 4.3 rédiger un mode d'emploi technique simple.</li>
    </ul>

outcomes:
  - id: LO1
    text:
      en: Deliver an oral presentation about a scientific topic to colleagues, in meetings, conferences, etc.
      ar: تقديم عرض شفهي حول موضوع علمي أمام الزملاء، في الاجتماعات والمؤتمرات ونحوها.
      fr: Faire une présentation orale sur un sujet scientifique devant des collègues, en réunion, en conférence, etc.
  - id: LO2
    text:
      en: Present a scientific product orally.
      ar: تقديم منتج علمي شفهيًا.
      fr: Présenter oralement un produit scientifique.
  - id: LO3
    text:
      en: Translate a simple technical document.
      ar: ترجمة وثيقة تقنية بسيطة.
      fr: Traduire un document technique simple.
  - id: LO4
    text:
      en: Understand lectures and conferences given in English.
      ar: فهم المحاضرات والمؤتمرات الملقاة باللغة الإنجليزية.
      fr: Comprendre des cours et des conférences donnés en anglais.
  - id: LO5
    text:
      en: Understand and write a short scientific article.
      ar: فهم مقال علمي قصير وكتابته.
      fr: Comprendre et rédiger un court article scientifique.

assessment:
  - type: homework
    weight: 50
    title: { en: Weekly assignments, ar: الواجبات الأسبوعية, fr: Devoirs hebdomadaires }
    detail:
      en: "Assignments are given in the lecture notes and are due one week later. L2 and L3: read the text, answer all the questions and prepare the written expression. M1: prepare a whole lecture, i.e. a full text with all questions and answers, including the written-expression task."
      ar: "ترد الواجبات في مذكرة المحاضرات وتُسلَّم بعد أسبوع واحد. ل2 ول3: اقرأ النص، وأجب عن جميع الأسئلة، وحضّر التعبير الكتابي. م1: حضّر محاضرة كاملة، أي نصًا كاملًا مع جميع الأسئلة والأجوبة، بما في ذلك مهمة التعبير الكتابي."
      fr: "Les devoirs figurent dans le polycopié et sont à rendre une semaine plus tard. L2 et L3 : lire le texte, répondre à toutes les questions et préparer l'expression écrite. M1 : préparer une leçon complète, c'est-à-dire un texte complet avec toutes les questions et réponses, y compris l'exercice d'expression écrite."
  - type: final
    weight: 50
    title: { en: Final exam, ar: الاختبار النهائي, fr: Examen final }
    detail: { en: 1 hour, ar: ساعة واحدة, fr: 1 heure }
    when: { en: Final exam period, ar: فترة الاختبارات النهائية, fr: Période des examens finaux }

