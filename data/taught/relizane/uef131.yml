notes: >
  Two original pages: the English page (scholar year 2023/2024) and the Arabic page (Arabic-taught version).
  Description, course information, the 6 learning outcomes, the 3-chapter outline, assessment (13.2/8.25/3.3/8.25 + 67)
  and the 12-week calendar are from the English page; calendar sub-topics (angular/radial equation, hydrogen spectrum,
  eigenfunctions of L, Stern-Gerlach, Clebsch-Gordan, 3j/6j and Wigner-Eckart) were added from the Arabic page.
  The Arabic page lists 4 more generic outcomes (consolidate the basic ideas of QM; mathematical tools; apply to real
  quantum systems; computational methods), apparently copied from the QM1 template; they were not kept as separate
  outcomes. The Arabic page's readings ("الفصل 3.2" etc.) are the same sections written right-to-left. Textbooks:
  the English page requires Griffiths 2nd ed. "McGraw Hill (1992)" (as written; the 2nd edition is Pearson 2005),
  the Arabic page the Arabic translation of the 3rd ed.; both kept. "Le Billac" corrected to Le Bellac.
  Years of the Arabic version (2021-2023) are inferred from teaching.yml (2021-2024) and the past exams; check.
  Week of each English problem set assumes PS n is released in the calendar week that lists it. Language of the
  3j/6j notes PDF and of the exams is unknown (left unset). Videos 01-08 are from the Arabic page; 09-10 were never
  uploaded. Not kept: rooms, timetable, office hours, student-portal marks links, course questionnaire, link to the
  previous PHYS402 version.
  UPDATE 24-10-2026: the distance-teaching attestation confirms S5, lecture + tutorials, taught in Arabic, 2022/2023 (it writes "L2", but S5 is L3: level kept as L3). Griffiths corrected to 2nd ed., Pearson Prentice Hall, 2005.
  UPDATE 24-10-2026 (Kamel's answers): Arabic 2021–2023 and English 2023–2024 confirmed. Videos 01–08 are from his YouTube channel.
