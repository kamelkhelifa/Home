description:
  en: |
    <p>This course is a continuation of Quantum Mechanics 1 and aims to deepen the understanding of the basic concepts of Quantum Mechanics 1 through applications to real quantum systems.</p>
    <p>The lectures are organised in three chapters:</p>
    <ol>
      <li><strong>The Schrödinger equation in one dimension</strong>: the harmonic oscillator; the free particle.</li>
      <li><strong>Quantum mechanics in three dimensions</strong>: the Schrödinger equation in spherical coordinates; the hydrogen atom; angular momentum; spin.</li>
      <li><strong>Approximation methods</strong>: time-independent perturbation theory; the variational method; the WKB approximation.</li>
    </ol>
  ar: |
    <p>هذا المقرر هو تتمة لمقرر ميكانيكا الكم 1، ويهدف إلى تعميق فهم المفاهيم الأساسية لميكانيكا الكم 1 من خلال تطبيقات على جمل كمية حقيقية.</p>
    <p>تنتظم المحاضرات في ثلاثة فصول:</p>
    <ol>
      <li><strong>معادلة شرودنغر في بعد واحد</strong>: المتذبذب التوافقي؛ الجسيم الحر.</li>
      <li><strong>ميكانيكا الكم في ثلاثة أبعاد</strong>: معادلة شرودنغر في الإحداثيات الكروية؛ ذرة الهيدروجين؛ الزخم الزاوي؛ اللف المغزلي (السبين).</li>
      <li><strong>الطرق التقريبية</strong>: نظرية الاضطراب المستقلة عن الزمن؛ مبدأ التغير؛ تقريب WKB.</li>
    </ol>
  fr: |
    <p>Ce cours fait suite à Mécanique quantique 1 et vise à approfondir la compréhension des concepts de base de Mécanique quantique 1 à travers des applications à des systèmes quantiques réels.</p>
    <p>Le cours est organisé en trois chapitres :</p>
    <ol>
      <li><strong>L'équation de Schrödinger à une dimension</strong> : l'oscillateur harmonique ; la particule libre.</li>
      <li><strong>La mécanique quantique à trois dimensions</strong> : l'équation de Schrödinger en coordonnées sphériques ; l'atome d'hydrogène ; le moment cinétique ; le spin.</li>
      <li><strong>Méthodes d'approximation</strong> : théorie des perturbations indépendantes du temps ; méthode variationnelle ; approximation WKB.</li>
    </ol>

outcomes:
  - id: LO1
    text:
      en: Solve the Schrödinger equation in one dimension for various potential wells, including the harmonic oscillator.
      ar: حل معادلة شرودنغر في بعد واحد لآبار كمون مختلفة، بما فيها المتذبذب التوافقي.
      fr: Résoudre l'équation de Schrödinger à une dimension pour divers puits de potentiel, dont l'oscillateur harmonique.
  - id: LO2
    text:
      en: Solve the Schrödinger equation in three dimensions.
      ar: حل معادلة شرودنغر في ثلاثة أبعاد.
      fr: Résoudre l'équation de Schrödinger à trois dimensions.
  - id: LO3
    text:
      en: Demonstrate an understanding of angular momentum in quantum mechanics.
      ar: إظهار فهم للزخم الزاوي في ميكانيكا الكم.
      fr: Faire preuve d'une bonne compréhension du moment cinétique en mécanique quantique.
  - id: LO4
    text:
      en: Use quantum mechanics to understand central-potential problems and describe the hydrogen atom.
      ar: توظيف ميكانيكا الكم لفهم مسائل الكمون المركزي ووصف ذرة الهيدروجين.
      fr: Utiliser la mécanique quantique pour comprendre les problèmes à potentiel central et décrire l'atome d'hydrogène.
  - id: LO5
    text:
      en: Appreciate the spin of a particle.
      ar: إدراك مفهوم اللف المغزلي (السبين) للجسيم.
      fr: Appréhender la notion de spin d'une particule.
  - id: LO6
    text:
      en: Use approximation methods to solve complicated quantum-mechanical systems.
      ar: استخدام الطرق التقريبية لحل جمل كمومية معقدة.
      fr: Utiliser des méthodes d'approximation pour résoudre des systèmes quantiques complexes.

