schedule:
  - week: 1
    title: { en: Welcome session, ar: حصة تعريفية, fr: Séance d'accueil }
    activity: { en: Problem set 0, ar: سلسلة 0, fr: Série 0 }
  - week: 2
    title: { en: The harmonic oscillator (1D), ar: المتذبذب التوافقي (بعد واحد), fr: L'oscillateur harmonique (1D) }
    topics:
      en: [Ladder-operator (algebraic) method, Analytic method]
      ar: [الطريقة الجبرية (مؤثرات السلّم), الطريقة التحليلية]
      fr: [Méthode algébrique (opérateurs échelle), Méthode analytique]
    reading: Griffiths §2.3
    activity: { en: Problem set 1, ar: سلسلة 1, fr: Série 1 }
  - week: 3
    title: { en: The free particle (1D), ar: الجسيم الحر (بعد واحد), fr: La particule libre (1D) }
    reading: Griffiths §2.4
    activity: { en: Problem set 2, ar: سلسلة 2, fr: Série 2 }
  - week: 4
    title: { en: Hilbert space and Dirac notation (revision), ar: فضاء هيلبرت وترميز ديراك (مراجعة), fr: Espace de Hilbert et notation de Dirac (révision) }
    topics:
      en: [Bases in Hilbert space (revision), Dirac notation (revision)]
      ar: [الأسس في فضاء هيلبرت (مراجعة), ترميز ديراك (مراجعة)]
      fr: [Bases de l'espace de Hilbert (révision), Notation de Dirac (révision)]
    reading: Griffiths §3.6
    activity: { en: Problem set 3, ar: سلسلة 3, fr: Série 3 }
  - week: 5
    title: { en: The Schrödinger equation in 3D (spherical coordinates), ar: معادلة شرودنغر في 3 أبعاد (الإحداثيات الكروية), fr: L'équation de Schrödinger à 3D (coordonnées sphériques) }
    topics:
      en: [The angular equation, The radial equation]
      ar: [المعادلة الزاوية, المعادلة المدارية (القطرية)]
      fr: [L'équation angulaire, L'équation radiale]
    reading: Griffiths §4.1
    activity: { en: Problem set 4, ar: سلسلة 4, fr: Série 4 }
  - week: 6
    title: { en: The hydrogen atom, ar: ذرة الهيدروجين, fr: L'atome d'hydrogène }
    topics:
      en: [The radial wave function, The spectrum of hydrogen]
      ar: [الدالة الموجية المدارية (القطرية), طيف الهيدروجين]
      fr: [La fonction d'onde radiale, Le spectre de l'hydrogène]
    reading: Griffiths §4.2
    activity: { en: Problem set 5, ar: سلسلة 5, fr: Série 5 }
  - week: 7
    title: { en: Angular momentum · Mid-term exam, ar: الزخم الزاوي · اختبار نصف الفصل, fr: Moment cinétique · Examen de mi-semestre }
    topics:
      en: [Mid-term exam, Angular momentum L, Eigenvalues and eigenfunctions of L]
      ar: [اختبار نصف الفصل, الزخم الزاوي L, القيم والدوال الذاتية لـ L]
      fr: [Examen de mi-semestre, Le moment cinétique L, Valeurs propres et fonctions propres de L]
    reading: Griffiths §4.3
    activity: { en: Problem set 6, ar: سلسلة 6, fr: Série 6 }
    milestone: midterm
  - week: 8
    title: { en: Spin, ar: اللف المغزلي (السبين) S, fr: Le spin }
    topics:
      en: [Spin S, The Stern–Gerlach experiment]
      ar: [اللف المغزلي (السبين) S, تجربة شتيرن-غيرلاخ]
      fr: [Le spin S, L'expérience de Stern–Gerlach]
    reading: Griffiths §4.4
    activity: { en: Problem set 7, ar: سلسلة 7, fr: Série 7 }
  - week: 9
    title: { en: Addition of angular momenta, ar: جمع الزخوم الزاوية, fr: Addition des moments cinétiques }
    topics:
      en: [Addition of angular momenta, Clebsch–Gordan coefficients]
      ar: [جمع الزخوم الزاوية, معاملات كليبش-غوردن]
      fr: [Addition des moments cinétiques, Coefficients de Clebsch–Gordan]
    reading: Griffiths §4.4.3
    activity: { en: Problem set 8, ar: سلسلة 8, fr: Série 8 }
  - week: 10
    title: { en: The free particle in 3D, ar: الجسيم الحر في 3 أبعاد, fr: La particule libre à 3D }
    topics:
      en: [The free particle in 3D, '3j symbols, the Wigner–Eckart theorem, 6j symbols']
      ar: [الجسيم الحر في 3 أبعاد, 'رموز 3j، مبرهنة فيغنر-إيكارت، رموز 6j']
      fr: [La particule libre à 3D, 'Symboles 3j, théorème de Wigner–Eckart, symboles 6j']
    reading: Lecture notes (PDF)
    activity: { en: Problem set 9, ar: سلسلة 9, fr: Série 9 }
  - week: 11
    title: { en: Generalities on approximation methods, ar: عموميات حول الطرق التقريبية, fr: Généralités sur les méthodes d'approximation }
    reading: Griffiths ch. 6–8
    activity: { en: Problem set 10, ar: سلسلة 10, fr: Série 10 }
  - week: 12
    title: { en: Exam review, ar: مراجعة, fr: Révision }
    milestone: review

