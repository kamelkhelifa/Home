  - type: participation
    weight: 3.3
    title: { en: Behaviour and participation in class, ar: السلوك والمشاركة في القاعة, fr: Comportement et participation en classe }
  - type: homework
    weight: 8.25
    title: { en: Problem sets and lecture attendance, ar: أوراق المسائل وحضور المحاضرات, fr: Séries d'exercices et assiduité aux cours }
    detail:
      en: |
        There is one problem sheet each week, due one week later in class. Solving problems is the only way to understand the material presented during lectures.
        (i) Do them yourself: sit down and reason your way through the questions.
        (ii) Identify the concepts and/or equations that are not clear and seek the instructor's help.
        (iii) Try to develop the technical skills needed (mathematics, computing, etc.) while going through the problems.
        (iv) If you get stuck, seek the instructor's help, consult the textbooks, search the web or discuss with classmates.
        (v) Write up the solutions yourself, avoid all kinds of cheating (breach of academic integrity) and verify that your final solutions are logical, clear and complete.
      ar: |
        هناك ورقة مسائل واحدة كل أسبوع، تُسلَّم حلولها بعد أسبوع واحد. حل المسائل هو الطريقة الوحيدة لفهم المحتوى المقدم أثناء المحاضرات.
        أ/ افعلها بنفسك: اجلس وناقش طريق الحل من خلال الأسئلة.
        ب/ حدد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ أو الموجه.
        ج/ حاول تطوير المهارات التقنية المطلوبة (رياضيات، إعلام آلي، إلخ) أثناء حل المسائل.
        د/ إذا واجهتك صعوبة فاطلب المساعدة من الأستاذ أو الموجه، أو راجع الكتب المدرسية، أو ابحث في الإنترنت، أو ناقش زملاءك في الفصل.
        هـ/ اكتب الحلول بنفسك، وتجنب كل أنواع الغش (خرق النزاهة الأكاديمية)، وتحقق من أن الحلول النهائية منطقية وواضحة وكاملة.
      fr: |
        Une série d'exercices est donnée chaque semaine, à rendre une semaine plus tard. Résoudre des problèmes est le seul moyen de comprendre la matière présentée en cours.
        (i) Faites-les vous-même : asseyez-vous et raisonnez question par question.
        (ii) Repérez les notions et/ou équations qui ne sont pas claires et demandez l'aide de l'enseignant.
        (iii) Efforcez-vous de développer les compétences techniques nécessaires (mathématiques, informatique, etc.) en traitant les problèmes.
        (iv) En cas de blocage, demandez l'aide de l'enseignant, consultez les manuels, cherchez sur Internet ou discutez avec vos camarades.
        (v) Rédigez vous-même vos solutions, évitez toute forme de fraude (atteinte à l'intégrité académique) et vérifiez que vos solutions finales sont logiques, claires et complètes.
  - type: final
    weight: 67
    title: { en: Final exam, ar: الاختبار النهائي, fr: Examen final }
    detail: { en: 1 h 30 min, ar: ساعة ونصف, fr: 1 h 30 }
    when: { en: Final exam period, ar: فترة الاختبارات النهائية, fr: Période des examens finaux }
