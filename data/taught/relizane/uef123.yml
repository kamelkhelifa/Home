  fr: "Le contrôle continu compte pour 33 % (13,2 + 8,25 + 3,3 + 8,25). Les travaux pratiques forment une unité distincte d'un crédit dans le programme national de L2, évaluée à 50 % en contrôle continu (séances et comptes rendus) et 50 % à l'examen de TP ; ils n'entrent pas dans le 33/67 ci-dessus."

