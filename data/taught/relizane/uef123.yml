description:
  en: |
    <p>This course explores the fundamental principles of oscillatory systems and wave phenomena, essential for understanding a wide range of physical systems. Topics include <strong>simple harmonic motion</strong>, <strong>damped and forced oscillations</strong>, and <strong>wave propagation</strong>.</p>
    <p>The lectures are organised in seven parts: second-order linear ODEs with constant coefficients; free oscillations in one dimension; forced oscillations in one dimension; free oscillations of systems with two degrees of freedom; generalities on wave propagation; vibrating strings; acoustic waves in fluids.</p>
    <p>Laboratory (TP) experiments:</p>
    <ul>
      <li>Transverse oscillations of vibrating strings</li>
      <li>Electromechanical systems (the electrodynamic loudspeaker)</li>
      <li>Damped oscillations (RLC circuit in free and forced oscillations)</li>
      <li>Coupled oscillations: study of beats</li>
      <li>Coupled oscillations: study of natural frequencies</li>
      <li>Propagation of longitudinal waves in a fluid</li>
      <li>Rheographic tank</li>
      <li>Kundt's tube</li>
      <li>Induction phenomena</li>
    </ul>
  ar: |
    <p>يتناول هذا المقرر المبادئ الأساسية للجمل المهتزة والظواهر الموجية، وهي مبادئ ضرورية لفهم طيف واسع من الجمل الفيزيائية. وتشمل مواضيعه <strong>الحركة التوافقية البسيطة</strong>، و<strong>الاهتزازات المتخامدة والقسرية</strong>، و<strong>انتشار الأمواج</strong>.</p>
    <p>تنتظم المحاضرات في سبعة أجزاء: المعادلات التفاضلية العادية الخطية من الرتبة الثانية ذات المعاملات الثابتة؛ الاهتزازات الحرة في بعد واحد؛ الاهتزازات القسرية في بعد واحد؛ الاهتزازات الحرة للجمل ذات درجتي حرية؛ عموميات حول انتشار الأمواج؛ الأوتار المهتزة؛ الأمواج الصوتية في الموائع.</p>
    <p>تجارب الأعمال التطبيقية:</p>
    <ul>
      <li>الاهتزازات العرضية للأوتار المهتزة</li>
      <li>الجمل الكهروميكانيكية (مكبر الصوت الكهروديناميكي)</li>
      <li>الاهتزازات المتخامدة (دارة RLC في الاهتزازات الحرة والقسرية)</li>
      <li>الاهتزازات المتقارنة: دراسة الضربات</li>
      <li>الاهتزازات المتقارنة: دراسة الترددات الذاتية</li>
      <li>انتشار الأمواج الطولية في مائع</li>
      <li>الحوض الريوغرافي (الكهروليتي)</li>
      <li>أنبوب كونت</li>
      <li>ظواهر التحريض</li>
    </ul>
  fr: |
    <p>Ce cours étudie les principes fondamentaux des systèmes oscillants et des phénomènes ondulatoires, essentiels pour comprendre un large éventail de systèmes physiques. Les thèmes abordés comprennent le <strong>mouvement harmonique simple</strong>, les <strong>oscillations amorties et forcées</strong> et la <strong>propagation des ondes</strong>.</p>
    <p>Le cours est organisé en sept parties : équations différentielles linéaires du second ordre à coefficients constants ; oscillations libres à une dimension ; oscillations forcées à une dimension ; oscillations libres des systèmes à deux degrés de liberté ; généralités sur la propagation des ondes ; cordes vibrantes ; ondes acoustiques dans les fluides.</p>
    <p>Travaux pratiques :</p>
    <ul>
      <li>Oscillations transversales des cordes vibrantes</li>
      <li>Systèmes électromécaniques (le haut-parleur électrodynamique)</li>
      <li>Oscillations amorties (circuit RLC en régimes libre et forcé)</li>
      <li>Oscillations couplées : étude des battements</li>
      <li>Oscillations couplées : étude des fréquences propres</li>
      <li>Propagation des ondes longitudinales dans un fluide</li>
      <li>Cuve rhéographique</li>
      <li>Tube de Kundt</li>
      <li>Phénomènes d'induction</li>
    </ul>

outcomes:
  - id: LO1
    text:
      en: "Understand and describe oscillatory motion: explain the properties and mathematical formulation of simple harmonic motion (SHM), damped and forced oscillations."
      ar: "فهم الحركة الاهتزازية ووصفها: شرح خصائص الحركة التوافقية البسيطة والاهتزازات المتخامدة والقسرية وصياغتها الرياضية."
      fr: "Comprendre et décrire le mouvement oscillatoire : expliquer les propriétés et la formulation mathématique du mouvement harmonique simple et des oscillations amorties et forcées."
  - id: LO2
    text:
      en: "Analyse wave phenomena: apply the principles of wave propagation, including speed, frequency, wavelength and amplitude, to describe mechanical and electromagnetic waves."
      ar: "تحليل الظواهر الموجية: تطبيق مبادئ انتشار الأمواج، بما في ذلك السرعة والتردد وطول الموجة والسعة، لوصف الأمواج الميكانيكية والكهرومغناطيسية."
      fr: "Analyser les phénomènes ondulatoires : appliquer les principes de la propagation des ondes (célérité, fréquence, longueur d'onde, amplitude) pour décrire les ondes mécaniques et électromagnétiques."
  - id: LO3
    text:
      en: "Solve problems involving energy in oscillatory systems: calculate the energy associated with oscillating systems and understand energy conservation in the context of oscillations."
      ar: "حل مسائل تتعلق بالطاقة في الجمل المهتزة: حساب الطاقة المرتبطة بالجمل المهتزة وفهم انحفاظ الطاقة في سياق الاهتزازات."
      fr: "Résoudre des problèmes d'énergie dans les systèmes oscillants : calculer l'énergie associée aux systèmes oscillants et comprendre la conservation de l'énergie dans le contexte des oscillations."
  - id: LO4
    text:
      en: "Explore resonance and damping: analyse systems subject to resonance and damping, including predicting resonance conditions and the impact of damping forces."
      ar: "دراسة التجاوب والتخامد: تحليل الجمل الخاضعة للتجاوب والتخامد، بما في ذلك القدرة على التنبؤ بشروط التجاوب وأثر قوى التخامد."
      fr: "Étudier la résonance et l'amortissement : analyser les systèmes soumis à la résonance et à l'amortissement, notamment prévoir les conditions de résonance et l'effet des forces d'amortissement."
  - id: LO5
    text:
      en: "Understand and apply wave superposition: explain and predict the outcomes of wave interference, superposition and standing waves, including practical applications such as sound and electromagnetic waves."
      ar: "فهم تراكب الأمواج وتطبيقه: شرح نتائج تداخل الأمواج وتراكبها والأمواج المتوقفة والتنبؤ بها، بما في ذلك التطبيقات العملية كالأمواج الصوتية والكهرومغناطيسية."
      fr: "Comprendre et appliquer la superposition des ondes : expliquer et prévoir les résultats des interférences, de la superposition et des ondes stationnaires, y compris dans des applications pratiques comme les ondes sonores et électromagnétiques."
  - id: LO6
    text:
      en: "Use mathematical tools for wave analysis: develop proficiency in using differential equations and trigonometric functions to model oscillatory motion and wave phenomena."
      ar: "استخدام الأدوات الرياضية في تحليل الأمواج: اكتساب الكفاءة في استخدام المعادلات التفاضلية والدوال المثلثية لنمذجة الحركة الاهتزازية والظواهر الموجية."
      fr: "Utiliser les outils mathématiques de l'analyse ondulatoire : maîtriser les équations différentielles et les fonctions trigonométriques pour modéliser le mouvement oscillatoire et les phénomènes ondulatoires."
  - id: LO7
    text:
      en: "Apply wave concepts to real-world situations: interpret and model physical systems such as pendulums, springs, sound waves and light waves in terms of vibrations and wave mechanics."
      ar: "تطبيق المفاهيم الموجية على حالات واقعية: تفسير جمل فيزيائية مثل النواسات والنوابض والأمواج الصوتية والأمواج الضوئية ونمذجتها من منظور الاهتزازات والميكانيكا الموجية."
      fr: "Appliquer les concepts ondulatoires à des situations réelles : interpréter et modéliser des systèmes physiques tels que pendules, ressorts, ondes sonores et ondes lumineuses en termes de vibrations et d'ondes."
  - id: LO8
    text:
      en: "Explore applications in optics and acoustics: relate wave phenomena to applications in optics (e.g. diffraction, interference) and acoustics (e.g. sound waves, beats)."
      ar: "استكشاف التطبيقات في البصريات والصوتيات: ربط الظواهر الموجية بتطبيقاتها في البصريات (مثل الانعراج والتداخل) وفي الصوتيات (مثل الأمواج الصوتية والضربات)."
      fr: "Explorer les applications en optique et en acoustique : relier les phénomènes ondulatoires à leurs applications en optique (diffraction, interférences) et en acoustique (ondes sonores, battements)."

assessment:
  - type: participation
    weight: 13.2
