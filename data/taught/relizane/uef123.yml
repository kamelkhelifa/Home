notes: >
  Single original page (English, scholar year 1446 - 2024/2025); the cleaned ar file is its Arabic translation.
  Course information, description, the 8 learning outcomes, the 14-week calendar, the assessment (33% continuous:
  13.2 tutorial attendance + 8.25 midterm + 3.3 behaviour + 8.25 problem sets; 67% final, 1 h 30) and the textbook
  list are as on the page. The list of nine laboratory experiments (the page's "Laboratory (TP)" table) and the
  seven-part outline (lecture-notes table) were placed in the description. Readings in King were left blank on the
  page ("[King] Sec. ") and are omitted. A TP final exam exists but has no weight on the page. Lab hours (1.5 h/week)
  are taken from the weekly timetable (one lab session). Language of instruction is not stated: set to en (English
  page, no taught_in in teaching.yml); to be confirmed (the course may have been taught in Arabic or French).
  Years: page says 2024/2025 and links a 2024 past paper and TP exam, so 2023-2025; teaching.yml says 2024-2025.
  Typos fixed: "Shaum's" -> Schaum's, "MechanicalVibrations", "sinosoidal"; Bruneaux's publisher "Ed. Marketing" is
  Ellipses (Édition Marketing). Problem-set weeks follow the calendar (PS n in the week that lists it). Language of the
  Drive files is unknown (left unset). The "Vibration and Waves by C.G. King @ UoM" supplementary item had no link and
  was dropped; the "Supplementary (Arabic)" list was empty placeholders. Summaries, video lectures, PS0 and PS8-11
  were never uploaded. Not kept: rooms, timetable, office hours, student-portal marks link, questionnaire.
  UPDATE 24-10-2026: the faculty's distance-teaching attestation confirms L2, S3, lecture + tutorials + lab, taught in English, 2024/2025. Taught set to 2024–2025 (2023–2024 only if Kamel confirms; see the 2024 past papers).
  UPDATE 24-10-2026 (Kamel's answers): taught in English in 2023–2024 and 2024–2025 (2024–2025 attested); all exams are his, so the "2024" past exam and TP exam
  are from 2023–2024. Lab exam weight: per the national L2 SM programme the TP is a separate unit, 50 % continuous / 50 % exam.
