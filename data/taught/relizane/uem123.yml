  en: "These are the weights given on the English-taught page. On the Arabic-taught page the evaluation was: problem sets and assignments 33% (one sheet a week, with the usual advice: work it out yourself, ask for help, write up your own solutions honestly) and final exam 67% (2 hours)."
  ar: "هذه هي الأوزان الواردة في صفحة النسخة المدرَّسة بالإنجليزية. أما في صفحة النسخة المدرَّسة بالعربية فكان التقييم: المسائل والواجبات 33% (ورقة مسائل كل أسبوع، مع النصائح المعتادة: حلّها بنفسك، واطلب المساعدة، واكتب حلولك بنفسك بنزاهة) والاختبار النهائي 67% (ساعتان)."
  fr: "Ces pondérations sont celles de la page de la version enseignée en anglais. Sur la page de la version enseignée en arabe, l'évaluation était : séries d'exercices et devoirs 33 % (une série par semaine, avec les conseils habituels : chercher soi-même, demander de l'aide, rédiger honnêtement ses propres solutions) et examen final 67 % (2 heures)."

schedule:
  - week: 1
    title: { en: Introductory session, ar: حصة تعريفية, fr: Séance d'introduction }
  - week: 2
    title: { en: Numerical integration, ar: التكامل العددي, fr: Intégration numérique }
    topics:
      en: [Trapezoidal method, Simpson's method]
      ar: [طريقة شبه المنحرف, طريقة سمبسون]
      fr: [Méthode des trapèzes, Méthode de Simpson]
    reading: Lecture 1
    activity: { en: TP 1, ar: الأعمال التطبيقية 1, fr: TP 1 }
  - week: 3
    title: { en: "Fortran code: trapezoidal and Simpson", ar: "شيفرة فورتران: شبه المنحرف وسمبسون", fr: "Code Fortran : trapèzes et Simpson" }
    milestone: lab
  - week: 4
    title: { en: Non-linear equations, ar: المعادلات غير الخطية, fr: Équations non linéaires }
    topics:
      en: [Newton's method, Bisection method]
      ar: [طريقة نيوتن, طريقة التنصيف]
      fr: [Méthode de Newton, Méthode de dichotomie]
    reading: Lecture 2
    activity: { en: TP 2, ar: الأعمال التطبيقية 2, fr: TP 2 }
  - week: 5
    title: { en: "Fortran code: Newton and bisection", ar: "شيفرة فورتران: نيوتن والتنصيف", fr: "Code Fortran : Newton et dichotomie" }
    reading: Lecture 2
    activity: { en: TP 2, ar: الأعمال التطبيقية 2, fr: TP 2 }
    milestone: lab
  - week: 6
    title: { en: Gauss elimination without pivoting, ar: طريقة غاوس دون محورة, fr: Méthode de Gauss sans pivot }
    reading: Lecture 3
    activity: { en: TP 3, ar: الأعمال التطبيقية 3, fr: TP 3 }
  - week: 7
    title: { en: Gauss elimination with partial and total pivoting, ar: طريقة غاوس مع المحورة الجزئية والكلية, fr: Méthode de Gauss avec pivot partiel et total }
    reading: Lecture 3
    activity: { en: TP 3, ar: الأعمال التطبيقية 3, fr: TP 3 }
  - week: 8
    title: { en: Gauss–Seidel method, ar: طريقة غاوس-سايدل, fr: Méthode de Gauss–Seidel }
    reading: Lecture 4
    activity: { en: TP 4, ar: الأعمال التطبيقية 4, fr: TP 4 }
  - week: 9
    title: { en: Euler's method, ar: طريقة أويلر, fr: Méthode d'Euler }
    reading: Lecture 5
  - week: 10
    title: { en: Runge–Kutta method, ar: طريقة رونغ-كوتا, fr: Méthode de Runge–Kutta }
    reading: Lecture 5

