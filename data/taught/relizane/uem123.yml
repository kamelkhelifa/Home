description:
  en: |
    <p>This course covers the essential numerical methods that are widely used in physics and chemistry, as well as their implementation in efficient codes and programs.</p>
    <p>The lectures are organised in five parts:</p>
    <ol>
      <li><strong>Recap of programming languages</strong>: Matlab and/or Mathematica and/or Fortran and/or C++.</li>
      <li><strong>Numerical integration</strong>: the trapezoidal method; Simpson's method.</li>
      <li><strong>Numerical solution of non-linear equations</strong>: the bisection method; Newton's method.</li>
      <li><strong>Numerical solution of systems of linear equations</strong>: Gauss's method; the Gauss–Seidel method.</li>
      <li><strong>Numerical solution of ordinary differential equations</strong>: Euler's method; the Runge–Kutta method.</li>
    </ol>
    <p>Each method is coded in Fortran during the computer-lab sessions.</p>
  ar: |
    <p>يتناول هذا المقرر الطرق العددية الأساسية الواسعة الاستعمال في الفيزياء والكيمياء، وكذلك تنفيذها في شيفرات وبرامج فعّالة.</p>
    <p>تنتظم المحاضرات في خمسة أجزاء:</p>
    <ol>
      <li><strong>تذكير بلغات البرمجة</strong>: Matlab و/أو Mathematica و/أو Fortran و/أو C++.</li>
      <li><strong>التكامل العددي</strong>: طريقة شبه المنحرف؛ طريقة سمبسون.</li>
      <li><strong>الحل العددي للمعادلات غير الخطية</strong>: طريقة التنصيف؛ طريقة نيوتن.</li>
      <li><strong>الحل العددي لجمل المعادلات الخطية</strong>: طريقة غاوس؛ طريقة غاوس-سايدل.</li>
      <li><strong>الحل العددي للمعادلات التفاضلية العادية</strong>: طريقة أويلر؛ طريقة رونغ-كوتا.</li>
    </ol>
    <p>تُبرمَج كل طريقة بلغة فورتران في حصص الأعمال التطبيقية على الحاسوب.</p>
  fr: |
    <p>Ce cours couvre les méthodes numériques essentielles largement utilisées en physique et en chimie, ainsi que leur implémentation dans des codes et programmes efficaces.</p>
    <p>Le cours est organisé en cinq parties :</p>
    <ol>
      <li><strong>Rappels sur les langages de programmation</strong> : Matlab et/ou Mathematica et/ou Fortran et/ou C++.</li>
      <li><strong>Intégration numérique</strong> : méthode des trapèzes ; méthode de Simpson.</li>
      <li><strong>Résolution numérique des équations non linéaires</strong> : méthode de dichotomie ; méthode de Newton.</li>
      <li><strong>Résolution numérique des systèmes d'équations linéaires</strong> : méthode de Gauss ; méthode de Gauss–Seidel.</li>
      <li><strong>Résolution numérique des équations différentielles ordinaires</strong> : méthode d'Euler ; méthode de Runge–Kutta.</li>
    </ol>
    <p>Chaque méthode est programmée en Fortran lors des séances de TP sur ordinateur.</p>

