notes: >
  Source: the Arabic UEF223 page (the English WordPress page only links to it); the cleaned en/ar files are
  its translation and original. Course information, description, the four learning outcomes, the 12-week calendar,
  the evaluation (33% continuous assessment marked 8+5+2+5 out of 20, final exam 67%) and the textbook list are
  as on the page; the five-chapter outline in the description comes from the lecture-notes table. Continuous-assessment
  points were converted to percentages of the total (same split as the UEF131 and UEF123 pages). Years: teaching.yml
  says 2020-2023, the page lists past exams 2020-2024 (2022-2024 uploaded); 2020-2024 used, to be confirmed.
  Level "L3, semester 4" is as written on the page (semester 4 is normally L2). Kind set to lecture & tutorials
  because the page gives both. The video lectures (01-18) are listed in the page's own lecture-notes table; only
  lecture 01 carries the KamelKhelifa channel tag, the others are assumed to be from the same channel/playlist.
  Video-solution links 0-3 were duplicates of the PDF solutions and were dropped. Summaries 1-5, solutions 5-10
  videos, and the current-year midterm/final/resit PDFs were never uploaded. Not kept: room and timetable, office
  hours, student-portal marks link, course questionnaire.
  UPDATE 24-10-2026: the faculty's distance-teaching attestation gives L2, S4, lecture + tutorials, taught in Arabic, 2022/2023: level corrected to L2.
  UPDATE 24-10-2026 (Kamel's answers): started at Relizane in September 2021: taught in Arabic 2021–2023 (2022–2023 attested), then in English (2023–2024, the year of the last past exam). Videos 01–18 are all from his YouTube channel.
