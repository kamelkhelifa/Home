description:
  en: |
    <p>This course presents and explains the fundamental principles of quantum mechanics.</p>
    <p>The lectures are organised in five chapters:</p>
    <ol>
      <li><strong>Introduction to quantum phenomena</strong>: black-body radiation and Planck's theory; the photoelectric effect; the Compton effect; the de Broglie hypothesis and wave–particle duality; the Franck–Hertz experiment and the quantisation of energy.</li>
      <li><strong>Describing particles in quantum mechanics</strong>: the wave function and the probabilistic description of physical systems; probability density; expectation value and root mean square; uncertainty; Heisenberg's uncertainty principle.</li>
      <li><strong>The Schrödinger equation in one dimension</strong>: stationary states; the infinite square well; the finite square well.</li>
      <li><strong>The mathematics of quantum mechanics</strong>: Hilbert space; observables and Hermitian operators; Dirac notation; the tensor product of spaces and operators.</li>
      <li><strong>The postulates of quantum mechanics</strong>: description of a state and of physical quantities; measurement of physical quantities; time evolution of the expectation value; the energy–time uncertainty principle.</li>
    </ol>
  ar: |
    <p>هذا المقرر يعرض ويشرح المبادئ الأساسية لميكانيكا الكم.</p>
    <p>تنتظم المحاضرات في خمسة فصول:</p>
    <ol>
      <li><strong>مقدمة في الظواهر الكمومية</strong>: إشعاع الجسم الأسود ونظرية بلانك؛ التأثير الكهروضوئي؛ تأثير كومبتون؛ فرضية دي برولي والازدواجية جسيم-موجة؛ تجربة فرانك-هيرتز وتكميم الطاقة.</li>
      <li><strong>وصف الجسيمات في ميكانيكا الكم</strong>: الدالة الموجية والوصف الاحتمالي للجمل الفيزيائية؛ الكثافة الاحتمالية؛ القيمة المتوقعة والجذر التربيعي المتوسط؛ الارتياب؛ مبدأ الارتياب لهايزنبرغ.</li>
      <li><strong>معادلة شرودنغر في بعد واحد</strong>: الحالات المستقرة؛ البئر المربع اللانهائي؛ البئر المربع المتناهي.</li>
      <li><strong>رياضيات ميكانيكا الكم</strong>: فضاء هيلبرت؛ الملحوظات والمؤثرات الهرميتية؛ ترميز ديراك؛ الجداء التنسوري للفضاءات والمؤثرات.</li>
      <li><strong>مسلمات ميكانيكا الكم</strong>: وصف الحالة والمقادير الفيزيائية؛ قياس المقادير الفيزيائية؛ تطور القيمة المتوقعة مع الزمن؛ مبدأ ارتياب الزمن-الطاقة.</li>
    </ol>
  fr: |
    <p>Ce cours présente et explique les principes fondamentaux de la mécanique quantique.</p>
    <p>Le cours est organisé en cinq chapitres :</p>
    <ol>
      <li><strong>Introduction aux phénomènes quantiques</strong> : rayonnement du corps noir et théorie de Planck ; effet photoélectrique ; effet Compton ; hypothèse de de Broglie et dualité onde–corpuscule ; expérience de Franck–Hertz et quantification de l'énergie.</li>
      <li><strong>Description des particules en mécanique quantique</strong> : fonction d'onde et description probabiliste des systèmes physiques ; densité de probabilité ; valeur moyenne et écart quadratique moyen ; incertitude ; principe d'incertitude de Heisenberg.</li>
      <li><strong>L'équation de Schrödinger à une dimension</strong> : états stationnaires ; puits carré infini ; puits carré fini.</li>
      <li><strong>Outils mathématiques de la mécanique quantique</strong> : espace de Hilbert ; observables et opérateurs hermitiques ; notation de Dirac ; produit tensoriel d'espaces et d'opérateurs.</li>
      <li><strong>Les postulats de la mécanique quantique</strong> : description d'un état et des grandeurs physiques ; mesure des grandeurs physiques ; évolution temporelle de la valeur moyenne ; relation d'incertitude temps–énergie.</li>
    </ol>

outcomes:
  - id: LO1
    text:
      en: Recognise some of the fundamental ideas and concepts of quantum mechanics.
      ar: التعرف على بعض الأفكار والمفاهيم الأساسية في ميكانيكا الكم.
      fr: Reconnaître quelques idées et concepts fondamentaux de la mécanique quantique.
  - id: LO2
    text:
      en: Become familiar with the mathematical tools used in quantum mechanics.
      ar: التعرف على الأدوات الرياضية المستعملة في ميكانيكا الكم.
      fr: Se familiariser avec les outils mathématiques utilisés en mécanique quantique.
  - id: LO3
    text:
      en: Apply the skills acquired to solve a number of one-dimensional quantum problems.
      ar: تطبيق المهارات المكتسبة في حل بعض المسائل الكمومية في بعد واحد.
      fr: Appliquer les compétences acquises à la résolution de problèmes quantiques à une dimension.
  - id: LO4
    text:
      en: Understand the postulates of quantum mechanics.
      ar: التعرف على مسلمات ميكانيكا الكم.
      fr: Comprendre les postulats de la mécanique quantique.

assessment:
  - type: participation
    weight: 13.2
    title: { en: Tutorial attendance, ar: حضور الأعمال الموجهة, fr: Assiduité aux travaux dirigés }
    detail:
      en: 8 of the 20 points of the continuous assessment.
      ar: 8 من 20 نقطة في التقويم المستمر.
      fr: 8 des 20 points du contrôle continu.
  - type: homework
    weight: 8.25
    title: { en: Lecture attendance and assignments, ar: حضور المحاضرات والواجبات, fr: Assiduité aux cours et devoirs }
    detail:
      en: |
        5 of the 20 points of the continuous assessment. There is one problem and exercise sheet every week; solving problems is the only way to understand the material presented in the lectures.
        (a) Do it yourself: sit down and work out the route to the solution through the questions.
        (b) Identify any concepts and/or equations that are unclear, and ask the lecturer or tutor for help.
        (c) Try to develop the technical skills required (mathematics, computing, etc.) while solving the problems.
        (d) If you run into difficulty, ask the lecturer or tutor, consult the textbooks, search online, or discuss it with your classmates.
        (e) Write up the solutions yourself, avoid all forms of cheating (breaches of academic integrity), and check that your final solutions are sensible, clear and complete.
        Solutions are handed in at the start of the tutorial session.
      ar: |
        5 من 20 نقطة في التقويم المستمر. هناك ورقة مسائل وتمارين واحدة كل أسبوع، وحل المسائل هو الطريقة الوحيدة لفهم المحتوى المقدم أثناء المحاضرات.
        أ/ افعلها بنفسك: اجلس وناقش طريق الحل من خلال الأسئلة.
        ب/ حدد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ أو الموجه.
        ج/ حاول تطوير المهارات التقنية المطلوبة (رياضيات، إعلام آلي، إلخ) أثناء حل المسائل.
        د/ إذا واجهتك صعوبة فاطلب المساعدة من الأستاذ أو الموجه، أو راجع الكتب المدرسية، أو ابحث في الإنترنت، أو ناقش زملاءك في الفصل.
        هـ/ اكتب الحلول بنفسك، وتجنب كل أنواع الغش (خرق النزاهة الأكاديمية)، وتحقق من أن الحلول النهائية منطقية وواضحة وكاملة.
        تُسلَّم حلول الواجبات في بداية حصة الأعمال الموجهة.
      fr: |
        5 des 20 points du contrôle continu. Une série d'exercices et de problèmes est donnée chaque semaine ; résoudre des problèmes est le seul moyen de comprendre la matière présentée en cours.
        (a) Faites-le vous-même : asseyez-vous et construisez le chemin vers la solution à travers les questions.
        (b) Repérez les notions et/ou équations qui ne sont pas claires et demandez l'aide de l'enseignant ou du chargé de TD.
        (c) Efforcez-vous de développer les compétences techniques nécessaires (mathématiques, informatique, etc.) en résolvant les problèmes.
        (d) En cas de difficulté, demandez l'aide de l'enseignant ou du chargé de TD, consultez les manuels, cherchez en ligne ou discutez avec vos camarades.
        (e) Rédigez vous-même vos solutions, évitez toute forme de fraude (atteinte à l'intégrité académique) et vérifiez que vos solutions finales sont cohérentes, claires et complètes.
        Les solutions sont remises au début de la séance de TD.
  - type: participation
    weight: 3.3
    title: { en: Participation and conduct, ar: المشاركة والسلوك, fr: Participation et comportement }
    detail:
      en: 2 of the 20 points of the continuous assessment.
      ar: 2 من 20 نقطة في التقويم المستمر.
      fr: 2 des 20 points du contrôle continu.
  - type: midterm
    weight: 8.25
    title: { en: Written test, ar: الفرض, fr: Interrogation écrite }
    detail:
      en: 5 of the 20 points of the continuous assessment.
      ar: 5 من 20 نقطة في التقويم المستمر.
      fr: 5 des 20 points du contrôle continu.
    when: { en: Week 7, ar: الأسبوع 7, fr: Semaine 7 }
  - type: final
    weight: 67
    title: { en: Final exam, ar: الاختبار النهائي, fr: Examen final }
    detail:
      en: One and a half hours.
      ar: ساعة ونصف.
      fr: Une heure et demie.
    when: { en: Final examination period, ar: فترة الاختبارات النهائية, fr: Période des examens finaux }
assessment_note:
  en: "Continuous assessment counts for 33% and is marked out of 20: 8 (tutorial attendance) + 5 (lecture attendance and assignments) + 2 (participation and conduct) + 5 (written test). The percentages above are these points scaled to 33%."
  ar: "يمثل التقويم المستمر 33% ويُنقط على 20: 8 (حضور الأعمال الموجهة) + 5 (حضور المحاضرات والواجبات) + 2 (المشاركة والسلوك) + 5 (الفرض). النسب المذكورة أعلاه هي هذه النقاط محوّلة إلى 33%."
  fr: "Le contrôle continu compte pour 33 % et est noté sur 20 : 8 (assiduité aux TD) + 5 (assiduité aux cours et devoirs) + 2 (participation et comportement) + 5 (interrogation écrite). Les pourcentages ci-dessus correspondent à ces points ramenés à 33 %."

schedule:
  - week: 1
    title: { en: Introduction to quantum phenomena, ar: مقدمة في الظواهر الكمومية, fr: Introduction aux phénomènes quantiques }
    topics:
      en: [Introductory session, Introduction to quantum phenomena]
      ar: [حصة تعريفية, مقدمة في الظواهر الكمومية]
      fr: [Séance d'introduction, Introduction aux phénomènes quantiques]
    reading: Lecture notes (chapter 1)
    activity: { en: Set 1, ar: سلسلة 1, fr: Série 1 }
  - week: 2
    title: { en: The wave function, ar: الدالة الموجية, fr: La fonction d'onde }
    topics:
      en: ['Introduction to quantum phenomena (continued)', 'The wave function, the Schrödinger equation, the statistical interpretation']
      ar: ['مقدمة في الظواهر الكمومية (تتمة)', 'الدالة الموجية، معادلة شرودنغر، التفسير الاحتمالي']
      fr: ['Introduction aux phénomènes quantiques (suite)', "La fonction d'onde, l'équation de Schrödinger, l'interprétation statistique"]
    reading: Griffiths §1.1–1.2
    activity: { en: Set 2, ar: سلسلة 2, fr: Série 2 }
  - week: 3
    title: { en: Probability and normalisation, ar: الاحتمالات والاستنظام, fr: Probabilités et normalisation }
    topics:
      en: [Probability, Normalisation, Momentum]
      ar: [الاحتمالات, الاستنظام, الزخم]
      fr: [Probabilités, Normalisation, Quantité de mouvement]
    reading: Griffiths §1.3–1.5
    activity: { en: Set 3, ar: سلسلة 3, fr: Série 3 }
  - week: 4
    title: { en: Uncertainty principle and stationary states, ar: مبدأ الارتياب والحالات المستقرة, fr: Principe d'incertitude et états stationnaires }
    topics:
      en: [The uncertainty principle, Stationary states]
      ar: [مبدأ الارتياب, الحالات المستقرة]
      fr: [Le principe d'incertitude, États stationnaires]
    reading: Griffiths §1.5, 2.1
    activity: { en: Set 4, ar: سلسلة 4, fr: Série 4 }
  - week: 5
    title: { en: The infinite square well, ar: البئر المربع اللانهائي, fr: Le puits carré infini }
    reading: Griffiths §2.2
    activity: { en: Set 5, ar: سلسلة 5, fr: Série 5 }
  - week: 6
    title: { en: The finite square well, ar: البئر المربع المتناهي, fr: Le puits carré fini }
    reading: Griffiths §2.6
    activity: { en: Set 6, ar: سلسلة 6, fr: Série 6 }
  - week: 7
    title: { en: First test · Hilbert space, ar: الفرض الأول · فضاء هيلبرت, fr: Première interrogation · Espace de Hilbert }
    topics:
      en: [First test, Hilbert space]
      ar: [الفرض الأول, فضاء هيلبرت]
      fr: [Première interrogation, Espace de Hilbert]
    reading: Griffiths §3.1
    activity: { en: Set 7, ar: سلسلة 7, fr: Série 7 }
    milestone: midterm
  - week: 8
    title: { en: Observables and Hermitian operators, ar: الملحوظات والمؤثرات الهرميتية, fr: Observables et opérateurs hermitiques }
    reading: Griffiths §3.2–3.3
    activity: { en: Set 8, ar: سلسلة 8, fr: Série 8 }
  - week: 9
    title: { en: Eigenfunctions of Hermitian operators, ar: الدوال الذاتية للمؤثرات الهرميتية, fr: Fonctions propres des opérateurs hermitiques }
    topics:
      en: [Eigenfunctions of Hermitian operators, The generalised statistical interpretation]
      ar: [الدوال الذاتية للمؤثرات الهرميتية, التفسير الإحصائي المعمم]
      fr: [Fonctions propres des opérateurs hermitiques, L'interprétation statistique généralisée]
    reading: Griffiths §3.4
    activity: { en: Set 9, ar: سلسلة 9, fr: Série 9 }
  - week: 10
    title: { en: States and measurement, ar: الحالات والقياس, fr: États et mesure }
    topics:
      en: [Description of a state and of physical quantities, Measurement of physical quantities]
      ar: [وصف الحالة والمقادير الفيزيائية, قياس المقادير الفيزيائية]
      fr: [Description d'un état et des grandeurs physiques, Mesure des grandeurs physiques]
    reading: Griffiths §3.5
    activity: { en: Set 10, ar: سلسلة 10, fr: Série 10 }
  - week: 11
    title: { en: Time evolution and energy–time uncertainty, ar: التطور الزمني وارتياب الزمن-الطاقة, fr: Évolution temporelle et incertitude temps–énergie }
    topics:
      en: [Time evolution of the expectation value, The energy–time uncertainty principle]
      ar: [تطور القيمة المتوقعة مع الزمن, مبدأ ارتياب الزمن-الطاقة]
      fr: [Évolution temporelle de la valeur moyenne, La relation d'incertitude temps–énergie]
    reading: Griffiths §3.5
    activity: { en: Set 11, ar: سلسلة 11, fr: Série 11 }
  - week: 12
    title: { en: Dirac notation and the tensor product, ar: ترميز ديراك والجداء التنسوري, fr: Notation de Dirac et produit tensoriel }
    topics:
      en: [Dirac notation, The tensor product]
      ar: [ترميز ديراك, الجداء التنسوري]
      fr: [Notation de Dirac, Le produit tensoriel]
    reading: Griffiths §3.6 and lecture notes
    activity: { en: Set 12, ar: سلسلة 12, fr: Série 12 }

