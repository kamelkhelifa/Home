objectives:
  - en: The study of vibrational phenomena with one or several degrees of freedom. The concept of impedance; the phenomenon of resonance.
    ar: دراسة الظواهر الاهتزازية ذات درجة حرية واحدة أو عدة درجات حرية. مفهوم الممانعة، وظاهرة الرنين.
    fr: Étude des phénomènes vibratoires à un ou plusieurs degrés de liberté. Concept d’impédance, phénomène de résonance.
  - en: Highlighting the analogy between mechanical, electrical and electromechanical oscillators. Phase velocity, group velocity, dispersion. Characteristic impedance. The Doppler effect, which will be revisited within the framework of the theory of relativity.
    ar: إبراز التماثل بين الهزازات الميكانيكية والكهربائية والكهروميكانيكية. سرعة الطور، سرعة المجموعة، التبدد. الممانعة المميزة. مفعول دوبلر الذي ستتم العودة إليه في إطار نظرية النسبية.
    fr: Mise en évidence de l’analogie entre les oscillateurs mécaniques, électriques et électromécaniques. Vitesse de phase, vitesse de groupe, dispersion. Impédance caractéristique. Effet Doppler qui sera revu dans le cadre de la théorie de la relativité.

