# Course plan of the French page (2015–2016): Part I (Vibrations) = chapters 1–3, Part II (Waves) = chapters 4–7.
# The source gives chapters, not weeks.
schedule:
  - week: Ch. 1
    title: { en: General properties of vibrations, ar: عموميات حول الاهتزازات, fr: Généralités sur les vibrations }
    topics:
      en: ["Definition of vibrational motion", "Examples of vibrating systems", "Periodic motion"]
      ar: ["تعريف الحركة الاهتزازية", "أمثلة عن الأنظمة الاهتزازية", "الحركات الدورية"]
      fr: ["Définition d’un mouvement vibratoire", "Exemples de systèmes vibratoires", "Mouvements périodiques"]
  - week: Ch. 2
    title: { en: Linear systems with one degree of freedom, ar: الأنظمة الخطية ذات درجة حرية واحدة, fr: Systèmes linéaires à un degré de liberté }
    topics:
      en:
        - "2.1 Free oscillations. The harmonic oscillator. Natural angular frequency of a harmonic oscillator. The energy of a harmonic oscillator"
        - "2.2 Damped free oscillations. Damping forces. Equation of motion. Pseudo-periodic oscillations (logarithmic decrement, quality factor)"
        - "2.3 Forced oscillations. Definition. The case of a sinusoidal driving force (resonance, phase shift). The case of an arbitrary periodic driving force"
        - "2.4 Damped forced oscillations. Equation of motion. Transient regime, steady state. Bandwidth. Quality factor"
        - "2.5 Analogy between mechanical and electrical oscillating systems"
      ar:
        - "2.1 الاهتزازات الحرة. الهزاز التوافقي. النبض الذاتي للهزاز التوافقي. طاقة الهزاز التوافقي"
        - "2.2 الاهتزازات الحرة المتخامدة. قوى التخامد. معادلة الحركة. الاهتزازات شبه الدورية (التناقص اللوغاريتمي، معامل الجودة)"
        - "2.3 الاهتزازات القسرية. تعريف. حالة إثارة جيبية (الرنين، فرق الطور). حالة إثارة دورية كيفية"
        - "2.4 الاهتزازات المتخامدة القسرية. معادلة الحركة. النظام الانتقالي، النظام الدائم. عرض النطاق. معامل الجودة"
        - "2.5 التماثل بين الأنظمة المهتزة الميكانيكية والكهربائية"
      fr:
        - "2.1 Les oscillations libres. L’oscillateur harmonique. Pulsation propre d’un oscillateur harmonique. L’énergie d’un oscillateur harmonique"
        - "2.2 Les oscillations libres amorties. Forces d’amortissement. Équation du mouvement. Oscillations pseudopériodiques (décrément logarithmique, facteur de qualité)"
        - "2.3 Les oscillations forcées. Définition. Cas d’une excitation sinusoïdale (résonance, déphasage). Cas d’une excitation périodique quelconque"
        - "2.4 Les oscillations amorties forcées. Équation du mouvement. Régime transitoire, régime permanent. Bande passante. Facteur de qualité"
        - "2.5 Analogie entre systèmes oscillants mécaniques et électriques"
  - week: Ch. 3
    title: { en: Linear systems with several degrees of freedom, ar: الأنظمة الخطية ذات عدة درجات حرية, fr: Systèmes linéaires à plusieurs degrés de liberté }
    topics:
      en:
        - "3.1 Systems with 2 degrees of freedom: free (natural angular frequencies), damped, and damped and forced"
        - "3.2 Systems with N degrees of freedom (general behaviour)"
      ar:
        - "3.1 الأنظمة ذات درجتي حرية: الحالة الحرة (النبضات الذاتية)، المتخامدة، والمتخامدة القسرية"
        - "3.2 الأنظمة ذات N درجة حرية (السلوك العام)"
      fr:
        - "3.1 Systèmes à 2 degrés de liberté : cas libre (pulsations propres), amorti et amorti forcé"
        - "3.2 Systèmes à N degrés de liberté (comportement général)"
  - week: Ch. 4
    title: { en: General properties of mechanical waves, ar: عموميات حول الأمواج الميكانيكية, fr: Généralités sur les ondes mécaniques }
    topics:
      en:
        - "4.1 Classification of waves"
        - "4.2 General solution of the general equation for travelling waves"
        - "4.3 Phase velocity, group velocity"
        - "4.4 The notion of a wavefront. Examples: plane waves, spherical waves"
        - "4.5 Reflection and transmission of waves"
        - "4.6 Relations between the various quantities describing a wave"
      ar:
        - "4.1 تصنيف الأمواج"
        - "4.2 الحل العام للمعادلة العامة للأمواج المتنقلة"
        - "4.3 سرعة الطور، سرعة المجموعة"
        - "4.4 مفهوم جبهة الموجة. مثال الأمواج المستوية والأمواج الكروية"
        - "4.5 انعكاس الأمواج ونفاذها"
        - "4.6 العلاقة بين مختلف المقادير الممثلة للموجة"
      fr:
        - "4.1 Classification des ondes"
        - "4.2 Intégrale générale de l’équation générale d’ondes progressives"
        - "4.3 Vitesse de phase, vitesse de groupe"
        - "4.4 Notion de front d’onde. Exemple des ondes planes, ondes sphériques"
        - "4.5 Réflexion et transmission des ondes"
        - "4.6 Relation entre les différentes grandeurs représentant l’onde"
  - week: Ch. 5
    title: { en: Transverse waves on a string, ar: الأمواج العرضية على وتر, fr: Ondes transversales sur une corde }
    topics:
      en: ["Wave equation", "Characteristic impedance", "Energy of a travelling wave", "Reflection and transmission of waves", "Standing waves"]
      ar: ["معادلة الانتشار", "الممانعة المميزة", "طاقة الموجة المتنقلة", "انعكاس الأمواج ونفاذها", "الأمواج المستقرة"]
      fr: ["Équation de propagation", "Impédance caractéristique", "Énergie d’une onde progressive", "Réflexion et transmission des ondes", "Ondes stationnaires"]
  - week: Ch. 6
    title: { en: Longitudinal waves in fluids, ar: الأمواج الطولية في الموائع, fr: Ondes longitudinales dans les fluides }
    topics:
      en:
        - "6.1 Plane waves in a cylindrical pipe. Wave equation in a gas. Wave equation in a liquid. Acoustic impedance. Characteristic impedance. Energy carried by a wave. Reflection and transmission coefficients (boundary conditions)"
        - "6.2 The Doppler effect"
      ar:
        - "6.1 الأمواج المستوية في أنبوب أسطواني. معادلة الأمواج في غاز. معادلة الأمواج في سائل. الممانعة الصوتية. الممانعة المميزة. الطاقة التي تنقلها الموجة. معاملا انعكاس الأمواج ونفاذها (الشروط الحدية)"
        - "6.2 مفعول دوبلر"
      fr:
        - "6.1 Ondes planes dans un tuyau cylindrique. Équation d’ondes dans un gaz. Équation d’ondes dans un liquide. Impédance acoustique. Impédance caractéristique. Énergie transportée par une onde. Coefficients de réflexion et de transmission d’ondes (conditions aux limites)"
        - "6.2 Effet Doppler"
  - week: Ch. 7
    title: { en: Elastic waves in solids, ar: الأمواج المرنة في الأجسام الصلبة, fr: Ondes élastiques dans les solides }

