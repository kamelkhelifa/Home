notes: >
  Syllabus (objectives, chapter plan, textbooks, prerequisites) from the French page (2015–2016).
  The English page (2016–2017) is an unfinished skeleton (objectives "Study", syllabus "Vibrations / Waves / ...",
  same three English textbooks, no material links except the animations; prerequisites given as Math2, UEF112, UEF122).
  The Arabic page (و ت أ 321, 2016–2017) has a SUBSTANTIALLY DIFFERENT syllabus, not used above:
  objective "explore in detail vibrating systems and wave motion across many physical systems";
  outcomes "(1) demonstrate an understanding of the behaviour of vibrating systems and of wave motion,
  (2) use the mathematical formalism that describes them, (3) recognise examples in many areas of physics";
  content in 9 items: SHM and energy; damped SHM, Q-value and power response curves; forced SHM, resonance and transients;
  coupled SHM and normal modes; waves and the 1D wave equation; waves at interfaces, energy and power, standing waves;
  2D and 3D wave equation, superposition; phase and group velocity, beats, dispersion; interference and refraction.
  Its prerequisites are و ت أ 111، و ت أ 211، و ت أ 212 and its evaluation a written exam (1h30) — kept only in assessment_note.
  Its three Arabic textbooks were added to textbooks.recommended. Neither the English nor the Arabic page links any file of its own,
  so every material/exam is from the French page (lang fr). Lecture-note and summary titles use the chapter names of the
  tutorial table (chapters 0–8), which differ from the official 7-chapter plan. Past exams labelled "2014" on the page
  (uploaded Feb/May 2015) suggest the course was also taught in 2014–2015: to confirm. E-learning (Moodle) link and marks dropped.
  UPDATE 24-10-2026 (Kamel's answers): taught in French in 2014–2015 and 2015–2016 only (he left for IU in Sept 2016;
  the English and Arabic 2016–2017 sections were planned but never taught, so they and the code و ت أ 321 were removed).
  The 22 animations are his own (published, attached to chapters 2–3). The Delenda sheets stay withheld and are replaced by
  the formula sheet (page-wide card, resources/formulas). Boukli's notes are linked under online resources with the author's name. King's
  SlideShare copy is not linked (the book is cited). Notes/summaries/problem sets attached to the official chapters
  (0 = revision and 1 = Lagrange → Ch. 1; 2–5 → Ch. 2; 6 → Ch. 3; 7 → Ch. 4; 8 → Ch. 5).
  DRAFTED for Kamel's later review: description, the 7 outcomes (built on the Arabic-section outcomes and the official programme)
  and the assessment scheme (standard Algerian LMD 33 % continuous / 67 % exam, as Kamel described).
