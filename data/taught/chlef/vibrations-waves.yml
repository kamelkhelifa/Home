objectives:
  - en: The study of vibrational phenomena with one or several degrees of freedom. The concept of impedance; the phenomenon of resonance.
    ar: دراسة الظواهر الاهتزازية ذات درجة حرية واحدة أو عدة درجات حرية. مفهوم الممانعة، وظاهرة الرنين.
    fr: Étude des phénomènes vibratoires à un ou plusieurs degrés de liberté. Concept d’impédance, phénomène de résonance.
  - en: Highlighting the analogy between mechanical, electrical and electromechanical oscillators. Phase velocity, group velocity, dispersion. Characteristic impedance. The Doppler effect, which will be revisited within the framework of the theory of relativity.
    ar: إبراز التماثل بين الهزازات الميكانيكية والكهربائية والكهروميكانيكية. سرعة الطور، سرعة المجموعة، التبدد. الممانعة المميزة. مفعول دوبلر الذي ستتم العودة إليه في إطار نظرية النسبية.
    fr: Mise en évidence de l’analogie entre les oscillateurs mécaniques, électriques et électromécaniques. Vitesse de phase, vitesse de groupe, dispersion. Impédance caractéristique. Effet Doppler qui sera revu dans le cadre de la théorie de la relativité.

description:
  en: |
    Vibrations and waves are a language shared by almost every branch of physics: mechanics, electricity, acoustics, optics and quantum physics all speak it. This second-year course (semester 3 of the Matter Sciences licence) builds that language step by step.

    The first part studies oscillating systems. Using Lagrange's equations, it treats free, damped and forced oscillations of systems with one degree of freedom, resonance, the quality factor and the bandwidth, and the analogy between mechanical and electrical oscillators. It then moves to coupled systems with two and several degrees of freedom and their normal modes.

    The second part turns to mechanical waves: the wave equation and its general solution, phase and group velocity, transverse waves on a string, longitudinal (acoustic) waves in fluids, characteristic impedance, energy transport, reflection and transmission at a boundary, standing waves, the Doppler effect and, finally, elastic waves in solids.
  ar: |
    الاهتزازات والأمواج لغة تشترك فيها كل فروع الفيزياء تقريبًا: الميكانيكا والكهرباء والصوتيات والضوء وفيزياء الكم. ويبني هذا المقرر، المدرَّس في السنة الثانية (الفصل الثالث من ليسانس علوم المادة)، هذه اللغة خطوة بخطوة.

    يدرس الجزء الأول الأنظمة المهتزة. فباستعمال معادلات لاغرانج يعالج الاهتزازات الحرة والمتخامدة والقسرية للأنظمة ذات درجة حرية واحدة، والرنين، ومعامل الجودة، وعرض النطاق، والتماثل بين الهزازات الميكانيكية والكهربائية، ثم ينتقل إلى الأنظمة المقترنة ذات درجتي حرية وعدة درجات حرية وأنماطها الذاتية.

    ويتناول الجزء الثاني الأمواج الميكانيكية: معادلة الانتشار وحلها العام، وسرعة الطور وسرعة المجموعة، والأمواج العرضية على وتر، والأمواج الطولية (الصوتية) في الموائع، والممانعة المميزة، ونقل الطاقة، والانعكاس والنفاذ عند حد فاصل، والأمواج المستقرة، ومفعول دوبلر، وأخيرًا الأمواج المرنة في الأجسام الصلبة.
  fr: |
    Les vibrations et les ondes forment un langage commun à presque toute la physique : mécanique, électricité, acoustique, optique et physique quantique le parlent toutes. Ce cours de deuxième année (semestre 3 de la licence Sciences de la Matière) construit ce langage pas à pas.

    La première partie étudie les systèmes oscillants. À l'aide des équations de Lagrange, elle traite les oscillations libres, amorties et forcées des systèmes à un degré de liberté, la résonance, le facteur de qualité et la bande passante, ainsi que l'analogie entre oscillateurs mécaniques et électriques. Elle aborde ensuite les systèmes couplés à deux et à plusieurs degrés de liberté et leurs modes propres.

    La seconde partie est consacrée aux ondes mécaniques : l'équation d'onde et sa solution générale, vitesse de phase et vitesse de groupe, ondes transversales sur une corde, ondes longitudinales (acoustiques) dans les fluides, impédance caractéristique, transport d'énergie, réflexion et transmission à une interface, ondes stationnaires, effet Doppler et, enfin, ondes élastiques dans les solides.

outcomes:
  - id: CLO1
    text:
      en: "Describe vibratory motion and write the equation of motion of a system with one degree of freedom using Lagrange's equations."
      ar: "يصف الحركة الاهتزازية ويكتب معادلة حركة نظام ذي درجة حرية واحدة باستعمال معادلات لاغرانج."
      fr: "Décrire un mouvement vibratoire et établir l'équation du mouvement d'un système à un degré de liberté à l'aide des équations de Lagrange."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO2
    text:
      en: "Solve free, damped and forced oscillations and determine the natural frequency, the damping regime, the logarithmic decrement, the quality factor, the resonance and the bandwidth."
      ar: "يحلّ معادلات الاهتزازات الحرة والمتخامدة والقسرية، ويحدّد النبض الذاتي ونظام التخامد والتناقص اللوغاريتمي ومعامل الجودة والرنين وعرض النطاق."
      fr: "Résoudre les oscillations libres, amorties et forcées, et déterminer la pulsation propre, le régime d'amortissement, le décrément logarithmique, le facteur de qualité, la résonance et la bande passante."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO3
    text:
      en: "Use the analogy between mechanical and electrical oscillators, and the notion of impedance, to analyse oscillating systems."
      ar: "يستعمل التماثل بين الهزازات الميكانيكية والكهربائية، ومفهوم الممانعة، لتحليل الأنظمة المهتزة."
      fr: "Exploiter l'analogie entre oscillateurs mécaniques et électriques, et la notion d'impédance, pour analyser des systèmes oscillants."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO4
    text:
      en: "Find the normal modes and natural frequencies of coupled systems with two degrees of freedom, and describe their motion as a superposition of modes."
      ar: "يجد الأنماط الذاتية والنبضات الذاتية للأنظمة المقترنة ذات درجتي حرية، ويصف حركتها بوصفها تراكبًا لهذه الأنماط."
      fr: "Déterminer les modes propres et les pulsations propres de systèmes couplés à deux degrés de liberté, et décrire leur mouvement comme une superposition de modes."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO5
    text:
      en: "Derive and solve the one-dimensional wave equation for a string and for a fluid, and compute the characteristic impedance, the energy carried, and the reflection and transmission coefficients."
      ar: "يستنتج معادلة الانتشار في بعد واحد لوتر ولمائع ويحلّها، ويحسب الممانعة المميزة والطاقة المنقولة ومعاملي الانعكاس والنفاذ."
      fr: "Établir et résoudre l'équation d'onde à une dimension pour une corde et pour un fluide, et calculer l'impédance caractéristique, l'énergie transportée et les coefficients de réflexion et de transmission."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO6
    text:
      en: "Distinguish phase and group velocity, describe standing waves and dispersion, and apply the Doppler effect."
      ar: "يميّز بين سرعة الطور وسرعة المجموعة، ويصف الأمواج المستقرة والتبدد، ويطبّق مفعول دوبلر."
      fr: "Distinguer vitesse de phase et vitesse de groupe, décrire les ondes stationnaires et la dispersion, et appliquer l'effet Doppler."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }
  - id: CLO7
    text:
      en: "Recognise vibrations and waves in many areas of physics and use their common mathematical description."
      ar: "يتعرّف على الاهتزازات والأمواج في مجالات عديدة من الفيزياء ويستعمل وصفها الرياضي المشترك."
      fr: "Reconnaître les vibrations et les ondes dans de nombreux domaines de la physique et utiliser leur description mathématique commune."
    assessed_by: { en: "Tests, homework and final exam", ar: "الاختبارات القصيرة والواجبات والاختبار النهائي", fr: "Interrogations, devoirs et examen final" }

