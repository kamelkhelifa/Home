slug: english
order: 30
codes: [UET121, UET511]
title: { en: English for Physicists, ar: الإنجليزية للفيزيائيين, fr: Anglais pour physiciens }
level:
  en: "Licence · 2nd and 3rd year (S3: English 3 · S5: English 5) · Matter Sciences / Physics"
  ar: "ليسانس · السنتان الثانية والثالثة (S3: الإنجليزية 3 · S5: الإنجليزية 5) · علوم المادة / فيزياء"
  fr: "Licence · 2e et 3e années (S3 : Anglais 3 · S5 : Anglais 5) · Sciences de la Matière / Physique"
area: skills
companion: english-for-physicists   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: "Lectures (1 session/week, no tutorials)", ar: "محاضرات (حصة واحدة في الأسبوع، دون أعمال موجهة)", fr: "Cours (1 séance/semaine, sans TD)" }
taught:
