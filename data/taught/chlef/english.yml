description:
  en: |
    This is formally an English language course for physicists, but there is no detailed programme to comply with.
    The course was therefore designed as a "general physics" course that revises, in English, the physics courses
    the students took from semester 1 to semester 5. The revision is mostly descriptive, since the students have
    already seen the quantitative material. The courses covered are: classical mechanics (S1), electricity and
    magnetism (S2), vibrations and waves (S3), electromagnetism (S4) and quantum mechanics (S4).
  ar: |
    هذا المقرر رسميًا مقرر في اللغة الإنجليزية موجّه للفيزيائيين، غير أنه لا يوجد برنامج تفصيلي يتعيّن الالتزام به.
    لذا صُمّم المقرر ليكون أشبه بمقرر في "الفيزياء العامة" تُراجَع فيه بالإنجليزية مقررات الفيزياء التي درسها الطلبة
    من الفصل الأول حتى الفصل الخامس. وتغلب على هذه المراجعة الصبغة الوصفية، نظرًا إلى أن الطلبة قد درسوا الجانب الكمي
    من قبل. والمقررات المشمولة هي: الميكانيكا الكلاسيكية (S1)، والكهرباء والمغناطيسية (S2)، والاهتزازات والأمواج (S3)،
    والكهرومغناطيسية (S4)، وميكانيكا الكم (S4).
  fr: |
    Il s’agit formellement d’un cours d’anglais destiné aux physiciens, mais il n’existe pas de programme détaillé à respecter.
    Le cours a donc été conçu comme un cours de « physique générale » qui révise, en anglais, les cours de physique suivis
    par les étudiants du semestre 1 au semestre 5. La révision est surtout descriptive, les étudiants ayant déjà vu l’aspect
    quantitatif. Les cours couverts sont : mécanique classique (S1), électricité et magnétisme (S2), vibrations et ondes (S3),
    électromagnétisme (S4) et mécanique quantique (S4).

assessment_note:
  en: "A written end-of-semester exam (with a resit exam). No lecture notes were handed out and no assignments were given."
  ar: "اختبار كتابي في نهاية الفصل (مع اختبار استدراكي). لم تُوزَّع مذكرات محاضرات ولم تُقدَّم واجبات."
  fr: "Un examen écrit de fin de semestre (avec examen de rattrapage). Aucun polycopié n’a été distribué et aucun devoir n’a été donné."

