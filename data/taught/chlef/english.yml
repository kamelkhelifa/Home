notes: >
  Source page is filed under the USTHB branch of the old WordPress site but states "University: UHBC, Academic Year 2015/2016"
  (the page filed under /uhbc/anglais/ is in fact the 2012–2013 USTHB course): the two were swapped on the old site.
  The page covers two codes taught together in 2015–2016: UET121 (LANG3, S3, "Anglais 3", 2nd year) and UET511 (LANG5, S5,
  "Anglais 5", 3rd year); both are listed in codes/taught. No session length is given, so hours are left out.
  The 2015–2016 exam and resit papers (S3, S5) and solutions were listed but never linked. Exam date/time and the two
  marks PDFs (ang_s3_marks1, ang_s5_marks1) dropped. The only linked paper is the past exam labelled "2014" with its solution
  (uploaded Feb 2015, so probably the 2014–2015 exam): to confirm it is yours and whether the course was also taught in 2014–2015.
  UPDATE 24-10-2026 (Kamel's answers): the "2014" exam is his (2014–2015), so 2014–2015 is added to taught (as UET121, the S3
  course of the autumn semester; UET511 that year to confirm). UET121 and UET511 were taught together. Hours 1.5 h/week (one
  lecture session, no tutorials), 14 weeks. DRAFTED for Kamel's later review (no detailed official programme exists for this
  course): the 2 objectives, 5 outcomes, the 14-week plan (built on the description: S1–S5 physics revised in English, then
  reading and writing skills), the 100 % final-exam assessment and the textbooks/online resources.
