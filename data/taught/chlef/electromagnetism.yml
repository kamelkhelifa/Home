objectives:
  - en: To introduce Maxwell's equations and use them to derive the properties of electromagnetic waves, and to introduce simple models for the interaction of electromagnetic fields with matter.
    ar: تقديم معادلات ماكسويل واستخدامها لاستنتاج خصائص الأمواج الكهرومغناطيسية، وتقديم نماذج بسيطة لتفاعل الحقول الكهرومغناطيسية مع المادة.
    fr: Introduire les équations de Maxwell et les utiliser pour dériver les propriétés des ondes électromagnétiques ; introduire des modèles simples pour l’interaction des champs électromagnétiques avec la matière.
  - en: Students will encounter wave equations of the same form as those they met in UEF123 (Vibrations and Waves).
    ar: يصادف الطالب معادلات انتشار لها الشكل نفسه الذي عرفه في المقرر UEF123 (الاهتزازات والأمواج).
    fr: L’étudiant retrouve des équations de propagation de la même forme que celles qu’il a rencontrées en UEF123 (Vibrations et Ondes).

description:
  en: |
    Electromagnetism is the first complete field theory that students meet: four equations, Maxwell's equations, account for electricity, magnetism and light. This second-year course (semester 4 of the Matter Sciences licence) builds them up from the experimental laws and uses them to describe electromagnetic waves.

    After a chapter of mathematical tools (vector analysis, the Dirac delta and Poisson's equation), the course treats electrostatics (Coulomb's and Gauss's laws, the potential, the energy of a charge distribution and the multipole expansion) and magnetostatics (the Lorentz force, the Biot–Savart and Ampère laws, the vector potential and magnetic dipoles). Electrodynamics then brings in Faraday's law of induction, inductance and magnetic energy, and Maxwell's displacement current completes the four equations, in integral and differential form.

    The last part applies Maxwell's equations to electromagnetic plane waves in vacuum, to reflection and refraction at a boundary (the Fresnel equations), to guided waves in lines and waveguides, and finally to fields in materials: polarisation, magnetisation and waves in matter. The same wave equations met in Vibrations and Waves reappear here, now for the electromagnetic field.
  ar: |
    الكهرومغناطيسية أول نظرية حقلية متكاملة يتعرّف عليها الطالب: أربع معادلات، هي معادلات ماكسويل، تفسّر الكهرباء والمغناطيسية والضوء معًا. ويبني هذا المقرر، المدرَّس في السنة الثانية (الفصل الرابع من ليسانس علوم المادة)، هذه المعادلات انطلاقًا من القوانين التجريبية، ثم يستعملها لوصف الأمواج الكهرومغناطيسية.

    بعد فصل في الأدوات الرياضية (التحليل الشعاعي، وتوزيع ديراك، ومعادلة بواسون)، يعالج المقرر الكهروساكنة (قانونا كولوم وغاوس، والكمون، وطاقة توزيع شحني، والنشر متعدد الأقطاب) والمغناطيسية الساكنة (قوة لورنتز، وقانونا بيو-سافار وأمبير، والكمون الشعاعي، وثنائيات الأقطاب المغناطيسية). ثم تُدخل الكهروديناميكا قانون فاراداي للتحريض، والذاتية، والطاقة المغناطيسية، ويُكمل تيار الإزاحة لماكسويل المعادلات الأربع بصيغتيها التكاملية والتفاضلية.

    ويطبّق الجزء الأخير معادلات ماكسويل على الأمواج الكهرومغناطيسية المستوية في الفراغ، وعلى الانعكاس والانكسار عند سطح فاصل (معادلات فرينل)، وعلى الأمواج الموجَّهة في الخطوط والدلائل الموجية، وأخيرًا على الحقول في الأوساط المادية: الاستقطاب، والتمغنط، والأمواج في المادة. وتظهر هنا من جديد معادلات الانتشار نفسها التي دُرست في مقرر الاهتزازات والأمواج، ولكن للحقل الكهرومغناطيسي.
  fr: |
    L'électromagnétisme est la première théorie de champ complète que rencontrent les étudiants : quatre équations, les équations de Maxwell, rendent compte à la fois de l'électricité, du magnétisme et de la lumière. Ce cours de deuxième année (semestre 4 de la licence Sciences de la Matière) les construit à partir des lois expérimentales et les utilise pour décrire les ondes électromagnétiques.

    Après un chapitre d'outils mathématiques (analyse vectorielle, distribution de Dirac, équation de Poisson), le cours traite l'électrostatique (lois de Coulomb et de Gauss, potentiel, énergie d'une distribution de charges, développement multipolaire) et la magnétostatique (force de Lorentz, lois de Biot-Savart et d'Ampère, potentiel vecteur, dipôles magnétiques). L'électrodynamique introduit ensuite la loi d'induction de Faraday, l'inductance et l'énergie magnétique, et le courant de déplacement de Maxwell complète les quatre équations, sous forme intégrale et différentielle.

    La dernière partie applique les équations de Maxwell aux ondes planes électromagnétiques dans le vide, à la réflexion et à la réfraction à une interface (équations de Fresnel), aux ondes guidées dans les lignes et les guides d'ondes, et enfin aux champs dans les milieux matériels : polarisation, aimantation et ondes dans la matière. Les équations d'onde vues en Vibrations et Ondes réapparaissent ici, cette fois pour le champ électromagnétique.

# "By the end of the course, successful students will be able to:"
outcomes:
  - id: CLO1
    text:
      en: describe the electric field and potential, and related concepts, for stationary charges.
      ar: وصف الحقل الكهربائي والكمون، والمفاهيم المرتبطة بهما، للشحنات الساكنة.
      fr: décrire le champ électrique et le potentiel, et les concepts connexes, des charges stationnaires.
  - id: CLO2
    text:
      en: calculate the electrostatic properties of simple charge distributions using Coulomb's law, Gauss's law and the electric potential.
      ar: حساب الخصائص الكهروساكنة لتوزيعات شحنية بسيطة باستخدام قانون كولوم وقانون غاوس والكمون الكهربائي.
      fr: calculer les propriétés électrostatiques des distributions de charge simples en utilisant la loi de Coulomb, la loi de Gauss et le potentiel électrique.
  - id: CLO3
    text:
      en: describe the magnetic field for steady currents and moving charges.
      ar: وصف الحقل المغناطيسي للتيارات المستقرة والشحنات المتحركة.
      fr: décrire le champ magnétique pour des courants « stables » et des charges en mouvement.
  - id: CLO4
    text:
      en: calculate the magnetic properties of simple current distributions using the Biot–Savart law and Ampère's law.
      ar: حساب الخصائص المغناطيسية لتوزيعات تيار بسيطة باستخدام قانوني بيو-سافار وأمبير.
      fr: calculer les propriétés magnétiques des distributions de courants simples à l’aide des lois de Biot-Savart et d’Ampère.
  - id: CLO5
    text:
      en: describe electromagnetic induction and related concepts, and carry out calculations using Faraday's and Lenz's laws.
      ar: وصف التحريض الكهرومغناطيسي والمفاهيم المرتبطة به، وإجراء الحسابات باستخدام قانوني فاراداي ولنز.
      fr: décrire l’induction électromagnétique et les concepts connexes, et effectuer des calculs à l’aide des lois de Faraday et de Lenz.
  - id: CLO6
    text:
      en: state Maxwell's equations and demonstrate an understanding of them and of their derivation from the empirical laws of electromagnetism.
      ar: معرفة معادلات ماكسويل وإظهار فهمها وفهم كيفية استنتاجها من القوانين التجريبية للكهرومغناطيسية.
      fr: connaître et démontrer une compréhension des équations de Maxwell et de leur dérivation à partir des lois empiriques de l’électromagnétisme.
  - id: CLO7
    text:
      en: apply the fundamental laws of electromagnetism to solve simple problems in electrostatics, magnetostatics and electromagnetic induction in vacuum.
      ar: استخدام القوانين الأساسية للكهرومغناطيسية لحل مسائل بسيطة في الكهروساكنة والمغناطيسية الساكنة والتحريض الكهرومغناطيسي في الفراغ.
      fr: utiliser les lois fondamentales de l’électromagnétisme pour résoudre des problèmes simples d’électrostatique, de magnétostatique et d’induction électromagnétique dans le vide.
  - id: CLO8
    text:
      en: demonstrate an understanding of the properties of electromagnetic plane waves in vacuum and be able to derive these properties from Maxwell's equations.
      ar: إظهار فهم لخصائص الأمواج الكهرومغناطيسية المستوية في الفراغ، والقدرة على استنتاج هذه الخصائص من معادلات ماكسويل.
      fr: démontrer une compréhension des propriétés des ondes planes électromagnétiques dans le vide et être en mesure de tirer ces propriétés des équations de Maxwell.

