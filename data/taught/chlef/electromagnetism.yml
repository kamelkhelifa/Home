# Course plan (chapters; the source gives no week-by-week calendar)
schedule:
  - week: Ch. 1
    title: { en: Mathematical tools, ar: الأدوات الرياضية, fr: Outils mathématiques }
    topics:
      en: ["Vector analysis (gradient, divergence, curl and Laplacian)", "The Dirac delta distribution and point particles", "Poisson's and Laplace's equations"]
      ar: ["التحليل الشعاعي (التدرج والتباعد والدوار واللابلاسي)", "توزيع ديراك دلتا والجسيمات النقطية", "معادلتا بواسون ولابلاس"]
      fr: ["Analyse vectorielle (gradient, divergence, rotationnel et laplacien)", "La distribution delta de Dirac et les particules ponctuelles", "Les équations de Poisson et de Laplace"]
  - week: Ch. 2
    title: { en: Electrostatics, ar: الكهروساكنة, fr: Électrostatique }
    topics:
      en: ["Coulomb's law", "The electric field", "Continuous charge distributions and Gauss's law", "The electrostatic potential", "Poisson's and Laplace's equations", "Work done by an electrostatic force", "Multipole expansion"]
      ar: ["قانون كولوم", "الحقل الكهربائي", "التوزيع المستمر للشحنة وقانون غاوس", "الكمون الكهروساكن", "معادلتا بواسون ولابلاس", "عمل القوة الكهروساكنة", "النشر متعدد الأقطاب"]
      fr: ["Loi de Coulomb", "Le champ électrique", "Distribution continue de charge et loi de Gauss", "Potentiel électrostatique", "Les équations de Poisson et de Laplace", "Travail d’une force électrostatique", "Développement multipolaire"]
  - week: Ch. 3
    title: { en: Magnetostatics, ar: المغناطيسية الساكنة, fr: Magnétostatique }
    topics:
      en: ["The magnetic field", "The Lorentz force", "The Biot–Savart law and Ampère's law", "The magnetic vector potential", "Magnetic dipoles", "Multipole expansion"]
      ar: ["الحقل المغناطيسي", "قوة لورنتز", "قانون بيو-سافار وقانون أمبير", "الكمون الشعاعي المغناطيسي", "ثنائيات الأقطاب المغناطيسية", "النشر متعدد الأقطاب"]
      fr: ["Champ magnétique", "Force de Lorentz", "Loi de Biot-Savart et loi d’Ampère", "Potentiel vecteur magnétique", "Dipôles magnétiques", "Développement multipolaire"]
  - week: Ch. 4
    title: { en: "Electrodynamics and Maxwell's equations", ar: الكهروديناميكا ومعادلات ماكسويل, fr: Électrodynamique et équations de Maxwell }
    topics:
      en: ["Electromotive force (emf)", "Electromagnetic induction", "Faraday's and Lenz's laws", "Inductance", "Energy in magnetic fields", "The integral and differential forms of Maxwell's equations", "The potential formulation"]
      ar: ["القوة المحركة الكهربائية", "التحريض الكهرومغناطيسي", "قانونا فاراداي ولنز", "الذاتية (المحاثة)", "الطاقة في الحقول المغناطيسية", "الصيغتان التكاملية والتفاضلية لمعادلات ماكسويل", "الصياغة بدلالة الكمونات"]
      fr: ["Force électromotrice (fém)", "L’induction électromagnétique", "Lois de Faraday et de Lenz", "L’inductance", "L’énergie dans les champs magnétiques", "Les formes intégrale et différentielle des équations de Maxwell", "Formulation en potentiels"]
  - week: Ch. 5
    title: { en: Propagation of electromagnetic waves, ar: انتشار الأمواج الكهرومغناطيسية, fr: Propagation des ondes électromagnétiques }
    topics:
      en: ["Propagation of electromagnetic plane waves in vacuum", "Reflection and refraction: the laws of reflection and refraction", "The Fresnel equations", "Guided waves: propagation along a straight line, coaxial lines, rectangular and hollow waveguides"]
      ar: ["انتشار الأمواج الكهرومغناطيسية المستوية في الفراغ", "الانعكاس والانكسار: قانونا الانعكاس والانكسار", "معادلات فرينل", "الأمواج الموجهة: الانتشار على خط مستقيم، الخط المحوري، الدلائل الموجية المستطيلة والمجوفة"]
      fr: ["Propagation des ondes planes électromagnétiques dans le vide", "Réflexion et réfraction : lois de la réflexion et de la réfraction", "Les équations de Fresnel", "Ondes guidées : propagation en ligne droite, ligne coaxiale, guides d’ondes rectangulaires et creux"]
  - week: Ch. 6
    title: { en: Electromagnetism in materials, ar: الكهرومغناطيسية في المواد, fr: L’électromagnétisme dans les milieux matériels }
    topics:
      en: ["Electrostatics in materials", "Magnetostatics in materials", "Maxwell's equations and electromagnetic waves in materials"]
      ar: ["الكهروساكنة في المواد", "المغناطيسية الساكنة في المواد", "معادلات ماكسويل والأمواج الكهرومغناطيسية في المواد"]
      fr: ["Électrostatique dans les matériaux", "Magnétostatique dans les matériaux", "Les équations de Maxwell et les ondes électromagnétiques dans les matériaux"]

