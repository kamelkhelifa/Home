notes: >
  Everything from the French page (2015–2016). The English page (2016–2017) is an unfinished copy of the same syllabus
  (same code, hours, prerequisites, chapters and textbooks, minus the French book; objectives and outcomes truncated with "..."),
  with evaluation written "Other (33%) + Exam (67%)" — same weights; it links no files of its own, only the same external resources.
  So the two offerings do not differ in substance and all materials/exams are French (lang fr).
  Light fixes: "Electrodynamique est les équations" → "et"; "Géostatistique dans les matériaux" → "Magnétostatique".
  The 33 % continuous assessment is typed "quiz" (the page lists Tests 1–2, but does not say how the 33 % is made up).
  The only linked exam is labelled "2014" on the page (file uploaded April 2016): for a semester-4 course this may be
  spring 2014 (before the Chlef appointment) or 2014–2015 — authorship/year to confirm. Test, exam and resit papers of
  2015–2016 were listed but never linked. Marks (groups G1–4) dropped.
  UPDATE 24-10-2026 (Kamel's answers): taught only in French, in 2014–2015 and 2015–2016 (he moved to Chlef in Oct 2014 and
  left for IU in Sept 2016, so the 2016–2017 English section was never taught and is removed). The "2014" exam is his (2014–2015).
  Continuous assessment 33 % = tests 1–2, participation, homework and attendance. Notes, summary and problem sets attached to
  their chapters. Landau & Lifshitz: cited under textbooks; the archive.org copy stays unlinked (third-party upload of a copyrighted book).
  The formula sheet comes from the page-wide card (resources/formulas). DRAFTED for Kamel's later review: description and the assessment details.
