slug: phys342
order: 50
codes: [PHYS 342]
title: { en: Modern Physics II, ar: الفيزياء الحديثة 2 }
level: { en: Semester 3, ar: الفصل الدراسي الثالث }
area: modern
companion: modern-physics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture, ar: محاضرات }
taught:
  - { years: 2017–2018, code: PHYS 342, lang: en }
hours: { lecture: 3, tutorial: 0 }
weeks: 15
prerequisites: { en: PHYS 241, ar: PHYS 241 }

description:
  en: |
    The Schrödinger equation and its applications, the hydrogen atom in quantum physics, quantum numbers, angular momentum,
    intrinsic spin, energy levels and spectroscopy, the Zeeman effect, fine structure, Pauli's exclusion principle, the
    periodic table, properties of elements, X-rays, optical spectra, band theory in solids, electrons in metals,
    superconductivity, semiconductors, nuclear structure and radioactivity.
  ar: |
    معادلة شرودنغر وتطبيقاتها، ذرة الهيدروجين في فيزياء الكم، الأعداد الكمومية، الزخم الزاوي، اللف المغزلي الذاتي (السبين)، مستويات الطاقة
    والمطيافية، ظاهرة زيمان، البنية الدقيقة، مبدأ الاستبعاد لباولي، الجدول الدوري، خصائص العناصر، الأشعة السينية، الأطياف الضوئية، نظرية
    العصابات في الأجسام الصلبة، الإلكترونات في المعادن، الموصلية الفائقة، أشباه الموصلات، البنية النووية والنشاط الإشعاعي.

objectives:
  - en: The course is intended to take the student from the classical (Newtonian) to the modern (quantum) view of physics. It teaches the fundamentals of quantum physics and other main features of modern physics.
    ar: يهدف هذا المقرر إلى نقل الطالب من التصور الكلاسيكي (النيوتوني) للفيزياء إلى تصورها الحديث (الكمومي)، إذ يقدّم أسس فيزياء الكم وغيرها من السمات الرئيسة للفيزياء الحديثة.

# Chapters 0–5 of the source syllabus, with the weeks given there.
schedule:
  - week: 1
    title: { en: Review of the old quantum theory, ar: مراجعة لميكانيكا الكم القديمة }
  - week: "2–4"
    title: { en: Quantum mechanics in one dimension, ar: ميكانيكا الكم في بعد واحد }
    topics:
      en: [Born interpretation, Wave function for a free particle, Wave function in the presence of forces, A particle in a box (infinite potential well), The quantum oscillator, Expectation values, Observables and operators]
      ar: [تفسير بورن, الدالة الموجية لجسيم حر, الدالة الموجية في وجود قوى, جسيم في صندوق (بئر جهد لانهائي), المهتز الكمومي, القيم المتوقعة, المقادير القابلة للرصد والمؤثرات]
  - week: "5–7"
    title: { en: The Schrödinger equation in three dimensions, ar: معادلة شرودنغر في ثلاثة أبعاد }
    topics:
      en: [A particle in a 3D box, Central forces and angular momentum, Space quantization, Atomic hydrogen and hydrogen-like ions]
      ar: [جسيم في صندوق ثلاثي الأبعاد, القوى المركزية والزخم الزاوي, التكميم الفضائي, ذرة الهيدروجين والأيونات الشبيهة بالهيدروجين]
  - week: "8–10"
    title: { en: Atomic structure, ar: البنية الذرية }
    topics:
      en: [Orbital magnetism and the normal Zeeman effect, The spinning electron, Spin–orbit coupling, Exchange symmetry and the exclusion principle, The periodic table, Bonding in molecules and solids]
      ar: [المغناطيسية المدارية وظاهرة زيمان العادية, الإلكترون المغزلي, الاقتران المغزلي-المداري, تناظر التبادل ومبدأ الاستبعاد, الجدول الدوري, الروابط في الجزيئات والأجسام الصلبة]
  - week: 11
    title: { en: Solid state, ar: الحالة الصلبة }
    topics:
      en: [Classical free-electron model, Band theory, Superconductivity]
      ar: [النموذج الكلاسيكي للإلكترون الحر, نظرية العصابات, الموصلية الفائقة]
  - week: "12–15"
    title: { en: Nuclear structure, ar: البنية النووية }
    topics:
      en: [Properties of nuclei, Binding energy, Nuclear models, Radioactivity, Decay processes]
      ar: [خصائص الأنوية, طاقة الربط, النماذج النووية, النشاط الإشعاعي, عمليات الاضمحلال]

