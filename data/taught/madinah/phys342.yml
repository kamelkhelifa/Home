slug: phys342
order: 50
codes: [PHYS 342]
title: { en: Modern Physics II, ar: الفيزياء الحديثة 2 }
level: { en: "Level 6", ar: "المستوى السادس" }
area: modern
companion: modern-physics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture, ar: محاضرات }
taught:
  - { years: 2017–2018, code: PHYS 342, lang: en }
  - { years: 2016–2017, code: PHYS 342, lang: en }
hours: { lecture: 3, tutorial: 0 }
weeks: 15
prerequisites: { en: PHYS 241, ar: PHYS 241 }

description:
  en: |
    The Schrödinger equation and its applications, the hydrogen atom in quantum physics, quantum numbers, angular momentum,
    intrinsic spin, energy levels and spectroscopy, the Zeeman effect, fine structure, Pauli's exclusion principle, the
    periodic table, properties of elements, X-rays, optical spectra, band theory in solids, electrons in metals,
    superconductivity, semiconductors, nuclear structure and radioactivity.
  ar: |
    معادلة شرودنغر وتطبيقاتها، ذرة الهيدروجين في فيزياء الكم، الأعداد الكمومية، الزخم الزاوي، اللف المغزلي الذاتي (السبين)، مستويات الطاقة
    والمطيافية، ظاهرة زيمان، البنية الدقيقة، مبدأ الاستبعاد لباولي، الجدول الدوري، خصائص العناصر، الأشعة السينية، الأطياف الضوئية، نظرية
    العصابات في الأجسام الصلبة، الإلكترونات في المعادن، الموصلية الفائقة، أشباه الموصلات، البنية النووية والنشاط الإشعاعي.

objectives:
  - en: The course is intended to take the student from the classical (Newtonian) to the modern (quantum) view of physics. It teaches the fundamentals of quantum physics and other main features of modern physics.
    ar: يهدف هذا المقرر إلى نقل الطالب من التصور الكلاسيكي (النيوتوني) للفيزياء إلى تصورها الحديث (الكمومي)، إذ يقدّم أسس فيزياء الكم وغيرها من السمات الرئيسة للفيزياء الحديثة.

outcomes:
  - id: CLO1
    text: { en: "Explain why classical physics fails for atoms and radiation, and summarise the results of the old quantum theory.", ar: "يشرح أسباب فشل الفيزياء الكلاسيكية في وصف الذرات والإشعاع، ويلخّص نتائج نظرية الكم القديمة." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }
  - id: CLO2
    text: { en: "Apply the Born interpretation and solve the Schrödinger equation for simple one-dimensional systems (free particle, infinite well, quantum oscillator), and compute expectation values.", ar: "يطبّق تفسير بورن ويحلّ معادلة شرودنغر لأنظمة بسيطة في بعد واحد (الجسيم الحر، البئر اللانهائي، المهتز الكمومي)، ويحسب القيم المتوقعة." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }
  - id: CLO3
    text: { en: "Solve the Schrödinger equation in three dimensions for a box and for central forces, and describe the hydrogen atom with its quantum numbers and space quantization.", ar: "يحلّ معادلة شرودنغر في ثلاثة أبعاد لصندوق وللقوى المركزية، ويصف ذرة الهيدروجين بأعدادها الكمومية وتكميمها الفضائي." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }
  - id: CLO4
    text: { en: "Describe orbital magnetism, the Zeeman effect, electron spin and spin–orbit coupling, and use the exclusion principle to explain the periodic table.", ar: "يصف المغناطيسية المدارية وظاهرة زيمان واللف المغزلي للإلكترون والاقتران المغزلي-المداري، ويستخدم مبدأ الاستبعاد لتفسير الجدول الدوري." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }
  - id: CLO5
    text: { en: "Describe the free-electron and band models of solids and the main features of superconductivity.", ar: "يصف نموذجي الإلكترون الحر والعصابات في الأجسام الصلبة والسمات الرئيسة للموصلية الفائقة." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }
  - id: CLO6
    text: { en: "Describe the properties and models of nuclei, binding energy and radioactive decay, and carry out simple calculations on them.", ar: "يصف خصائص الأنوية ونماذجها وطاقة الربط والاضمحلال الإشعاعي، ويُجري حسابات بسيطة عليها." }
    assessed_by: { en: "Quizzes, midterm tests and final exam", ar: "الاختبارات القصيرة والنصفية والاختبار النهائي" }

