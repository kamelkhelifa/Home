notes: >
  Scholar year "1439 - 2017/2018" → taught 2017–2018 (page, notes, homework and exams in English). General information
  kept: semester 3 (as written on the page), 3 lecture sessions/week (50 min), no tutorials, prerequisite PHYS 241. The page
  gives no evaluation weights and no learning outcomes (placeholders). Objective and description from the page. The
  syllabus numbers its chapters 0–5 and attaches week numbers to each lecture-note file (weeks 1–15), so the schedule uses
  those week ranges. The lecture notes of weeks 1–14, homework 2–3 and solution 2 carry old-style Drive ids (uploaded
  before about mid-2017), which, with the
  past exam "1438(S1)", suggests he also taught the course in 2016–2017; that offering is not added to `taught:` — please
  confirm (and add it if so). The 1438(S1) past exam is kept as session 2016–2017 on that assumption; the 1437 papers are
  pending. Not linked in the source (left out): summaries W1–W15, HW1, solutions 7–15. Dropped silently: the marks link
  (student grades) and "IU website" marks.
