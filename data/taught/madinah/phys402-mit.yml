notes: >
  Separate offering of PHYS 402 with its own syllabus (5 outcomes; linear algebra, Schrödinger/Heisenberg pictures,
  angular momentum, identical particles, time-independent perturbation theory; no variational/WKB). Evaluation
  20/20/20/40 and "10 best problem sheets count" exactly as on the page. Calendar readings are Griffiths chapters;
  weeks 5–6 (quantum dynamics) only say "[Gr]". YEAR TO CONFIRM: the English page says "semester 6 - 1440/41 - 2019/20",
  but the Griffiths-based PHYS 402 page gives the same semester, time slot and days, so one of them is a copy. Put
  this version in 2018–2019 because (i) the Arabic page "فيز 402" (1439/40 = 2018–2019) links to this page and has the same
  20/20/20/40 weights, (ii) 20/20/20/40 is the 2018–2019 scheme of his Arabic pages (PHYS 401, 321), while his 2019–2020
  pages use 10/25/25/40, and (iii) this page has the complete set of periodic and final exams, the Griffiths page none.
  Exams and the exam formula sheet are kept as his own (exams set at Madinah); confirm none is copied from MIT 8.05 exams.
  The 1439(S2) past exam (2017–2018) listed on this page is recorded in phys402.yml. Problem sets 8–11, solutions 8–11,
  summaries and exercise solutions had no links. Dropped: time/venue, office hours, marks (Blackboard), questionnaire.
