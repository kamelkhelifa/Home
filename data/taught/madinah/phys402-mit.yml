slug: phys402-mit
order: 90
codes: [PHYS 402]
title: { en: Quantum Mechanics II (MIT-based), ar: ميكانيكا الكم 2 (وفق مقرر MIT) }
tagline: { en: A version of PHYS 402 built on MIT's 8.05 Quantum Physics II., ar: نسخة من المقرر PHYS 402 مبنية على مقرر MIT 8.05 فيزياء الكم 2. }
level: { en: "Undergraduate · Level 6", ar: "مرحلة البكالوريوس · المستوى السادس" }
area: quantum
companion: quantum-mechanics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture & tutorials, ar: محاضرات وأعمال موجهة }
taught:
  - { years: 2018–2019, code: PHYS 402, lang: en }
hours: { lecture: 3, tutorial: 1 }
weeks: 15
prerequisites: { en: Quantum Mechanics I (PHYS 401/354), ar: ميكانيكا الكم 1 (PHYS 401/354) }

description:
  en: |
    This course is a continuation of PHYS 401: Quantum Mechanics I. It reviews previous material with slightly more advanced techniques and introduces approximation methods that help in solving the Schrödinger equation for complicated systems.
  ar: |
    هذا المقرر امتداد للمقرر PHYS 401: ميكانيكا الكم 1. يراجع المحتوى السابق بتقنيات أكثر تقدمًا بعض الشيء، ويقدّم طرق التقريب التي تساعد على حل معادلة شرودنغر للأنظمة المعقدة.

outcomes:
  - id: CLO1
    text: { en: Describe quantum wave mechanics using the Schrödinger equation., ar: وصف الميكانيكا الموجية الكمومية باستعمال معادلة شرودنغر. }
  - id: CLO2
    text: { en: Demonstrate an understanding of the linear algebra underlying quantum mechanics and apply it in quantum-mechanical applications., ar: إظهار فهم للجبر الخطي الذي تقوم عليه ميكانيكا الكم وتوظيفه في تطبيقاتها. }
  - id: CLO3
    text: { en: Distinguish between the Schrödinger and Heisenberg pictures of quantum mechanics and use either of them to solve quantum problems., ar: التمييز بين صورتي شرودنغر وهايزنبرغ في ميكانيكا الكم والقدرة على استعمال أيٍّ منهما في حل المسائل الكمومية. }
  - id: CLO4
    text: { en: Demonstrate a thorough understanding of the angular momentum and spin of particles and their addition., ar: إظهار فهم معمّق للزخم الزاوي وسبين الجسيمات وجمعهما. }
  - id: CLO5
    text: { en: Use time-independent perturbation theory to understand quantum systems and their properties., ar: استعمال نظرية الاضطراب المستقلة عن الزمن لفهم الأنظمة الكمومية وخواصها. }

assessment:
  - type: homework
    weight: 20
    title: { en: Problem sets, ar: أوراق المسائل }
    detail:
      en: >
        One problem sheet each week, due one week later. Solving problems is the only way to understand the material
        presented in lectures: (i) do them yourself and reason your way through the questions; (ii) identify the concepts and/or
        equations that are not clear and seek the instructor's help; (iii) develop the technical skills needed (mathematics,
        computing, etc.) while working through the problems; (iv) if you get stuck, seek the instructor's help, consult the
        textbooks, search the web or discuss with classmates; (v) write up the solutions yourself, avoid any kind of cheating
        (breach of academic integrity) and check that your final solutions are logical, clear and complete.
      ar: >
        ورقة مسائل واحدة كل أسبوع، تُسلَّم بعد أسبوع واحد. حل المسائل هو الطريقة الوحيدة لفهم المحتوى المقدم أثناء المحاضرات:
        (أ) حلّها بنفسك وتدرّج في التفكير خلال الأسئلة؛ (ب) حدّد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ؛
        (ج) طوّر المهارات التقنية المطلوبة (رياضيات، إعلام آلي... إلخ) أثناء حل المسائل؛ (د) إذا واجهتك صعوبة فاطلب مساعدة الأستاذ،
        أو راجع الكتب المقررة، أو ابحث في الإنترنت، أو ناقش زملاءك؛ (هـ) اكتب الحلول بنفسك، وتجنّب كل أنواع الغش (خرق النزاهة الأكاديمية)،
        وتحقق من أن حلولك النهائية منطقية وواضحة وكاملة.
  - type: midterm
    weight: 20
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال وقت المحاضرة العادي }
    when: { en: Week 6 or 7, ar: الأسبوع 6 أو 7 }
  - type: midterm
    weight: 20
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال وقت المحاضرة العادي }
    when: { en: Week 11 or 12, ar: الأسبوع 11 أو 12 }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail: { en: 2 hours during the final exam period, ar: ساعتان خلال فترة الاختبارات النهائية }
assessment_note:
  en: Only 10 problem sheets count towards the 20% (the sheet with the lowest mark is dropped).
  ar: لا تُحتسب في نسبة 20% إلا 10 أوراق مسائل (تُسقَط الورقة ذات العلامة الأدنى).

schedule:
  - week: 1
    title: { en: Wave mechanics (review), ar: الميكانيكا الموجية (مراجعة) }
    topics: { en: [Overview of the course, Wave mechanics (review)], ar: [نظرة عامة على المقرر, الميكانيكا الموجية (مراجعة)] }
    reading: Griffiths Ch. 1
  - week: 2
    title: { en: Wave mechanics (continued), ar: الميكانيكا الموجية (تابع) }
    reading: Griffiths Ch. 2
    activity: { en: Assignment 1, ar: الواجب 1 }
  - week: 3
    title: { en: Linear algebra, ar: الجبر الخطي }
    topics:
      en: [Vector spaces, Linear operators and matrices, Eigenvalues and eigenvectors, Orthonormal bases and orthogonal projectors, Hermitian and unitary operators]
      ar: [الفضاءات المتجهية, المؤثرات الخطية والمصفوفات, القيم الذاتية والمتجهات الذاتية, الأسس المتعامدة المنظَّمة والمساقط المتعامدة, المؤثرات الهرميتية والأحادية]
    reading: Griffiths Ch. 3
    activity: { en: Assignment 2, ar: الواجب 2 }
  - week: 4
    title: { en: Dirac notation and the uncertainty principle, ar: ترميز ديراك ومبدأ الارتياب }
    topics: { en: ["Dirac's bra and ket notation", The uncertainty principle], ar: [ترميز ديراك (برا وكت), مبدأ الارتياب] }
    reading: Griffiths Ch. 3
    activity: { en: Assignment 3, ar: الواجب 3 }
  - week: 5
    title: { en: Quantum dynamics, ar: الديناميكا الكمومية }
    topics: { en: [Schrödinger picture, Heisenberg picture], ar: [صورة شرودنغر, صورة هايزنبرغ] }
    reading: Griffiths
    activity: { en: Assignment 4, ar: الواجب 4 }
  - week: 6
    title: { en: Quantum dynamics (continued), ar: الديناميكا الكمومية (تابع) }
    reading: Griffiths
    activity: { en: Assignment 5, ar: الواجب 5 }
  - week: 7
    title: { en: Angular momentum, ar: الزخم الزاوي }
    topics: { en: [Angular momentum, First periodic exam], ar: [الزخم الزاوي, الاختبار الدوري الأول] }
    reading: Griffiths Sec. 4.3
    milestone: midterm
  - week: 8
    title: { en: Spin 1/2, ar: السبين 1/2 }
    reading: Griffiths Sec. 4.4
    activity: { en: Assignment 6, ar: الواجب 6 }
  - week: 9
    title: { en: Addition of angular momenta, ar: جمع الزخوم الزاوية }
    reading: Griffiths Sec. 4.4
    activity: { en: Assignment 7, ar: الواجب 7 }
  - week: 10
    title: { en: Identical particles, ar: الجسيمات المتطابقة }
    topics: { en: [Two-particle systems, Many-particle systems], ar: [أنظمة الجسيمين, الأنظمة متعددة الجسيمات] }
    reading: Griffiths Sec. 5.1, 5.2
    activity: { en: Assignment 8, ar: الواجب 8 }
  - week: 11
    title: { en: Non-degenerate perturbation theory, ar: نظرية الاضطراب غير المنحلّة }
    reading: Griffiths Sec. 6.1
    activity: { en: Assignment 9, ar: الواجب 9 }
  - week: 12
    title: { en: Degenerate perturbation theory, ar: نظرية الاضطراب المنحلّة }
    topics: { en: [Degenerate perturbation theory, Second periodic exam], ar: [نظرية الاضطراب المنحلّة, الاختبار الدوري الثاني] }
    reading: Griffiths Sec. 6.2
    milestone: midterm
  - week: 13
    title: { en: Fine structure and the Zeeman effect, ar: البنية الدقيقة ومفعول زيمان }
    topics: { en: [Fine structure of the hydrogen atom, The Zeeman effect], ar: [البنية الدقيقة لذرة الهيدروجين, مفعول زيمان] }
    reading: Griffiths Sec. 6.3, 6.4
    activity: { en: Assignment 10, ar: الواجب 10 }
  - week: 14
    title: { en: Hyperfine splitting, ar: الانشطار فائق الدقة }
    reading: Griffiths Sec. 6.5
    activity: { en: Assignment 11, ar: الواجب 11 }
  - week: 15
    title: { en: Exam review, ar: مراجعة للاختبار }
    milestone: review

