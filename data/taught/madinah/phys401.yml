slug: phys401
order: 70
codes: [PHYS 401, PHYS 354]
title: { en: Quantum Mechanics I, ar: ميكانيكا الكم 1 }
level: { en: "Undergraduate · Level 5", ar: "مرحلة البكالوريوس · المستوى الخامس" }
area: quantum
companion: quantum-mechanics-1   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture & tutorials, ar: محاضرات وأعمال موجهة }
taught:
  - { years: 2019–2020, code: PHYS 401, lang: en }
  - { years: 2018–2019, code: PHYS 401, lang: en }
  - { years: 2017–2018, code: PHYS 354, lang: en }
hours: { lecture: 3, tutorial: 1 }
weeks: 15
prerequisites: { en: "Modern Physics I (PHYS 241), Mathematical Physics I (PHYS 251)", ar: "الفيزياء الحديثة 1 (PHYS 241)، الفيزياء الرياضية 1 (PHYS 251)" }

description:
  en: |
    This introductory course in quantum mechanics covers the basics of quantum mechanics and its applications.
  ar: |
    يتناول هذا المقرر التمهيدي في ميكانيكا الكم أسس ميكانيكا الكم وتطبيقاتها.

outcomes:
  - id: CLO1
    text: { en: Understand the basic properties of wavefunctions and measurements in quantum mechanics., ar: فهم الخصائص الأساسية للدوال الموجية وعمليات القياس في ميكانيكا الكم. }
  - id: CLO2
    text: { en: Appreciate the role and significance of operators and eigenvalue problems in quantum mechanics., ar: إدراك دور المؤثرات ومسائل القيم الذاتية وأهميتها في ميكانيكا الكم. }
  - id: CLO3
    text: { en: Solve the Schrödinger equation in one dimension for potential wells and the harmonic oscillator., ar: حل معادلة شرودنغر في بعد واحد لآبار الجهد والمهتز التوافقي. }
  - id: CLO4
    text: { en: Solve the Schrödinger equation in three dimensions., ar: حل معادلة شرودنغر في ثلاثة أبعاد. }
  - id: CLO5
    text: { en: Demonstrate an understanding of angular momentum in quantum mechanics., ar: إظهار فهم للزخم الزاوي في ميكانيكا الكم. }
  - id: CLO6
    text: { en: Use quantum mechanics to understand central-potential problems and describe the hydrogen atom., ar: توظيف ميكانيكا الكم لفهم مسائل الجهد المركزي ووصف ذرة الهيدروجين. }
  - id: CLO7
    text: { en: Appreciate the spin of a particle., ar: استيعاب مفهوم اللف المغزلي (السبين) للجسيم. }

assessment:
  - type: homework
    weight: 10
    title: { en: Problem sets, ar: أوراق المسائل }
    detail:
      en: >
        One problem sheet each week, due one week later in class. Solving problems is the only way to understand the material
        presented in lectures: (i) do them yourself and reason your way through the questions; (ii) identify the concepts and/or
        equations that are not clear and seek the instructor's help; (iii) develop the technical skills needed (mathematics,
        computing, etc.) while working through the problems; (iv) if you get stuck, seek the instructor's help, consult the
        textbooks, search the web or discuss with classmates; (v) write up the solutions yourself, avoid any kind of cheating
        (breach of academic integrity) and check that your final solutions are logical, clear and complete.
      ar: >
        ورقة مسائل واحدة كل أسبوع، يُسلَّم حلها في القاعة بعد أسبوع واحد. حل المسائل هو السبيل الوحيد لفهم المادة المقدمة في المحاضرات:
        (1) حُلّها بنفسك وتدرّج في الأسئلة بالاستدلال والتفكير؛ (2) حدّد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ؛
        (3) احرص على تنمية المهارات التقنية اللازمة (الرياضيات، الإعلام الآلي... إلخ) أثناء حل المسائل؛ (4) إذا تعثّرت فاطلب مساعدة الأستاذ،
        أو راجع الكتب المقررة، أو ابحث في الإنترنت، أو ناقش زملاءك؛ (5) اكتب الحلول بنفسك، وتجنّب كل أشكال الغش (خرق النزاهة الأكاديمية)،
        وتحقّق من أن حلولك النهائية منطقية وواضحة وكاملة.
  - type: midterm
    weight: 25
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال أوقات المحاضرات المعتادة }
    when: { en: Week 6 or 7, ar: الأسبوع 6 أو 7 }
  - type: midterm
    weight: 25
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال أوقات المحاضرات المعتادة }
    when: { en: Week 11 or 12, ar: الأسبوع 11 أو 12 }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail: { en: 2 hours during the final exam period, ar: ساعتان خلال فترة الاختبارات النهائية }
assessment_note:
  en: "Weights of 2019–2020. In 2018–2019 they were: problem sets 20%, first and second periodic exams 20% each, final exam 40%."
  ar: "هذه أوزان 2019–2020. وكانت في 2018–2019: المسائل 20%، والاختباران الدوريان الأول والثاني 20% لكل منهما، والاختبار النهائي 40%."

schedule:
  - week: 1
    title: { en: The wavefunction, ar: الدالة الموجية }
    topics: { en: [Overview of the course, The wavefunction and its statistical interpretation], ar: [نظرة عامة على المقرر, الدالة الموجية وتفسيرها الإحصائي] }
    reading: Griffiths Sec. 1.1–1.2
  - week: 2
    title: { en: Probability and normalisation, ar: الاحتمالات والاستنظام }
    topics: { en: [Review of probability theory, Normalisation of the wavefunction, Momentum], ar: [مراجعة لنظرية الاحتمالات, استنظام الدالة الموجية, الزخم] }
    reading: Griffiths Sec. 1.3–1.5
    activity: { en: Assignment 1, ar: الواجب 1 }
  - week: 3
    title: { en: Uncertainty principle and stationary states, ar: مبدأ الارتياب والحالات المستقرة }
    topics: { en: [The uncertainty principle, Stationary-state solutions of the time-dependent Schrödinger equation], ar: [مبدأ الارتياب, حلول الحالات المستقرة لمعادلة شرودنغر المرتبطة بالزمن] }
    reading: Griffiths Sec. 1.6–2.1
    activity: { en: Assignment 2, ar: الواجب 2 }
  - week: 4
    title: { en: The infinite square well, ar: البئر المربع اللانهائي }
    reading: Griffiths Sec. 2.2
    activity: { en: Assignment 3, ar: الواجب 3 }
  - week: 5
    title: { en: The harmonic oscillator, ar: المهتز التوافقي }
    reading: Griffiths Sec. 2.3
    activity: { en: Assignment 4, ar: الواجب 4 }
  - week: 6
    title: { en: The free particle, ar: الجسيم الحر }
    topics: { en: [The free particle, The delta-function potential], ar: [الجسيم الحر, جهد دالة دلتا] }
    reading: Griffiths Sec. 2.4
  - week: 7
    title: { en: The delta-function potential, ar: جهد دالة دلتا }
    topics: { en: [The delta-function potential (continued), First periodic exam], ar: [جهد دالة دلتا (تتمة), الاختبار الدوري الأول] }
    reading: Griffiths Sec. 2.5
    activity: { en: Assignment 5, ar: الواجب 5 }
    milestone: midterm
  - week: 8
    title: { en: The finite square well, ar: البئر المربع المتناهي }
    reading: Griffiths Sec. 2.6
    activity: { en: Assignment 6, ar: الواجب 6 }
  - week: 9
    title: { en: Formalism, ar: الصياغة الرياضية }
    topics: { en: [Hilbert space, Observables in quantum mechanics, Hermitian operators], ar: [فضاء هيلبرت, المقادير القابلة للرصد في ميكانيكا الكم, المؤثرات الهرميتية] }
    reading: Griffiths Sec. 3.1–3.3
    activity: { en: Assignment 7, ar: الواجب 7 }
  - week: 10
    title: { en: Generalised statistical interpretation, ar: التفسير الإحصائي المعمَّم }
    topics: { en: [Generalised statistical interpretation, The uncertainty principle], ar: [التفسير الإحصائي المعمَّم, مبدأ الارتياب] }
    reading: Griffiths Sec. 3.4–3.5
    activity: { en: Assignment 8, ar: الواجب 8 }
  - week: 11
    title: { en: Dirac notation, ar: ترميز ديراك }
    reading: Griffiths Sec. 3.6
  - week: 12
    title: { en: Schrödinger equation in spherical coordinates, ar: معادلة شرودنغر في الإحداثيات الكروية }
    topics: { en: [Schrödinger equation in spherical coordinates, Second periodic exam], ar: [معادلة شرودنغر في الإحداثيات الكروية, الاختبار الدوري الثاني] }
    reading: Griffiths Sec. 4.1
    activity: { en: Assignment 9, ar: الواجب 9 }
    milestone: midterm
  - week: 13
    title: { en: Hydrogen atom and angular momentum, ar: ذرة الهيدروجين والزخم الزاوي }
    topics: { en: [The hydrogen atom, Angular momentum], ar: [ذرة الهيدروجين, الزخم الزاوي] }
    reading: Griffiths Sec. 4.2–4.3
    activity: { en: Assignment 10, ar: الواجب 10 }
  - week: 14
    title: { en: Spin, ar: اللف المغزلي (السبين) }
    reading: Griffiths Sec. 4.4
    activity: { en: Assignment 11, ar: الواجب 11 }
  - week: 15
    title: { en: Exam review, ar: مراجعة للاختبار }
    milestone: review

textbooks:
  required:
    - { authors: D. J. Griffiths, title: Introduction to Quantum Mechanics, edition: 2nd, publisher: McGraw Hill, year: 1992 }
  recommended:
    - { authors: R. P. Feynman, title: "The Feynman Lectures on Physics, Vol. 3", publisher: Paperback, year: 2003 }
    - { authors: P. A. M. Dirac, title: The Principles of Quantum Mechanics, publisher: Oxford University Press, year: 1947 }
    - { authors: R. Liboff, title: Introductory Quantum Mechanics, edition: 4th, publisher: Addison-Wesley, year: 2002 }
    - { authors: S. M. McMurry, title: Quantum Mechanics, publisher: Addison-Wesley, year: 1994 }
  online:
    - title: { en: "MIT OCW 8.04: Quantum Physics I (Spring 2013)", ar: "MIT OCW 8.04: فيزياء الكم 1 (ربيع 2013)" }
      url: https://ocw.mit.edu/courses/physics/8-04-quantum-physics-i-spring-2013/index.htm
      note: { en: By Adams et al. (MIT); includes video lectures., ar: لآدامز وآخرين (MIT)؛ مع محاضرات مرئية. }
    - title: { en: Quantum mechanics by J. J. Binney (Oxford), ar: ميكانيكا الكم لجيمس بيني (أكسفورد) }
      url: https://www-thphys.physics.ox.ac.uk/people/JamesBinney/qm_synopsis.html
      note: { en: Includes video lectures., ar: مع محاضرات مرئية. }
    - title: { en: "The Theoretical Minimum: Quantum mechanics (L. Susskind)", ar: "الحد الأدنى النظري: ميكانيكا الكم (ل. ساسكيند)" }
      url: https://theoreticalminimum.com/courses/quantum-mechanics/2012/winter
      note: { en: Video lectures., ar: محاضرات مرئية. }
    - title: { en: "The Feynman Lectures on Physics, Volume III", ar: محاضرات فاينمان في الفيزياء، المجلد الثالث }
      url: https://www.feynmanlectures.caltech.edu/III_toc.html
    - title: { en: Quantum mechanics (physicsnh.com), ar: ميكانيكا الكم (physicsnh.com) }
      url: https://physicsnh.com/quantum%201.htm
