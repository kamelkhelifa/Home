notes: >
  Course information, description, outcomes, evaluation, calendar and textbooks are from the latest page (PHYS 401,
  "semester 5 - 1440/41 - 2019/20"; course number shown as "PHYS 401/354"). The Arabic page "فيز 401" gives an earlier
  PHYS 401 offering in 1439/40 (2018–2019) with weights 20/20/20/40 (recorded in assessment_note and in taught:).
  Tutorials: "1 session/week, 1 hr ?" (question mark in the source); PHYS 354 (2017–2018) had no tutorials and gave no
  evaluation weights. PHYS 354 had the same seven outcomes and a longer description, kept here for reference:
  "Topics covered include the basic ideas of wave function, probability density, operators in quantum mechanics,
  Schrödinger equation and its applications in one, two and three dimensions such as free particle, step potential,
  barrier potentials, particle in a box and the harmonic oscillator, solutions of the Schrödinger equation for the
  hydrogen-like atom, the concepts of orbital angular momentum and spin angular momentum, and the spin–orbit interaction."
  Required textbook kept as written ("Griffiths, 2nd edition, McGraw Hill (1992)"), although the 2nd edition is
  Pearson/Prentice Hall 2005: to check. Lecture notes 3.3 (Hermitian operators) and 3.4 (generalised statistical
  interpretation) share one PDF. Summaries, exercise solutions, problem set 11, solutions 4–11, the 2019–2020 exams and
  formula sheets, PHYS 354 PS4 and the FreeParticle1D.nb simulation had no links. Dropped: marks (BlackBoard and a
  marks PDF), questionnaires, time/venue, office hours. Hijri years: 1437 → 2015–2016 … 1440 → 2018–2019; 1440(S2)
  had no link. PHYS 354 notes have no week numbers on the page, so none were assigned.
