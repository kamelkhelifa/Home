slug: phys101
order: 10
codes: [PHYS 101]
title: { en: General Physics I, ar: الفيزياء العامة 1 }
level: { en: Semester 1, ar: الفصل الدراسي الأول }
area: mechanics
companion: general-physics-1   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture, ar: محاضرات }
taught:
  - { years: 2016–2017, code: PHYS 101, lang: en }
hours: { lecture: 3, tutorial: 0 }
prerequisites: { en: PHYS 100, ar: PHYS 100 }

description:
  en: |
    Particle kinematics and dynamics, conservation of energy and linear momentum, rotational kinematics, rigid-body dynamics,
    conservation of angular momentum, simple harmonic motion, gravitation, statics and dynamics of fluids.
  ar: |
    علم الحركة (الكينماتيكا) والتحريك (الديناميكا) للجسيم، حفظ الطاقة والزخم الخطي، كينماتيكا الحركة الدورانية، ديناميكا الجسم الصلب،
    حفظ الزخم الزاوي، الحركة التوافقية البسيطة، الجاذبية، سكون الموائع وحركتها.

objectives:
  - { en: The course provides a general introduction to the fundamental concepts of mechanics and fluids., ar: يقدّم هذا المقرر مدخلًا عامًا إلى المفاهيم الأساسية في الميكانيكا وميكانيكا الموائع. }

# The source lists the chapters in teaching order, without week numbers.
schedule:
  - title: { en: Physics and measurement, ar: الفيزياء والقياس }
  - title: { en: Vectors, ar: المتجهات }
  - title: { en: Motion in one dimension, ar: الحركة في بعد واحد }
  - title: { en: Motion in two dimensions, ar: الحركة في بعدين }
  - title: { en: The laws of motion, ar: قوانين الحركة }
  - title: { en: Energy of a system, ar: طاقة نظام }
  - title: { en: Conservation of energy, ar: حفظ الطاقة }
  - title: { en: Linear momentum and collisions, ar: الزخم الخطي والتصادمات }
  - title: { en: Circular motion, ar: الحركة الدائرية }
  - title: { en: Rotation of rigid bodies, ar: دوران الأجسام الصلبة }
  - title: { en: Universal gravitation, ar: الجاذبية الكونية }

