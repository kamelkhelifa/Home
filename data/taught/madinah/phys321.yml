slug: phys321
order: 40
codes: [PHYS 321, فيز 321]
title: { en: Thermal & Statistical Physics, ar: الفيزياء الحرارية والإحصائية }
level: { en: "Undergraduate · Level 5", ar: "مرحلة البكالوريوس · المستوى الخامس" }
area: thermal
companion: thermal-statistical-physics   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture, ar: محاضرات }
taught:
  - { years: 2019–2020, code: PHYS 321, lang: en }
  - { years: 2018–2019, code: فيز 321, lang: ar }
  - { years: 2017–2018, code: PHYS 321, lang: en }
hours: { lecture: 3, tutorial: 1 }
weeks: 15
prerequisites: { en: Modern Physics I (PHYS 241), ar: الفيزياء الحديثة 1 (PHYS 241) }

description:
  en: |
    This course integrates both thermal and statistical perspectives to discuss the general features and properties of
    equilibrium and simple models of gases, liquids and solids.
  ar: |
    يجمع هذا المقرر بين المنظورين الحراري والإحصائي لدراسة السمات والخصائص العامة للتوازن، وللنماذج البسيطة للغازات والسوائل والأجسام الصلبة.

outcomes:
  - id: CLO1
    text: { en: Demonstrate the ability to derive and discuss the three laws of thermodynamics., ar: إثبات القدرة على استنتاج قوانين الديناميكا الحرارية الثلاثة ومناقشتها. }
  - id: CLO2
    text: { en: Demonstrate the ability to use thermodynamic laws and relations to compute various thermodynamic quantities., ar: إثبات القدرة على توظيف قوانين الديناميكا الحرارية وعلاقاتها لحساب مختلف المقادير الترموديناميكية. }
  - id: CLO3
    text: { en: Derive the partition function for various ensembles and use it to compute thermodynamic quantities., ar: استنتاج دالة التجزئة لمختلف المجموعات الإحصائية واستعمالها في حساب المقادير الترموديناميكية. }
  - id: CLO4
    text: { en: Study thermal properties of the ideal gas and other classical gases., ar: دراسة الخصائص الحرارية للغاز المثالي وغيره من الغازات الكلاسيكية. }
  - id: CLO5
    text: { en: Demonstrate an understanding of thermodynamic properties of gases beyond the ideal gas., ar: إظهار فهم للخصائص الترموديناميكية للغازات فيما يتجاوز الغاز المثالي. }
  - id: CLO6
    text: { en: Compute thermodynamic quantities and properties of various thermal systems., ar: حساب المقادير والخصائص الترموديناميكية لمختلف الأنظمة الحرارية. }

assessment:
  - type: homework
    weight: 20
    title: { en: Problem sets, ar: أوراق المسائل }
    detail:
      en: >
        One problem sheet each week, due one week after it is handed out. Solving problems is the only way to understand the
        material presented during lectures: (i) do them yourself, sit down and reason your way through the questions;
        (ii) identify the concepts and/or equations that are not clear and seek the instructor's help; (iii) develop the
        technical skills needed (mathematics, computing, etc.) while going through the problems; (iv) if you get stuck, seek
        the instructor's help, consult the textbooks, search the web or discuss with classmates; (v) write up the solutions
        yourself, avoid any kind of cheating (breach of academic integrity) and check that your final solutions are logical,
        clear and complete.
      ar: >
        ورقة مسائل واحدة كل أسبوع، تُسلَّم بعد أسبوع واحد من توزيعها. حل المسائل هو السبيل الوحيد لفهم المادة المقدمة في المحاضرات:
        (1) حُلّها بنفسك؛ اجلس وتدرّج في الأسئلة بالاستدلال والتفكير؛ (2) حدّد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ؛
        (3) احرص على تنمية المهارات التقنية اللازمة (الرياضيات، الإعلام الآلي... إلخ) أثناء حل المسائل؛ (4) إذا تعثّرت فاطلب مساعدة الأستاذ،
        أو راجع الكتب المقررة، أو ابحث في الإنترنت، أو ناقش زملاءك؛ (5) اكتب الحلول بنفسك، وتجنّب كل أشكال الغش (خرق النزاهة الأكاديمية)،
        وتحقّق من أن حلولك النهائية منطقية وواضحة وكاملة.
  - type: midterm
    weight: 20
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال أوقات المحاضرات المعتادة }
    when: { en: Week 7, ar: الأسبوع 7 }
  - type: midterm
    weight: 20
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال أوقات المحاضرات المعتادة }
    when: { en: Week 12, ar: الأسبوع 12 }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail: { en: 2 hours during the final exam period, ar: ساعتان خلال فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: Overview and basic concepts, ar: نظرة عامة ومفاهيم أساسية }
    topics: { en: [Overview of the course, Basic concepts], ar: [نظرة عامة على المقرر, مفاهيم أساسية] }
    reading: Blundell & Blundell Ch. 1–2
  - week: 2
    title: { en: Probability and temperature, ar: الاحتمالات ودرجة الحرارة }
    topics: { en: [Basic concepts (cont.), Probability, Temperature and the Boltzmann distribution], ar: [مفاهيم أساسية (تتمة), الاحتمالات, درجة الحرارة وتوزيع بولتزمان] }
    reading: Blundell & Blundell Ch. 3–4
    activity: { en: Assignment 1, ar: الواجب 1 }
  - week: 3
    title: { en: The first law, ar: القانون الأول }
    reading: Blundell & Blundell Ch. 11–12
    activity: { en: Assignment 2, ar: الواجب 2 }
  - week: 4
    title: { en: Second law and entropy, ar: القانون الثاني والإنتروبيا }
    topics: { en: [Second law and heat engines, Entropy, Information theory*], ar: [القانون الثاني والآلات الحرارية, الإنتروبيا, نظرية المعلومات*] }
    reading: Blundell & Blundell Ch. 13–15
    activity: { en: Assignment 3, ar: الواجب 3 }
  - week: 5
    title: { en: Thermodynamic potentials, ar: الكمونات الترموديناميكية }
    reading: Blundell & Blundell Ch. 16
    activity: { en: Assignment 4, ar: الواجب 4 }
  - week: 6
    title: { en: "Rods, bubbles and magnets; the third law", ar: "القضبان والفقاعات والمغانط؛ القانون الثالث" }
    topics: { en: ["Rods, bubbles and magnets", Third law], ar: [القضبان والفقاعات والمغانط, القانون الثالث] }
    reading: Blundell & Blundell Ch. 17–18
  - week: 7
    title: { en: Equipartition of energy, ar: تساوي توزيع الطاقة }
    topics: { en: [Equipartition of energy, First periodic exam], ar: [تساوي توزيع الطاقة, الاختبار الدوري الأول] }
    reading: Blundell & Blundell Ch. 19
    activity: { en: Assignment 5, ar: الواجب 5 }
    milestone: midterm
  - week: 8
    title: { en: The partition function, ar: دالة التجزئة }
    reading: Blundell & Blundell Ch. 20
    activity: { en: Assignment 6, ar: الواجب 6 }
  - week: 9
    title: { en: Statistical mechanics of an ideal gas, ar: الميكانيكا الإحصائية للغاز المثالي }
    reading: Blundell & Blundell Ch. 21
    activity: { en: Assignment 7, ar: الواجب 7 }
  - week: 10
    title: { en: Chemical potential and the grand partition function, ar: الكمون الكيميائي ودالة التجزئة الكبرى }
    reading: Blundell & Blundell Ch. 22
    activity: { en: Assignment 8, ar: الواجب 8 }
  - week: 11
    title: { en: Photons and phonons, ar: الفوتونات والفونونات }
    topics:
      en: ["Photons (EM radiation, black-body radiation)", "Phonons (Einstein model, Debye model)"]
      ar: ["الفوتونات (الإشعاع الكهرومغناطيسي، إشعاع الجسم الأسود)", "الفونونات (نموذج أينشتاين، نموذج ديباي)"]
    reading: Blundell & Blundell Ch. 23–24
  - week: 12
    title: { en: Relativistic and real gases, ar: الغازات النسبوية والحقيقية }
    topics: { en: [Relativistic gases, Real gases, Second periodic exam], ar: [الغازات النسبوية, الغازات الحقيقية, الاختبار الدوري الثاني] }
    reading: Blundell & Blundell Ch. 25–26
    activity: { en: Assignment 9, ar: الواجب 9 }
    milestone: midterm
  - week: 13
    title: { en: "Bose–Einstein and Fermi–Dirac distributions", ar: توزيعا بوز-أينشتاين وفيرمي-ديراك }
    reading: Blundell & Blundell Ch. 29
    activity: { en: Assignment 10, ar: الواجب 10 }
  - week: 14
    title: { en: Quantum gases and condensates, ar: الغازات الكمومية والتكاثفات }
    reading: Blundell & Blundell Ch. 30
    activity: { en: Assignment 11, ar: الواجب 11 }
  - week: 15
    title: { en: Exam review, ar: مراجعة للاختبار }
    milestone: review

