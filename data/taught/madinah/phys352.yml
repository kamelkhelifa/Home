prerequisites: { en: Mathematical Physics I (PHYS 251), ar: الفيزياء الرياضية 1 (PHYS 251) }

description:
  en: |
    This course provides undergraduate students with the mathematical prerequisites necessary to study the core physics courses.
  ar: |
    يزوّد هذا المقرر طلاب مرحلة البكالوريوس بالمتطلبات الرياضية اللازمة لدراسة مقررات الفيزياء الأساسية.

outcomes:
  - id: CLO1
    text: { en: Use the gamma and beta functions and their properties., ar: استعمال دالتي غاما وبيتا وخواصهما. }
  - id: CLO2
    text: { en: Write down the power-series expansion of functions., ar: كتابة نشر الدوال في متسلسلات قوى. }

assessment:
  - type: homework
    weight: 10
    title: { en: Problem sets, ar: أوراق المسائل }
    detail:
      en: >
        One problem sheet each week, due one week later in class. Solving problems is the only way to understand the material
        presented in lectures: (i) do them yourself and reason your way through the questions; (ii) identify the concepts and/or
        equations that are not clear and seek the instructor's help; (iii) develop the technical skills needed (mathematics,
        computing, etc.) while working through the problems; (iv) if you get stuck, seek the instructor's help, consult the
        textbooks, search the web or discuss with classmates; (v) write up the solutions yourself, avoid any kind of cheating
        (breach of academic integrity) and check that your final solutions are logical, clear and complete.
      ar: >
        ورقة مسائل واحدة كل أسبوع، تُسلَّم في القسم بعد أسبوع واحد. حل المسائل هو الطريقة الوحيدة لفهم المحتوى المقدم أثناء المحاضرات:
        (أ) حلّها بنفسك وتدرّج في التفكير خلال الأسئلة؛ (ب) حدّد المفاهيم و/أو المعادلات غير الواضحة واطلب مساعدة الأستاذ؛
        (ج) طوّر المهارات التقنية المطلوبة (رياضيات، إعلام آلي... إلخ) أثناء حل المسائل؛ (د) إذا واجهتك صعوبة فاطلب مساعدة الأستاذ،
        أو راجع الكتب المقررة، أو ابحث في الإنترنت، أو ناقش زملاءك؛ (هـ) اكتب الحلول بنفسك، وتجنّب كل أنواع الغش (خرق النزاهة الأكاديمية)،
        وتحقق من أن حلولك النهائية منطقية وواضحة وكاملة.
  - type: midterm
    weight: 25
    title: { en: First periodic exam, ar: الاختبار الدوري الأول }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال وقت المحاضرة العادي }
    when: { en: Week 6 or 7, ar: الأسبوع 6 أو 7 }
  - type: midterm
    weight: 25
    title: { en: Second periodic exam, ar: الاختبار الدوري الثاني }
    detail: { en: 1 hour during normal lecture time, ar: ساعة واحدة خلال وقت المحاضرة العادي }
    when: { en: Week 11 or 12, ar: الأسبوع 11 أو 12 }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }
    detail: { en: 2 hours during the final exam period, ar: ساعتان خلال فترة الاختبارات النهائية }

schedule:
  - week: 1
    title: { en: The Gamma function, ar: دالة غاما }
    topics: { en: [Overview of the course, The Gamma function], ar: [نظرة عامة على المقرر, دالة غاما] }
    reading: Arfken & Weber Sec. 8.1–8.3
  - week: 2
    title: { en: The Beta function, ar: دالة بيتا }
    topics: { en: [The Beta function, Incomplete Gamma function], ar: [دالة بيتا, دالة غاما غير التامة] }
    reading: Arfken & Weber Sec. 8.4–8.5
    activity: { en: Assignment 1, ar: الواجب 1 }
  - week: 3
    title: { en: Series solutions of differential equations, ar: حل المعادلات التفاضلية بالمتسلسلات }
    topics: { en: [Singular points, "Series solutions: Frobenius' method"], ar: [النقاط الشاذة, "الحلول بالمتسلسلات: طريقة فروبينيوس"] }
    reading: Arfken & Weber Sec. 9.4–9.5
    activity: { en: Assignment 2, ar: الواجب 2 }
  - week: 4
    title: { en: A second solution, ar: الحل الثاني }
    topics: { en: [A second solution, Applications], ar: [الحل الثاني, تطبيقات] }
    reading: Arfken & Weber Sec. 9.6–9.8
    activity: { en: Assignment 3, ar: الواجب 3 }
  - week: 5
    title: { en: Bessel functions, ar: دوال بسل }
    topics: { en: [Bessel functions and their properties, Neumann functions, Hankel functions], ar: [دوال بسل وخواصها, دوال نويمان, دوال هانكل] }
    reading: Arfken & Weber Sec. 11.1–11.4
    activity: { en: Assignment 4, ar: الواجب 4 }
  - week: 6
    title: { en: Modified and spherical Bessel functions, ar: دوال بسل المعدّلة والكروية }
    topics: { en: [Modified Bessel functions, Spherical Bessel functions], ar: [دوال بسل المعدّلة, دوال بسل الكروية] }
    reading: Arfken & Weber Sec. 11.5–11.7
  - week: 7
    title: { en: Legendre functions, ar: دوال لوجندر }
    topics: { en: [Legendre functions, First periodic exam], ar: [دوال لوجندر, الاختبار الدوري الأول] }
    reading: Arfken & Weber Sec. 12.1–12.4
    activity: { en: Assignment 5, ar: الواجب 5 }
    milestone: midterm
  - week: 8
    title: { en: Hermite functions, ar: دوال هيرميت }
    reading: Arfken & Weber Sec. 13.1
    activity: { en: Assignment 6, ar: الواجب 6 }
  - week: 9
    title: { en: Laguerre functions, ar: دوال لاغير }
    reading: Arfken & Weber Sec. 13.2
    activity: { en: Assignment 7, ar: الواجب 7 }
  - week: 10
    title: { en: Fourier series, ar: متسلسلات فورييه }
    topics: { en: [Fourier series, Properties and applications], ar: [متسلسلات فورييه, خواصها وتطبيقاتها] }
    reading: Arfken & Weber Sec. 14.1–14.4, 14.6
    activity: { en: Assignment 8, ar: الواجب 8 }
  - week: 11
    title: { en: Integral transforms, ar: التحويلات التكاملية }
    topics: { en: [Integral transforms, Fourier transform], ar: [التحويلات التكاملية, تحويل فورييه] }
    reading: Arfken & Weber Sec. 15.1–15.5
  - week: 12
    title: { en: Laplace transform, ar: تحويل لابلاس }
    topics: { en: [Laplace transform, Second periodic exam], ar: [تحويل لابلاس, الاختبار الدوري الثاني] }
    reading: Arfken & Weber Sec. 15.8–15.12
    activity: { en: Assignment 9, ar: الواجب 9 }
    milestone: midterm
  - week: 13
    title: { en: Probability, ar: الاحتمالات }
    topics: { en: [Probability, Random variables], ar: [الاحتمالات, المتغيرات العشوائية] }
    reading: Arfken & Weber Sec. 19.2–19.5
    activity: { en: Assignment 10, ar: الواجب 10 }
  - week: 14
    title: { en: Statistics and group theory, ar: الإحصاء ونظرية الزمر }
    topics: { en: [Statistics, Group theory], ar: [الإحصاء, نظرية الزمر] }
    reading: Arfken & Weber Sec. 19.6, 4.1–4.2
    activity: { en: Assignment 11, ar: الواجب 11 }
  - week: 15
    title: { en: Exam review, ar: مراجعة للاختبار }
    milestone: review

