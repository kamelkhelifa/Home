    topics: { en: [Non-degenerate perturbation theory, First-order theory], ar: [نظرية الاضطراب غير المنحلّة, نظرية الرتبة الأولى] }
    reading: Griffiths Sec. 6.1
    activity: { en: Assignment 5, ar: الواجب 5 }
  - week: 7
