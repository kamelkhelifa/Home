notes: >
  Course information, description, outcomes, evaluation (10/25/25/40), calendar (Griffiths 2nd-ed. sections) and
  textbooks are from the Griffiths-based PHYS 402 page (semester 6, 1440/41 = 2019–2020). Tutorials "1 session/week,
  1 hr ?" (question mark in the source). Inconsistency in the source: the evaluation block gives problem sets 10%, but the
  assignments paragraph (apparently copied from the MIT-based page) says the 10 best problem sheets count for 20%;
  kept 10% and the "lowest sheet dropped" rule. The Arabic page "فيز 402" (semester 6, 1439/40 = 2018–2019, weights
  20/20/20/40) links to the English URL of the MIT-based page and matches its weights, so it was used for
  phys402-mit, not here. The page has no lecture-note, summary, problem-set or exam links (all placeholders); only
  the general formula table and the 1439(S2) past exam (2017–2018, also listed on the MIT-based page) are linked.
  The 1439(S2) exam and "Quest-1439-S2" suggest PHYS 402 was also taught in spring 2018 (2017–2018), not added to
  taught: without confirmation. Required textbook kept as written ("2nd ed., McGraw Hill, 1992"). Dropped: time/venue,
  office hours, marks (Blackboard), questionnaire.
  UPDATE 24-10-2026 (Kamel's answers + the department attestation of courses taught 2016–2020): taught in both semesters of 2019–2020 (level 8); the 2018–2019 offering is the MIT-based version (phys402-mit).
  Past exam 1439 (S2) = 2018–2019 (that offering's exam). Griffiths corrected (Pearson 2005).
