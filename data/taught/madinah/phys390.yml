objectives:
  - en: Train students in conducting laboratory and research work and provide an opportunity to acquire skills through practical work.
    ar: تدريب الطلاب على إنجاز الأعمال المخبرية والبحثية، وإتاحة الفرصة لهم لاكتساب المهارات من خلال العمل التطبيقي.

description:
  en: |
    Students undertake laboratory or research work in a government or private institution or company in a specific field of physics: they collect data, perform the analysis, write a report and give a presentation about it.
  ar: |
    إنجاز عمل مخبري أو بحثي لدى مؤسسة أو شركة حكومية أو خاصة في مجال محدد من مجالات الفيزياء، يشمل جمع البيانات وتحليلها، ثم كتابة تقرير عنه وتقديم عرض حوله.

