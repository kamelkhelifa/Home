  all "--", prerequisite "Department approval". Assessment left out on purpose: the page's evaluation block (problem
  sets 20%, two periodic exams 20% each, final exam 40%, with the weekly problem-sheet advice) is word for word the
  lecture template of his 2018–2019 course pages and cannot apply to a training placement (no lectures, problem sheets
  or exams); the real scheme is presumably report + presentation (see description) but no weights are given. The
  learning-outcomes list contained a single unfinished item ("compute"), so outcomes are left out. The "Forms" and
  "Passed experience" sections were empty. Dropped: office-hours link, questionnaire (Quest-1439-S2). The page's
  Arabic-version link pointed to the PHYS 402 Arabic page (copy artefact). No materials, schedule or textbooks.
