slug: phys353
order: 30
codes: [PHYS 353, PHYS 302]
title: { en: Classical Mechanics II, ar: الميكانيكا الكلاسيكية 2 }
level: { en: "Level 6", ar: "المستوى السادس" }
area: mechanics
companion: classical-mechanics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: "Lecture", ar: "محاضرات" }
taught:
  - { years: 2018–2019, code: PHYS 353, lang: en }
hours: { lecture: 3, tutorial: 0 }
prerequisites: { en: Classical Mechanics I (PHYS 301), ar: الميكانيكا الكلاسيكية 1 (PHYS 301) }

description:
  en: |
    Topics covered: motion of rigid bodies in three dimensions, Euler's equations, gyroscopic motion, motion of a top,
    the gyrocompass, the inertia tensor, Lagrangian mechanics, generalised coordinates, Hamilton's variational principle,
    Hamilton's equations, dynamics of oscillating systems, normal coordinates, coupled harmonic motion, continuous systems
    and the wave equation.
  ar: |
    تشمل المواضيع المدروسة: حركة الأجسام الصلبة في ثلاثة أبعاد، ومعادلات أويلر، والحركة الجيروسكوبية، وحركة الخذروف، والبوصلة الجيروسكوبية،
    وموتّر العطالة، وميكانيكا لاغرانج، والإحداثيات المعممة، ومبدأ هاملتون التغايري، ومعادلات هاملتون، وديناميكا الجمل المهتزة،
    والإحداثيات العادية، والحركة التوافقية المتقارنة، والجمل المستمرة ومعادلة الموجة.

objectives:
  - en: This course is a continuation of PHYS 301 (Classical Mechanics I); more advanced topics in classical mechanics are introduced.
    ar: هذا المقرر تتمة لمقرر PHYS 301 (الميكانيكا الكلاسيكية 1)، ويتناول مواضيع أكثر تقدمًا في الميكانيكا الكلاسيكية.

outcomes:
  - id: CLO1
    text: { en: Understand the dynamics of systems of particles., ar: فهم ديناميكا جمل الجسيمات. }
  - id: CLO2
    text: { en: Apply classical laws to the motion of two interacting bodies., ar: تطبيق القوانين الكلاسيكية على حركة جسمين متفاعلين. }
  - id: CLO3
    text: { en: Solve problems involving collisions of particles., ar: حل مسائل تتعلق بتصادم الجسيمات. }
  - id: CLO4
    text: { en: Compute the centre of mass and moment of inertia of a variety of rigid bodies., ar: حساب مركز الكتلة وعزم العطالة لمجموعة متنوعة من الأجسام الصلبة. }
  - id: CLO5
    text: { en: Compute dynamical variables for a rigid body undergoing laminar motion., ar: حساب المتغيرات الديناميكية لجسم صلب في حركة مستوية. }

assessment:
  - type: quiz
    weight: 10
    title: { en: Quizzes (2), ar: اختباران قصيران }
    when: { en: Weeks 5 and 10, ar: الأسبوعان 5 و10 }
  - type: midterm
    weight: 50
    title: { en: Midterm exams (2), ar: اختباران نصفيان }
    when: { en: Weeks 7 and 12, ar: الأسبوعان 7 و12 }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }

# The source lists four chapters (Fowles & Cassiday) with their sub-topics, without week numbers.
schedule:
  - title: { en: Dynamics of systems of particles, ar: ديناميكا جمل الجسيمات }
    topics:
      en: [Centre of mass and linear momentum of a system, Angular momentum and kinetic energy of a system, Motion of two interacting bodies, Collisions, Rocket motion]
      ar: [مركز الكتلة وكمية الحركة الخطية لجملة, العزم الحركي والطاقة الحركية لجملة, حركة جسمين متفاعلين, التصادمات, حركة الصاروخ]
    reading: Fowles & Cassiday Ch. 7
  - title: { en: Mechanics of rigid bodies, ar: ميكانيكا الأجسام الصلبة }
    topics:
      en: [Centre of mass of a rigid body, Rotation of a rigid body about a fixed axis, Moment of inertia, Physical pendulum, Angular momentum of a rigid body in laminar motion, Impulse and collisions of rigid bodies]
      ar: [مركز كتلة الجسم الصلب, دوران الجسم الصلب حول محور ثابت, عزم العطالة, النواس الفيزيائي, العزم الحركي لجسم صلب في حركة مستوية, الدفع وتصادم الأجسام الصلبة]
    reading: Fowles & Cassiday Ch. 8
  - title: { en: Motion of rigid bodies in three dimensions, ar: حركة الأجسام الصلبة في ثلاثة أبعاد }
    topics:
      en: [Rotation about an arbitrary axis, Principal axes of a rigid body, "Euler's equations"]
      ar: [الدوران حول محور كيفي, المحاور الرئيسية للجسم الصلب, معادلات أويلر]
    reading: Fowles & Cassiday Ch. 9
  - title: { en: Lagrangian mechanics, ar: ميكانيكا لاغرانج }
    topics:
      en: ["Hamilton's variational principle"]
      ar: [مبدأ هاملتون التغايري]
    reading: Fowles & Cassiday Ch. 10

