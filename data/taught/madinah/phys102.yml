notes: >
  Scholar year "1438/39 - 2017/18" → taught 2017–2018 (page, slides and exams in English). General information kept:
  semester 2, 3 lecture sessions/week (50 min), no tutorials, prerequisite PHYS 101. Evaluation exactly as on the page:
  2 quizzes (5%), 2 periodic exams (30%), lab work + exam (25%), final exam (40%) — the percentages are read as the share
  of each group (they add up to 100). Objective, description and the 12 learning outcomes are from the page (light
  editing only). The syllabus is an ordered list of 14 chapters with Halliday 10th-ed. chapter numbers and no week
  numbers, so schedule entries have no `week`. Area is electromagnetism, but this offering also covered waves and
  thermodynamics (Halliday Ch. 16–20). Not linked in the source (left out): summaries, problem sheets 5–14, all
  solutions of the problem sheets, the laboratory manual ("pdf" without link), the "Passed exams 1438(S1)" label.
  Dropped silently: the marks links (student grades). The formula table is assumed to be the professor's own.
  UPDATE 24-10-2026 (Kamel's answers + the department attestation of courses taught 2016–2020): taught once, in the second semester of 2018–2019 (level 2); the page's "2017/18" was a slip, so the offering and its exams are now 2018–2019.
