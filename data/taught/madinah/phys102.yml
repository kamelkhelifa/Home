slug: phys102
order: 20
codes: [PHYS 102]
title: { en: General Physics II, ar: الفيزياء العامة 2 }
level: { en: "Level 2", ar: "المستوى الثاني" }
area: electromagnetism
companion: general-physics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: Lecture, ar: محاضرات }
taught:
  - { years: 2018–2019, code: PHYS 102, lang: en }
hours: { lecture: 3, tutorial: 0 }
prerequisites: { en: PHYS 101, ar: PHYS 101 }

description:
  en: |
    Wave motion and sound, temperature, first and second laws of thermodynamics, kinetic theory of gases, Coulomb's law,
    the electric field, Gauss's law, electric potential, capacitors and dielectrics, D.C. circuits, the magnetic field,
    Ampère's and Faraday's laws.
  ar: |
    الحركة الموجية والصوت، ودرجة الحرارة، والقانونان الأول والثاني للديناميكا الحرارية، والنظرية الحركية للغازات، وقانون كولوم،
    والحقل الكهربائي، وقانون غاوس، والكمون الكهربائي، والمكثفات والعوازل، ودارات التيار المستمر، والحقل المغناطيسي، وقانونا أمبير وفاراداي.

objectives:
  - en: This course is the continuation of General Physics I. In this course students learn the fundamental concepts of waves, thermodynamics, electricity and magnetism.
    ar: هذا المقرر امتداد لمقرر الفيزياء العامة 1، ويتعلم فيه الطلاب المفاهيم الأساسية للأمواج والديناميكا الحرارية والكهرباء والمغناطيسية.

outcomes:
  - id: CLO1
    text: { en: Define the characteristics of a wave., ar: تعريف خصائص الموجة. }
  - id: CLO2
    text: { en: Define physical quantities in thermodynamics., ar: تعريف المقادير الفيزيائية في الديناميكا الحرارية. }
  - id: CLO3
    text: { en: Understand the kinetic theory of gases., ar: فهم النظرية الحركية للغازات. }
  - id: CLO4
    text: { en: Understand and apply the first and second laws of thermodynamics., ar: فهم القانونين الأول والثاني للديناميكا الحرارية وتطبيقهما. }
  - id: CLO5
    text: { en: "Write down Coulomb's law and the properties of the electrostatic field.", ar: كتابة قانون كولوم وخواص الحقل الكهروساكن. }
  - id: CLO6
    text: { en: "Understand Gauss's law and use it to find electrostatic fields.", ar: فهم قانون غاوس واستعماله في إيجاد الحقول الكهروساكنة. }
  - id: CLO7
    text: { en: Define the electrostatic potential and its relation to electrostatic fields., ar: تعريف الكمون الكهروساكن وعلاقته بالحقول الكهروساكنة. }
  - id: CLO8
    text: { en: Appreciate the properties of capacitors and compute the equivalent capacitance of capacitors in series and in parallel., ar: إدراك خواص المكثفات وحساب السعة المكافئة لمكثفات موصولة على التسلسل وعلى التفرع. }
  - id: CLO9
    text:
      en: Identify the properties of current and resistance in circuits, and compute the equivalent resistance of resistors in series and in parallel.
      ar: تحديد خواص التيار والمقاومة في الدارات، وحساب المقاومة المكافئة لمقاومات موصولة على التسلسل وعلى التفرع.
  - id: CLO10
    text: { en: "Understand the junction rule and the loop rule (Kirchhoff's laws) for single and multiple circuits.", ar: فهم قاعدة العقد وقاعدة الحلقات (قانونا كيرشوف) في الدارات البسيطة والمتعددة. }
  - id: CLO11
    text: { en: Know the properties of magnetic fields and how they may arise from currents in circuits., ar: معرفة خواص الحقول المغناطيسية وكيفية نشوئها عن التيارات في الدارات. }
  - id: CLO12
    text: { en: Understand induction and compute inductance., ar: فهم التحريض وحساب الذاتية. }

assessment:
  - type: quiz
    weight: 5
    title: { en: Quizzes (2), ar: اختباران قصيران }
  - type: midterm
    weight: 30
    title: { en: Periodic exams (2), ar: اختباران دوريان }
  - type: lab
    weight: 25
    title: { en: Lab work and lab exam, ar: الأعمال التطبيقية واختبارها }
  - type: final
    weight: 40
    title: { en: Final exam, ar: الاختبار النهائي }

