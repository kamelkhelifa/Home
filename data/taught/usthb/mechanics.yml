description:
  en: |
    Weekly format: two lecture sessions, one tutorial (TD) session and one lab (TP) session.

    Course outline:

    <ol>
    <li><strong>Mathematical review</strong>: dimensional equations, error calculation, vectors.</li>
    <li><strong>Kinematics of a point particle</strong>: rectilinear motion, curvilinear motion, analysis in different coordinate systems, relative motion.</li>
    <li><strong>Dynamics of a point mass</strong>: the principle of inertia, momentum, Newton's laws, the laws of gravitation, frictional forces, elastic forces, angular momentum.</li>
    <li><strong>Work and energy</strong>: work done by a force, kinetic energy, potential energy (gravitational and elastic forces), mechanical energy, the law of conservation of energy, field and potential (the cases of weight and gravitation).</li>
    <li><strong>Collisions between two isolated particles</strong>: elastic collisions, inelastic collisions.</li>
    </ol>

    Problem sets, lab sheets, lecture notes and common exams marked “department document” were prepared by the course's teaching committee at USTHB, not by a single author; they are the documents used in class.
  ar: |
    التنظيم الأسبوعي: حصتا محاضرة، وحصة أعمال موجهة، وحصة أعمال تطبيقية.

    مفردات المقرر:

    <ol>
    <li><strong>تذكير بالرياضيات</strong>: معادلات الأبعاد، حساب الأخطاء، الأشعة.</li>
    <li><strong>حركيات النقطة المادية</strong>: الحركة المستقيمة، الحركة المنحنية، الدراسة في مختلف جمل الإحداثيات، الحركات النسبية.</li>
    <li><strong>تحريك النقطة المادية</strong>: مبدأ العطالة، كمية الحركة، قوانين نيوتن، قوانين الجاذبية، قوى الاحتكاك، القوى المرنة، العزم الحركي.</li>
    <li><strong>العمل والطاقة</strong>: عمل قوة، الطاقة الحركية، الطاقة الكامنة (قوى الجاذبية والقوى المرنة)، الطاقة الميكانيكية، قانون انحفاظ الطاقة، الحقل والكمون (حالتا الثقالة والجاذبية).</li>
    <li><strong>تصادم جسيمين معزولين</strong>: التصادم المرن، التصادم غير المرن.</li>
    </ol>

    سلاسل التمارين وأوراق الأعمال التطبيقية والمطبوعات والاختبارات الموحّدة المعلَّمة بعبارة «وثيقة القسم» من إعداد الفريق البيداغوجي للمقرر في جامعة باب الزوار، لا من إعداد مؤلف واحد؛ وهي الوثائق المستعملة في الدروس.
  fr: |
    Organisation hebdomadaire : deux séances de cours, une séance de travaux dirigés (TD) et une séance de travaux pratiques (TP).

    Plan du cours :

    <ol>
    <li><strong>Rappels de mathématiques</strong> : équations aux dimensions, calculs d'erreurs, vecteurs.</li>
    <li><strong>Cinématique du point</strong> : mouvement rectiligne, mouvement curviligne, étude dans différents systèmes de coordonnées, mouvements relatifs.</li>
    <li><strong>Dynamique d'une masse ponctuelle</strong> : principe d'inertie, quantité de mouvement, lois de Newton, lois de la gravitation, forces de frottement, forces élastiques, moment cinétique.</li>
    <li><strong>Travail et énergie</strong> : travail d'une force, énergie cinétique, énergie potentielle (forces de gravitation et élastique), énergie mécanique, loi de conservation de l'énergie, champ et potentiel (cas de la pesanteur et de la gravitation).</li>
    <li><strong>Collisions de deux particules isolées</strong> : choc élastique, choc inélastique.</li>
    </ol>

    Les séries de TD, fiches de TP, polycopiés et examens communs marqués « document du département » ont été préparés par l'équipe pédagogique du module à l'USTHB, et non par un seul auteur ; ce sont les documents utilisés en cours.

objectives:
  - en: "To introduce the basic concepts of mechanics: mass (inertia and attraction), force, energy, field, potential, momentum and angular momentum."
    ar: "التعريف بالمفاهيم الأساسية في الميكانيكا: الكتلة (العطالة والجذب)، القوة، الطاقة، الحقل، الكمون، كمية الحركة، العزم الحركي."
    fr: "Introduire les concepts de base de la mécanique : masse (inertie et attraction), force, énergie, champ, potentiel, quantité de mouvement, moment cinétique."
  - en: "To introduce the conservation laws and their applications."
    ar: "التعريف بقوانين الانحفاظ وتطبيقاتها."
    fr: "Introduire les lois de conservation et leurs applications."

outcomes:
  - id: CLO1
    text: { en: "Use dimensional analysis, uncertainty calculation and vector algebra in mechanics problems.", ar: "يستعمل التحليل البعدي وحساب الارتيابات والجبر الشعاعي في مسائل الميكانيكا.", fr: "Utiliser les équations aux dimensions, le calcul d'incertitudes et le calcul vectoriel dans les problèmes de mécanique." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO2
    text: { en: "Describe the motion of a point particle (position, velocity, acceleration) in Cartesian, polar, cylindrical and spherical coordinates, and in relative motion.", ar: "يصف حركة النقطة المادية (الموضع والسرعة والتسارع) في الإحداثيات الديكارتية والقطبية والأسطوانية والكروية، وفي الحركة النسبية.", fr: "Décrire le mouvement d'un point matériel (position, vitesse, accélération) en coordonnées cartésiennes, polaires, cylindriques et sphériques, et en mouvement relatif." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO3
    text: { en: "Apply Newton's laws, with gravitational, friction and elastic forces, to find the motion of a point mass.", ar: "يطبّق قوانين نيوتن، مع قوى الجاذبية والاحتكاك والقوى المرنة، لإيجاد حركة كتلة نقطية.", fr: "Appliquer les lois de Newton, avec les forces de gravitation, de frottement et élastiques, pour trouver le mouvement d'un point matériel." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO4
    text: { en: "Use momentum and angular momentum and their conservation.", ar: "يستعمل كمية الحركة والعزم الحركي وانحفاظهما.", fr: "Utiliser la quantité de mouvement et le moment cinétique et leur conservation." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO5
    text: { en: "Compute the work of a force and use kinetic, potential and mechanical energy and the conservation of energy to solve problems.", ar: "يحسب عمل قوة ويستعمل الطاقة الحركية والكامنة والميكانيكية وانحفاظ الطاقة لحل المسائل.", fr: "Calculer le travail d'une force et utiliser les énergies cinétique, potentielle et mécanique et la conservation de l'énergie pour résoudre des problèmes." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO6
    text: { en: "Analyse elastic and inelastic collisions between two isolated particles.", ar: "يحلّل التصادمات المرنة وغير المرنة بين جسيمين معزولين.", fr: "Analyser les chocs élastiques et inélastiques entre deux particules isolées." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO7
    text: { en: "Carry out simple mechanics experiments, analyse the measurements with their uncertainties and write a lab report.", ar: "يُجري تجارب ميكانيكا بسيطة ويحلّل القياسات مع ارتياباتها ويكتب تقريرًا عنها.", fr: "Réaliser des expériences simples de mécanique, analyser les mesures avec leurs incertitudes et rédiger un compte rendu." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }

