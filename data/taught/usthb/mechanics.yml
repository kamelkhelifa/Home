      fr: ["Équations aux dimensions", "Calcul d'erreurs", "Vecteurs"]
  - week: "3–7"
    title: { en: "Kinematics of a point particle", ar: "حركيات النقطة المادية", fr: "Cinématique du point" }
    topics:
      en: ["Rectilinear motion", "Curvilinear motion", "Cartesian, polar, cylindrical and spherical coordinates", "Relative motion"]
      ar: ["الحركة المستقيمة", "الحركة المنحنية", "الإحداثيات الديكارتية والقطبية والأسطوانية والكروية", "الحركات النسبية"]
      fr: ["Mouvement rectiligne", "Mouvement curviligne", "Coordonnées cartésiennes, polaires, cylindriques et sphériques", "Mouvements relatifs"]
  - week: "8–11"
    title: { en: "Dynamics of a point mass", ar: "تحريك النقطة المادية", fr: "Dynamique du point" }
    topics:
      en: ["Principle of inertia and momentum", "Newton's laws", "Gravitation, friction and elastic forces", "Angular momentum"]
      ar: ["مبدأ العطالة وكمية الحركة", "قوانين نيوتن", "الجاذبية وقوى الاحتكاك والقوى المرنة", "العزم الحركي"]
      fr: ["Principe d'inertie et quantité de mouvement", "Lois de Newton", "Gravitation, forces de frottement et forces élastiques", "Moment cinétique"]
  - week: "12–14"
    title: { en: "Work and energy", ar: "العمل والطاقة", fr: "Travail et énergie" }
    topics:
      en: ["Work of a force", "Kinetic and potential energy", "Mechanical energy and its conservation", "Field and potential (weight, gravitation)"]
      ar: ["عمل قوة", "الطاقة الحركية والطاقة الكامنة", "الطاقة الميكانيكية وانحفاظها", "الحقل والكمون (الثقل، الجاذبية)"]
      fr: ["Travail d'une force", "Énergies cinétique et potentielle", "Énergie mécanique et sa conservation", "Champ et potentiel (pesanteur, gravitation)"]
  - week: "15"
    title: { en: "Collisions between two isolated particles", ar: "تصادم جسيمين معزولين", fr: "Collisions de deux particules isolées" }
    topics:
      en: ["Elastic collisions", "Inelastic collisions"]
      ar: ["التصادم المرن", "التصادم غير المرن"]
      fr: ["Choc élastique", "Choc inélastique"]


