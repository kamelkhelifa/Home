# DRAFTED plan: the three topics on the course page (chapters, no weeks).
schedule:
  - week: "Ch. 1"
    title: { en: Introduction, ar: مقدمة, fr: Introduction }
    topics:
      en: ["Particles and antiparticles", "Natural units and relativistic kinematics", "Overview of the Standard Model"]
      ar: ["الجسيمات والجسيمات المضادة", "الوحدات الطبيعية والحركيات النسبوية", "نظرة عامة على النموذج المعياري"]
      fr: ["Particules et antiparticules", "Unités naturelles et cinématique relativiste", "Aperçu du Modèle standard"]
  - week: "Ch. 2"
    title: { en: Interactions, ar: التفاعلات, fr: Interactions }
    topics:
      en: ["The four fundamental interactions", "Exchange of force carriers and range", "Feynman diagrams"]
      ar: ["التفاعلات الأساسية الأربعة", "تبادل حاملات القوى والمدى", "مخططات فاينمان"]
      fr: ["Les quatre interactions fondamentales", "Échange de médiateurs et portée", "Diagrammes de Feynman"]
  - week: "Ch. 3"
    title: { en: Conservation laws, ar: قوانين الانحفاظ, fr: Lois de conservation }
    topics:
      en: ["Energy, momentum and charge", "Baryon and lepton numbers", "Strangeness, parity and charge conjugation"]
      ar: ["الطاقة والزخم والشحنة", "العددان الباريوني واللبتوني", "الغرابة والندية ومرافقة الشحنة"]
      fr: ["Énergie, impulsion et charge", "Nombres baryonique et leptonique", "Étrangeté, parité et conjugaison de charge"]

