description:
  en: |
    Weekly format: one lecture session per week, no tutorials.

    Formally an English language course, it was turned into an introductory course in particle physics. It mainly provides a qualitative description of the basics of particle physics, such as the fundamental interactions (forces) and the elementary building blocks of matter. The material presented in the lectures is based on that delivered by Prof. Fred Loebinger at the University of Manchester. The lectures also included an introduction to the typesetting program LaTeX.

    Main topics covered:

    <ol>
    <li>Introduction</li>
    <li>Interactions</li>
    <li>Conservation laws</li>
    </ol>
  ar: |
    التنظيم الأسبوعي: حصة محاضرة واحدة في الأسبوع، دون أعمال موجهة.

    كان هذا المقرر رسميًا مقررًا في اللغة الإنجليزية، فحُوِّل إلى مقرر تمهيدي في فيزياء الجسيمات. ويقدّم أساسًا وصفًا نوعيًا لأسس فيزياء الجسيمات، كالتفاعلات الأساسية (القوى) واللبنات الأولية للمادة. والمحتوى المقدَّم في المحاضرات مبني على ما قدّمه الأستاذ Fred Loebinger في جامعة مانشستر. كما تضمّنت المحاضرات مدخلًا إلى برنامج تنضيد النصوص LaTeX.

    المواضيع الرئيسية المدروسة:

    <ol>
    <li>مقدمة</li>
    <li>التفاعلات</li>
    <li>قوانين الانحفاظ</li>
    </ol>
  fr: |
    Organisation : une séance de cours par semaine, sans travaux dirigés.

    Formellement un cours d'anglais, il a été transformé en cours d'introduction à la physique des particules. Il présente surtout une description qualitative des bases de la physique des particules, comme les interactions fondamentales (forces) et les constituants élémentaires de la matière. Le contenu des cours s'appuie sur celui dispensé par le Pr Fred Loebinger à l'Université de Manchester. Les cours comprenaient aussi une initiation au logiciel de composition de textes LaTeX.

    Principaux thèmes abordés :

    <ol>
    <li>Introduction</li>
    <li>Interactions</li>
    <li>Lois de conservation</li>
    </ol>

