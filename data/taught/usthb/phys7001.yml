description:
  en: |
    Weekly format: one lecture session per week, no tutorials.

    Formally an English language course, it was turned into an introductory course in particle physics. It mainly provides a qualitative description of the basics of particle physics, such as the fundamental interactions (forces) and the elementary building blocks of matter. The material presented in the lectures is based on that delivered by Prof. Fred Loebinger at the University of Manchester. The lectures also included an introduction to the typesetting program LaTeX.

    Main topics covered:

    <ol>
    <li>Introduction</li>
    <li>Interactions</li>
    <li>Conservation laws</li>
    </ol>
  ar: |
    التنظيم الأسبوعي: حصة محاضرة واحدة في الأسبوع، دون أعمال موجهة.

    كان هذا المقرر رسميًا مقررًا في اللغة الإنجليزية، فحُوِّل إلى مقرر تمهيدي في فيزياء الجسيمات. ويقدّم أساسًا وصفًا نوعيًا لأسس فيزياء الجسيمات، كالتفاعلات الأساسية (القوى) واللبنات الأولية للمادة. والمحتوى المقدَّم في المحاضرات مبني على ما قدّمه الأستاذ Fred Loebinger في جامعة مانشستر. كما تضمّنت المحاضرات مدخلًا إلى برنامج تنضيد النصوص LaTeX.

    المواضيع الرئيسية المدروسة:

    <ol>
    <li>مقدمة</li>
    <li>التفاعلات</li>
    <li>قوانين الانحفاظ</li>
    </ol>
  fr: |
    Organisation : une séance de cours par semaine, sans travaux dirigés.

    Formellement un cours d'anglais, il a été transformé en cours d'introduction à la physique des particules. Il présente surtout une description qualitative des bases de la physique des particules, comme les interactions fondamentales (forces) et les constituants élémentaires de la matière. Le contenu des cours s'appuie sur celui dispensé par le Pr Fred Loebinger à l'Université de Manchester. Les cours comprenaient aussi une initiation au logiciel de composition de textes LaTeX.

    Principaux thèmes abordés :

    <ol>
    <li>Introduction</li>
    <li>Interactions</li>
    <li>Lois de conservation</li>
    </ol>

outcomes:
  - id: CLO1
    text: { en: "Name the elementary constituents of matter (quarks, leptons) and the force carriers of the Standard Model.", ar: "يسمّي المكوّنات الأولية للمادة (الكواركات واللبتونات) وحاملات القوى في النموذج المعياري.", fr: "Nommer les constituants élémentaires de la matière (quarks, leptons) et les médiateurs des forces du Modèle standard." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO2
    text: { en: "Use natural units and relativistic kinematics to estimate energies and masses in particle reactions.", ar: "يستعمل الوحدات الطبيعية والحركيات النسبوية لتقدير الطاقات والكتل في التفاعلات الجسيمية.", fr: "Utiliser les unités naturelles et la cinématique relativiste pour estimer énergies et masses dans les réactions." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO3
    text: { en: "Describe the four fundamental interactions, their strength and range, and represent simple processes with Feynman diagrams.", ar: "يصف التفاعلات الأساسية الأربعة وشدّتها ومداها، ويمثّل عمليات بسيطة بمخططات فاينمان.", fr: "Décrire les quatre interactions fondamentales, leur intensité et leur portée, et représenter des processus simples par des diagrammes de Feynman." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO4
    text: { en: "Apply the conservation laws (energy–momentum, charge, baryon and lepton numbers, strangeness, parity) to decide whether a reaction or decay is allowed.", ar: "يطبّق قوانين الانحفاظ (الطاقة-الزخم، الشحنة، العددان الباريوني واللبتوني، الغرابة، الندية) للحكم على إمكان تفاعل أو تفكّك.", fr: "Appliquer les lois de conservation (énergie-impulsion, charge, nombres baryonique et leptonique, étrangeté, parité) pour décider si une réaction ou une désintégration est permise." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO5
    text: { en: "Read introductory particle-physics texts in English.", ar: "يقرأ نصوصًا تمهيدية في فيزياء الجسيمات بالإنجليزية.", fr: "Lire des textes d'introduction à la physique des particules en anglais." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }

