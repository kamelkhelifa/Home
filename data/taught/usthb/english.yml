description:
  en: |
    Weekly format: one 1 h 30 lecture session per week.

    Although it is formally an English language course for physicists, it was turned into a plain physics course delivered in English, based on an undergraduate MIT course on classical mechanics (8.01 Physics I) by Prof. Stanley Kowalski.

    In 2012–2013 the course ran for three weeks only because of an administrative scheduling error; no lecture notes were handed out and, for lack of time, no assignments were given.
  ar: |
    التنظيم الأسبوعي: حصة محاضرة واحدة في الأسبوع مدتها ساعة ونصف.

    مع أنه رسميًا مقرر في اللغة الإنجليزية موجّه للفيزيائيين، فقد عُدِّل ليصبح ببساطة مقررًا في الفيزياء يُدرَّس باللغة الإنجليزية، وهو مبني على مقرر من MIT لمرحلة الليسانس في الميكانيكا الكلاسيكية (8.01 Physics I) للأستاذ Stanley Kowalski.

    في السنة الجامعية 2012–2013 لم يُقدَّم المقرر إلا لثلاثة أسابيع بسبب خلل في التخطيط الإداري؛ ولم تُوزَّع مذكرات محاضرات، ولم تُعطَ واجبات لضيق الوقت.
  fr: |
    Organisation : une séance de cours d'1 h 30 par semaine.

    Bien qu'il s'agisse formellement d'un cours d'anglais destiné aux physiciens, il a été transformé en un simple cours de physique dispensé en anglais, fondé sur un cours de mécanique classique de premier cycle du MIT (8.01 Physics I) du Pr Stanley Kowalski.

    En 2012–2013, le cours n'a duré que trois semaines en raison d'une erreur de planification administrative ; aucun polycopié n'a été distribué et, faute de temps, aucun devoir n'a été donné.

outcomes:
  - id: CLO1
    text: { en: "Follow a physics lecture given in English and take notes.", ar: "يتابع محاضرة في الفيزياء تُلقى بالإنجليزية ويدوّن ملاحظاته.", fr: "Suivre un cours de physique donné en anglais et prendre des notes." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO2
    text: { en: "Use the English vocabulary of units, vectors and motion (position, displacement, velocity, acceleration) correctly.", ar: "يستعمل المصطلحات الإنجليزية للوحدات والأشعة والحركة (الموضع، الانتقال، السرعة، التسارع) استعمالًا صحيحًا.", fr: "Employer correctement le vocabulaire anglais des unités, des vecteurs et du mouvement (position, déplacement, vitesse, accélération)." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO3
    text: { en: "Read a problem written in English, solve it, and write the solution in clear English.", ar: "يقرأ مسألة مكتوبة بالإنجليزية ويحلّها ويكتب حلّها بلغة إنجليزية واضحة.", fr: "Lire un problème rédigé en anglais, le résoudre et rédiger la solution dans un anglais clair." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
  - id: CLO4
    text: { en: "Use English-language resources such as MIT OpenCourseWare to study physics independently.", ar: "يستعمل موارد باللغة الإنجليزية مثل MIT OpenCourseWare لدراسة الفيزياء ذاتيًا.", fr: "Utiliser des ressources en anglais comme MIT OpenCourseWare pour étudier la physique en autonomie." }
    assessed_by: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }

assessment:
  - type: final
