    title: { en: "Final exam", ar: "الاختبار النهائي", fr: "Examen final" }
    detail: { en: "Written exam in English at the end of the semester (with a resit exam).", ar: "اختبار كتابي بالإنجليزية في نهاية الفصل (مع اختبار استدراكي).", fr: "Examen écrit en anglais en fin de semestre (avec examen de rattrapage)." }

# DRAFTED plan: the three weeks the course actually ran, following the start of MIT 8.01.
schedule:
  - week: 1
    title: { en: "Units, dimensions and vectors", ar: "الوحدات والأبعاد والأشعة", fr: "Unités, dimensions et vecteurs" }
    topics:
      en: ["SI units and dimensional analysis", "Vectors and their components", "Reading physics aloud in English"]
      ar: ["وحدات SI والتحليل البعدي", "الأشعة ومركّباتها", "قراءة الفيزياء بصوت مسموع بالإنجليزية"]
      fr: ["Unités SI et analyse dimensionnelle", "Vecteurs et composantes", "Lire la physique à voix haute en anglais"]
  - week: 2
    title: { en: "Motion in one dimension", ar: "الحركة في بعد واحد", fr: "Mouvement à une dimension" }
    topics:
      en: ["Position, displacement, velocity, acceleration", "Motion with constant acceleration", "Describing graphs of motion"]
      ar: ["الموضع والانتقال والسرعة والتسارع", "الحركة بتسارع ثابت", "وصف منحنيات الحركة"]
      fr: ["Position, déplacement, vitesse, accélération", "Mouvement uniformément accéléré", "Décrire des graphiques de mouvement"]
  - week: 3
    title: { en: "Motion in two dimensions", ar: "الحركة في بعدين", fr: "Mouvement à deux dimensions" }
    topics:
      en: ["Projectile motion", "Circular motion", "Review and exam practice"]
      ar: ["حركة القذائف", "الحركة الدائرية", "مراجعة وتدرّب على الاختبار"]
      fr: ["Mouvement d'un projectile", "Mouvement circulaire", "Révision et préparation à l'examen"]

