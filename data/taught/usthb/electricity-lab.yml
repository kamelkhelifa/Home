description:
  en: |
    Weekly format: one lecture session and one tutorial (TD) session per week; one lab (TP) session every two weeks.

    Course outline:

    <ol>
    <li><strong>Electric interaction</strong>: electrification, conservation of charge, conductors and insulators, Coulomb's law.</li>
    <li><strong>Electrostatics</strong>:
    <ul>
    <li>field and potential produced by a charge, the superposition principle, charge distributions, field-line topography;</li>
    <li>electric dipoles: the potential and field produced by a dipole, torque exerted on a dipole by a field, energy of a dipole;</li>
    <li>the notion of flux, Gauss's theorem (without proof), applications;</li>
    <li>conductors in equilibrium, total influence;</li>
    <li>capacitors: capacitance, electrical energy, combinations of capacitors.</li>
    </ul></li>
    </ol>

    Lab sessions (TP): introduction; characteristics of two-terminal components; the oscilloscope; transient behaviour of RC and RL circuits; the electrolytic (rheographic) tank.

    Problem sets, lab sheets, lecture notes and common exams marked “department document” were prepared by the course's teaching committee at USTHB, not by a single author; they are the documents used in class.
  ar: |
    التنظيم الأسبوعي: حصة محاضرة وحصة أعمال موجهة كل أسبوع، وحصة أعمال تطبيقية كل 15 يومًا.

    مفردات المقرر:

    <ol>
    <li><strong>التفاعل الكهربائي</strong>: التكهرب، انحفاظ الشحنة، النواقل والعوازل، قانون كولوم.</li>
    <li><strong>الكهروساكنة</strong>:
    <ul>
    <li>الحقل والكمون الناتجان عن شحنة، مبدأ التراكب، توزيعات الشحن، طوبوغرافيا الحقل؛</li>
    <li>ثنائيات الأقطاب الكهربائية: الكمون والحقل الناتجان عن ثنائي قطب، المزدوجة التي يؤثر بها حقل على ثنائي قطب، طاقة ثنائي القطب؛</li>
    <li>مفهوم التدفق، نظرية غاوس (دون برهان)، تطبيقات؛</li>
    <li>النواقل في حالة التوازن، التأثير الكلي؛</li>
    <li>المكثفات: السعة، الطاقة الكهربائية، تجميع المكثفات.</li>
    </ul></li>
    </ol>

    الأعمال التطبيقية: مقدمة؛ مميزات ثنائيات الأقطاب؛ راسم الاهتزاز المهبطي؛ دراسة الدارتين RC وRL في النظام الانتقالي؛ الحوض الريوغرافي (الإلكتروليتي).

    سلاسل التمارين وأوراق الأعمال التطبيقية والمطبوعات والاختبارات الموحّدة المعلَّمة بعبارة «وثيقة القسم» من إعداد الفريق البيداغوجي للمقرر في جامعة باب الزوار، لا من إعداد مؤلف واحد؛ وهي الوثائق المستعملة في الدروس.
  fr: |
    Organisation : une séance de cours et une séance de travaux dirigés (TD) par semaine ; une séance de travaux pratiques (TP) tous les quinze jours.

    Plan du cours :

    <ol>
    <li><strong>Interaction électrique</strong> : électrisation, conservation de la charge, conducteurs et isolants, loi de Coulomb.</li>
    <li><strong>Électrostatique</strong> :
    <ul>
    <li>champ et potentiel créés par une charge, principe de superposition, distributions de charges, topographie d'un champ ;</li>
    <li>dipôles électriques : potentiel et champ créés par un dipôle, couple exercé sur un dipôle par un champ, énergie d'un dipôle ;</li>
    <li>notion de flux, théorème de Gauss (sans démonstration), applications ;</li>
    <li>conducteurs en équilibre, influence totale ;</li>
    <li>condensateurs : capacité, énergie électrique, groupements de condensateurs.</li>
    </ul></li>
    </ol>

    Travaux pratiques : introduction ; caractéristiques de dipôles ; l'oscilloscope ; étude des circuits RC et RL en régime transitoire ; la cuve rhéographique.

    Les séries de TD, fiches de TP, polycopiés et examens communs marqués « document du département » ont été préparés par l'équipe pédagogique du module à l'USTHB, et non par un seul auteur ; ce sont les documents utilisés en cours.

outcomes:
  - id: CLO1
    text: { en: "State Coulomb's law and the conservation of charge, and distinguish conductors from insulators.", ar: "يصوغ قانون كولوم وانحفاظ الشحنة، ويميّز النواقل من العوازل.", fr: "Énoncer la loi de Coulomb et la conservation de la charge, et distinguer conducteurs et isolants." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO2
    text: { en: "Compute the electric field and potential of point charges and continuous distributions using the superposition principle.", ar: "يحسب الحقل والكمون الكهربائيين لشحن نقطية وتوزيعات مستمرة باستعمال مبدأ التراكب.", fr: "Calculer le champ et le potentiel électriques de charges ponctuelles et de distributions continues par le principe de superposition." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO3
    text: { en: "Describe the electric dipole: its field and potential, and the torque and energy in an external field.", ar: "يصف ثنائي القطب الكهربائي: حقله وكمونه، والمزدوجة والطاقة في حقل خارجي.", fr: "Décrire le dipôle électrique : champ et potentiel créés, couple et énergie dans un champ extérieur." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO4
    text: { en: "Use Gauss's theorem to find the field of symmetric charge distributions.", ar: "يستعمل نظرية غاوس لإيجاد حقل توزيعات شحنية متناظرة.", fr: "Utiliser le théorème de Gauss pour trouver le champ de distributions de charges symétriques." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO5
    text: { en: "Describe conductors in equilibrium and compute capacitances, combinations of capacitors and stored energy.", ar: "يصف النواقل في حالة التوازن ويحسب السعات وتجميع المكثفات والطاقة المخزّنة.", fr: "Décrire les conducteurs en équilibre et calculer capacités, groupements de condensateurs et énergie stockée." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }
  - id: CLO6
    text: { en: "Use basic electrical instruments (multimeter, generator, oscilloscope) to study components and RC/RL transients, and write a lab report.", ar: "يستعمل أجهزة القياس الكهربائية الأساسية (المتعدد، المولّد، راسم الاهتزاز) لدراسة العناصر والنظام الانتقالي في RC وRL، ويكتب تقريرًا.", fr: "Utiliser les appareils de mesure de base (multimètre, générateur, oscilloscope) pour étudier des dipôles et les régimes transitoires RC/RL, et rédiger un compte rendu." }
    assessed_by: { en: "Tests, final exam and lab work", ar: "الفروض والاختبار النهائي والأعمال التطبيقية", fr: "Interrogations, examen final et TP" }

