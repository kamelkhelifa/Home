# DRAFTED plan (15 weeks): the course outline spread over the semester as in the national LMD programme.
schedule:
  - week: "1–2"
    title: { en: "Electric interaction", ar: "التفاعل الكهربائي", fr: "Interaction électrique" }
    topics:
      en: ["Electrification and conservation of charge", "Conductors and insulators", "Coulomb's law"]
      ar: ["التكهرب وانحفاظ الشحنة", "النواقل والعوازل", "قانون كولوم"]
      fr: ["Électrisation et conservation de la charge", "Conducteurs et isolants", "Loi de Coulomb"]
  - week: "3–5"
    title: { en: "Electric field and potential", ar: "الحقل والكمون الكهربائيان", fr: "Champ et potentiel électriques" }
    topics:
      en: ["Field and potential of a point charge", "Superposition principle", "Charge distributions and field lines"]
      ar: ["حقل شحنة نقطية وكمونها", "مبدأ التراكب", "توزيعات الشحن وخطوط الحقل"]
      fr: ["Champ et potentiel d'une charge ponctuelle", "Principe de superposition", "Distributions de charges et lignes de champ"]
  - week: "6–7"
    title: { en: "Electric dipoles", ar: "ثنائيات الأقطاب الكهربائية", fr: "Dipôles électriques" }
    topics:
      en: ["Field and potential of a dipole", "Torque and energy in an external field"]
      ar: ["حقل ثنائي القطب وكمونه", "المزدوجة والطاقة في حقل خارجي"]
      fr: ["Champ et potentiel d'un dipôle", "Couple et énergie dans un champ extérieur"]
  - week: "8–10"
    title: { en: "Flux and Gauss's theorem", ar: "التدفق ونظرية غاوس", fr: "Flux et théorème de Gauss" }
    topics:
      en: ["Electric flux", "Gauss's theorem", "Applications to symmetric distributions"]
      ar: ["التدفق الكهربائي", "نظرية غاوس", "تطبيقات على التوزيعات المتناظرة"]
      fr: ["Flux électrique", "Théorème de Gauss", "Applications aux distributions symétriques"]
  - week: "11–12"
    title: { en: "Conductors in equilibrium", ar: "النواقل في حالة التوازن", fr: "Conducteurs en équilibre" }
    topics:
      en: ["Properties of a conductor in equilibrium", "Total influence"]
      ar: ["خصائص الناقل في حالة التوازن", "التأثير الكلي"]
      fr: ["Propriétés d'un conducteur en équilibre", "Influence totale"]
  - week: "13–15"
    title: { en: "Capacitors", ar: "المكثفات", fr: "Condensateurs" }
    topics:
      en: ["Capacitance", "Electrical energy", "Combinations of capacitors"]
      ar: ["السعة", "الطاقة الكهربائية", "تجميع المكثفات"]
      fr: ["Capacité", "Énergie électrique", "Groupements de condensateurs"]


