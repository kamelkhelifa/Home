notes: >
  The page lists lectures by C. Benchouk and tutorials by K. Khelifa (2013/2014): he taught tutorials to MI
  groups G2 and G4 and lab sessions to ST groups B and E, so both the TD and the TP material are kept here.
  The "Objectives" ("Introduire :") and "Course description" sections of the page are empty. Session counts
  are sessions, not hours, so `hours` is left out. The textbook entry on the page names "Decitre" (a bookshop)
  as publisher; the publisher was left out (Dunod?). TP solutions, the final-exam solution and lab-report
  sheets had no links. Student marks dropped.
