slug: phys193
order: 10
codes: [PHYS 193]
title: { en: "General Physics for Engineering II", ar: "الفيزياء العامة لطلبة الهندسة 2" }
tagline:
  en: "Calculus-based electricity and magnetism for engineers: from Coulomb's law to electromagnetic waves."
  ar: الكهرباء والمغناطيسية المعتمدة على التفاضل والتكامل لطلبة الهندسة، من قانون كولوم إلى الأمواج الكهرومغناطيسية.
level: { en: "Service course for the College of Engineering", ar: "مقرر خدمي لكلية الهندسة" }
area: electromagnetism
companion: general-physics-2   # Part 2 course whose interactive lab and glossary this page shows
kind: { en: "Lecture & recitation", ar: "محاضرات وحصص تطبيقية" }
taught:
  - { years: Fall 2026, code: PHYS 193, lang: en }
credits: 3
hours: { lecture: 3, tutorial: 1, lab: 0 }
weeks: 15
prerequisites: { en: "PHYS 191 and PHYS 192", ar: "PHYS 191 و PHYS 192" }

description:
  en: |
    This is the second course in the two-semester sequence of calculus-based introductory physics courses designed to meet the needs of students majoring in Engineering. The course is a continuation of the survey of the concepts and principles of classical physics presented in PHYS 191.

    Topics include electrostatics, electric charge and electric field, Coulomb's law, electric potential, capacitance and dielectrics, current, resistance, Ohm's law, electromotive force, direct-current circuits, magnetism, magnetic fields and magnetic forces, sources of the magnetic field, the Biot–Savart law and Ampère's law, induction, Faraday's law, Maxwell's equations and electromagnetic radiation.

    The inquiry-based and integrative learning used in the course allows students to solve real-world problems, which enhances their critical thinking and technical skills in a digitally enriched, learner-centred environment.
  ar: |
    هذا المقرر هو الثاني في سلسلة من فصلين دراسيين لمقررات الفيزياء التمهيدية المعتمدة على التفاضل والتكامل، والمصمَّمة لتلبية احتياجات طلبة تخصصات الهندسة. وهو استكمال لعرض مفاهيم الفيزياء الكلاسيكية ومبادئها الذي بدأ في المقرر PHYS 191.

    تشمل المواضيع: الكهرباء الساكنة، والشحنة الكهربائية والمجال الكهربائي، وقانون كولوم، والجهد الكهربائي، والسعة والعوازل، والتيار والمقاومة وقانون أوم، والقوة الدافعة الكهربائية، ودارات التيار المستمر، والمغناطيسية والمجال والقوى المغناطيسية، ومصادر المجال المغناطيسي، وقانون بيو–سافار وقانون أمبير، والحث وقانون فاراداي، ومعادلات ماكسويل، والإشعاع الكهرومغناطيسي.

    يتيح التعلّم القائم على الاستقصاء والتعلّم التكاملي المعتمد في المقرر للطلبة حلّ مسائل من الواقع، مما يعزّز تفكيرهم الناقد ومهاراتهم التقنية في بيئة غنية بالرقمنة ومتمحورة حول المتعلّم.

objectives:
  - { en: "Demonstrate the fundamental laws and theorems of electrostatics and magnetostatics.", ar: "إبراز القوانين والمبرهنات الأساسية للكهرباء الساكنة والمغناطيسية الساكنة." }
  - { en: "Apply the basic principles and laws of electrodynamics.", ar: "تطبيق المبادئ والقوانين الأساسية للديناميكا الكهربائية." }
  - { en: "Explain the basic conceptual knowledge of the fundamentals of electromagnetic waves.", ar: "شرح المعارف المفاهيمية الأساسية لأسس الأمواج الكهرومغناطيسية." }

methods:
  - { en: "PowerPoint lectures and active classroom-based discussion.", ar: "محاضرات بالعروض التقديمية ونقاش صفّي نشط." }
  - { en: "Problem solving and collaborative learning in small groups.", ar: "حلّ المسائل والتعلّم التعاوني ضمن مجموعات صغيرة." }
  - { en: "Relevant videos and animations.", ar: "مقاطع مرئية ورسوم متحركة ذات صلة." }
  - { en: "Web-based learning through the learning management system.", ar: "التعلّم عبر الويب من خلال نظام إدارة التعلّم." }

outcomes:
  - id: CLO1
    text: { en: "Evaluate electric fields, electric forces and electric potential energy for discrete and continuous charge distributions.", ar: "يقيّم المجالات والقوى الكهربائية وطاقة الوضع الكهربائية لتوزيعات الشحنة المنفصلة والمتصلة." }
    assessed_by: { en: "Homework 1–2 · Quizzes 1–2 · PBL & oral presentation · Midterm · Final", ar: "الواجبان 1–2 · الاختباران القصيران 1–2 · التعلّم بالمشكلات والعرض الشفهي · الاختبار الفصلي · النهائي" }
  - id: CLO2
    text: { en: "Calculate the capacitance of different configurations and combinations and determine their stored energy.", ar: "يحسب سعة المكثفات في تشكيلات وتوصيلات مختلفة ويحدّد الطاقة المخزّنة فيها." }
    assessed_by: { en: "Homework 2 · Quiz 2 · PBL & oral presentation · Midterm · Final", ar: "الواجب 2 · الاختبار القصير 2 · التعلّم بالمشكلات والعرض الشفهي · الاختبار الفصلي · النهائي" }
  - id: CLO3
    text: { en: "Employ Ohm's law and Kirchhoff's rules to determine the parameters of DC circuits.", ar: "يوظّف قانون أوم وقاعدتي كيرشوف لتحديد مقادير دارات التيار المستمر." }
    assessed_by: { en: "Homework 3 · Quiz 3 · PBL & flipped classroom · Oral presentation · Midterm · Final", ar: "الواجب 3 · الاختبار القصير 3 · التعلّم بالمشكلات والصف المقلوب · العرض الشفهي · الاختبار الفصلي · النهائي" }
  - id: CLO4
    text: { en: "Describe the sources of magnetic fields, forces and torques.", ar: "يصف مصادر المجالات المغناطيسية والقوى والعزوم المغناطيسية." }
    assessed_by: { en: "Homework 4 · Quiz 4 · PBL & oral presentation · Final", ar: "الواجب 4 · الاختبار القصير 4 · التعلّم بالمشكلات والعرض الشفهي · النهائي" }
  - id: CLO5
    text: { en: "Compute magnetic fields using the Biot–Savart law and Ampère's law.", ar: "يحسب المجالات المغناطيسية باستخدام قانون بيو–سافار وقانون أمبير." }
    assessed_by: { en: "Homework 4 · Quiz 4 · PBL & oral presentation · Final", ar: "الواجب 4 · الاختبار القصير 4 · التعلّم بالمشكلات والعرض الشفهي · النهائي" }
  - id: CLO6
    text: { en: "Discuss Faraday's law and Lenz's law and evaluate induced electromotive force.", ar: "يناقش قانوني فاراداي ولنز ويقيّم القوة الدافعة الكهربائية المستحثّة." }
    assessed_by: { en: "Homework 5 · Quiz 5 · PBL & oral presentation · Final", ar: "الواجب 5 · الاختبار القصير 5 · التعلّم بالمشكلات والعرض الشفهي · النهائي" }
  - id: CLO7
    text: { en: "Analyse RL, RC and LRC circuits in terms of the voltage across circuit elements and the power flowing into and out of a circuit.", ar: "يحلّل دارات RL وRC وLRC من حيث الجهد بين طرفي عناصر الدارة والقدرة الداخلة إليها والخارجة منها." }
    assessed_by: { en: "Homework 5–6 · Quizzes 5–6 · PBL & oral presentation · Final", ar: "الواجبان 5–6 · الاختباران القصيران 5–6 · التعلّم بالمشكلات والعرض الشفهي · النهائي" }
  - id: CLO8
    text: { en: "Demonstrate the fundamental equations that govern all electromagnetic phenomena and the basic properties of electromagnetic waves.", ar: "يبرز المعادلات الأساسية التي تحكم جميع الظواهر الكهرومغناطيسية والخصائص الأساسية للأمواج الكهرومغناطيسية." }
    assessed_by: { en: "PBL & oral presentation · Final", ar: "التعلّم بالمشكلات والعرض الشفهي · النهائي" }

