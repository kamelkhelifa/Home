schedule:
  - week: 1
    title: { en: "Electric fields (Ch. 22)", ar: "المجالات الكهربائية (الفصل 22)" }
    topics:
      en: [Introduction and general course information, Properties of electric charges, Charging objects by induction]
      ar: [مقدمة ومعلومات عامة عن المقرر, خصائص الشحنات الكهربائية, شحن الأجسام بالحث]
    reading: Serway & Jewett Ch. 22
  - week: 2
    title: { en: "Electric fields, continued (Ch. 22)", ar: "المجالات الكهربائية، تتمة (الفصل 22)" }
    topics:
      en: ["Coulomb's law", "Analysis model: particle in a field (electric)", Electric field lines, Motion of a charged particle in a uniform electric field]
      ar: [قانون كولوم, "نموذج تحليلي: جسيم في مجال (كهربائي)", خطوط المجال الكهربائي, حركة جسيم مشحون في مجال كهربائي منتظم]
    reading: Serway & Jewett Ch. 22
    activity: { en: "Homework 1 · Quiz 1", ar: "الواجب 1 · الاختبار القصير 1" }
  - week: 3
    title: { en: "Continuous charge distributions and Gauss's law (Ch. 23)", ar: "توزيعات الشحنة المتصلة وقانون غاوس (الفصل 23)" }
    topics:
      en: [Electric field of a continuous charge distribution, Electric flux, "Gauss's law", "Application of Gauss's law to various charge distributions"]
      ar: [المجال الكهربائي لتوزيع شحنة متصل, التدفق الكهربائي, قانون غاوس, تطبيق قانون غاوس على توزيعات شحنة مختلفة]
    reading: Serway & Jewett Ch. 23
  - week: 4
    title: { en: "Electric potential (Ch. 24)", ar: "الجهد الكهربائي (الفصل 24)" }
    topics:
      en: [Electric potential and potential difference, Potential difference in a uniform electric field, Electric potential and potential energy due to point charges, Obtaining the electric field from the electric potential, Electric potential due to continuous charge distributions, Conductors in electrostatic equilibrium]
      ar: [الجهد الكهربائي وفرق الجهد, فرق الجهد في مجال كهربائي منتظم, الجهد الكهربائي وطاقة الوضع الناتجان عن شحنات نقطية, استنتاج المجال الكهربائي من الجهد, الجهد الكهربائي لتوزيعات شحنة متصلة, الموصلات في حالة الاتزان الكهروستاتيكي]
    reading: Serway & Jewett Ch. 24
    activity: { en: "Homework 2 · Quiz 2", ar: "الواجب 2 · الاختبار القصير 2" }
  - week: 5
    title: { en: "Capacitance and dielectrics (Ch. 25)", ar: "السعة والعوازل (الفصل 25)" }
    topics:
      en: [Definition of capacitance, Calculating capacitance, Combinations of capacitors, Energy stored in a charged capacitor, Capacitors with dielectrics, Electric dipole in an electric field]
      ar: [تعريف السعة, حساب السعة, توصيل المكثفات, الطاقة المخزّنة في مكثف مشحون, المكثفات ذات العوازل, ثنائي القطب الكهربائي في مجال كهربائي]
    reading: Serway & Jewett Ch. 25
  - week: 6
    title: { en: "Current and resistance (Ch. 26)", ar: "التيار والمقاومة (الفصل 26)" }
    topics:
      en: [Electric current, Resistance, A model for electrical conduction, Resistance and temperature, Electrical power]
      ar: [التيار الكهربائي, المقاومة, نموذج للتوصيل الكهربائي, المقاومة ودرجة الحرارة, القدرة الكهربائية]
    reading: Serway & Jewett Ch. 26
    activity: { en: "Homework 3 · Quiz 3", ar: "الواجب 3 · الاختبار القصير 3" }
  - week: 7
    title: { en: "Direct-current circuits (Ch. 27)", ar: "دارات التيار المستمر (الفصل 27)" }
    topics:
      en: [Electromotive force, Resistors in series and parallel, "Kirchhoff's rules", RC circuits, "Midterm exam (Ch. 22–26)"]
      ar: [القوة الدافعة الكهربائية, توصيل المقاومات على التوالي والتوازي, قاعدتا كيرشوف, دارات RC, "الاختبار الفصلي (الفصول 22–26)"]
    reading: Serway & Jewett Ch. 27
    milestone: midterm
  - week: 8
    title: { en: "Magnetic fields (Ch. 28)", ar: "المجالات المغناطيسية (الفصل 28)" }
    topics:
      en: ["Analysis model: particle in a field (magnetic)", Motion of a charged particle in a uniform magnetic field, Applications involving charged particles moving in a magnetic field, Magnetic force acting on a current-carrying conductor, Torque on a current loop in a uniform magnetic field]
      ar: ["نموذج تحليلي: جسيم في مجال (مغناطيسي)", حركة جسيم مشحون في مجال مغناطيسي منتظم, تطبيقات على حركة الجسيمات المشحونة في مجال مغناطيسي, القوة المغناطيسية المؤثرة في موصل يحمل تيارًا, العزم المؤثر في حلقة تيار داخل مجال مغناطيسي منتظم]
    reading: Serway & Jewett Ch. 28
    activity: { en: "Homework 4 · Quiz 4", ar: "الواجب 4 · الاختبار القصير 4" }
  - week: 9
    title: { en: "Sources of the magnetic field (Ch. 29)", ar: "مصادر المجال المغناطيسي (الفصل 29)" }
    topics:
      en: ["The Biot–Savart law", The magnetic force between two parallel conductors, "Ampère's law", The magnetic field of a solenoid, "Gauss's law in magnetism", Magnetism in matter]
      ar: [قانون بيو–سافار, القوة المغناطيسية بين موصلين متوازيين, قانون أمبير, المجال المغناطيسي لملف لولبي, قانون غاوس في المغناطيسية, المغناطيسية في المادة]
    reading: Serway & Jewett Ch. 29
  - week: 10
    title: { en: "Semester break", ar: "عطلة منتصف الفصل" }
    milestone: break
  - week: 11
    title: { en: "Faraday's law (Ch. 30)", ar: "قانون فاراداي (الفصل 30)" }
    topics:
      en: ["Faraday's law of induction", Motional emf, "Lenz's law", "The general form of Faraday's law", Generators and motors]
      ar: [قانون فاراداي في الحث, القوة الدافعة الحركية, قانون لنز, الصيغة العامة لقانون فاراداي, المولّدات والمحركات]
    reading: Serway & Jewett Ch. 30
    activity: { en: "Homework 5 · Quiz 5", ar: "الواجب 5 · الاختبار القصير 5" }
  - week: 12
    title: { en: "Inductance (Ch. 31)", ar: "الحثّية (الفصل 31)" }
    topics:
      en: [Self-induction and inductance, RL circuits, Energy in a magnetic field, Mutual inductance, Oscillations in an LC circuit, The RLC circuit]
      ar: [الحث الذاتي والحثّية, دارات RL, الطاقة في المجال المغناطيسي, الحث المتبادل, التذبذبات في دارة LC, دارة RLC]
    reading: Serway & Jewett Ch. 31
  - week: 13
    title: { en: "Alternating-current circuits (Ch. 32)", ar: "دارات التيار المتناوب (الفصل 32)" }
    topics:
      en: [AC sources, Resistors in an AC circuit, Inductors in an AC circuit, Capacitors in an AC circuit, The RLC series circuit, Power in an AC circuit, Resonance in a series RLC circuit, The transformer and power transmission]
      ar: [مصادر التيار المتناوب, المقاومات في دارة تيار متناوب, الملفات في دارة تيار متناوب, المكثفات في دارة تيار متناوب, دارة RLC على التوالي, القدرة في دارة تيار متناوب, الرنين في دارة RLC على التوالي, المحوّل ونقل الطاقة الكهربائية]
    reading: Serway & Jewett Ch. 32
    activity: { en: "Homework 6 · Quiz 6", ar: "الواجب 6 · الاختبار القصير 6" }
  - week: 14
    title: { en: "Electromagnetic waves (Ch. 33)", ar: "الأمواج الكهرومغناطيسية (الفصل 33)" }
    topics:
      en: ["Displacement current and the general form of Ampère's law", "Maxwell's equations and Hertz's discoveries", Plane electromagnetic waves, Energy carried by electromagnetic waves, Momentum and radiation pressure, Production of electromagnetic waves by an antenna, The spectrum of electromagnetic waves]
      ar: [تيار الإزاحة والصيغة العامة لقانون أمبير, معادلات ماكسويل واكتشافات هيرتز, الأمواج الكهرومغناطيسية المستوية, الطاقة التي تحملها الأمواج الكهرومغناطيسية, الزخم وضغط الإشعاع, توليد الأمواج الكهرومغناطيسية بالهوائي, طيف الأمواج الكهرومغناطيسية]
    reading: Serway & Jewett Ch. 33
  - week: 15
    title: { en: "Review week", ar: "أسبوع المراجعة" }
    milestone: review

