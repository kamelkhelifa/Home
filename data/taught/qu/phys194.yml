safety:
  - { en: "Comply with the safety instructions of the apparatus you use and with the indications of the instructor.", ar: "التزم بتعليمات السلامة الخاصة بالأجهزة المستعملة وبتوجيهات الأستاذ." }
  - { en: "Have your electrical circuits checked by the instructor before switching on. If you are not sure, ask!", ar: "اعرض دارتك الكهربائية على الأستاذ قبل تشغيلها. وإن لم تكن متأكدًا فاسأل!" }
  - { en: "Do not use laboratory instruments in a manner for which they were not intended; pay special attention to hot devices.", ar: "لا تستعمل أجهزة المختبر في غير ما صُمّمت له، وانتبه خاصةً للأجهزة الساخنة." }
  - { en: "Do not eat or drink in the laboratory. Leave it tidy and put instruments and cables back in place.", ar: "لا تأكل ولا تشرب في المختبر، واتركه مرتبًا وأعد الأجهزة والأسلاك إلى أماكنها." }

