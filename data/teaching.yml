hero_title: { en: "Teaching, <em>then and now.</em>", ar: "التدريس، <em>بين الأمس واليوم.</em>" }
philosophy:
  en: >
    Physics is learned by doing. I build my courses around clear structure, worked
    problems and open materials, so that every student can find the syllabus, the notes
    and the past exams in one place, in the language they need.
  ar: >
    الفيزياء تُتعلَّم بالممارسة. أبني مقرراتي على هيكلة واضحة ومسائل محلولة ومواد مفتوحة، حتى
    يجد كل طالب المفردات والمذكرات والاختبارات السابقة في مكان واحد، وباللغة التي يحتاجها.

