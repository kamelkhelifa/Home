  sec_overview_d:
    en: What the course is about and what you need before starting.
    ar: موضوع المقرر وما تحتاجه قبل البدء.
    fr: Le contenu du cours et les prérequis.
  sec_outcomes_d:
    en: What you will be able to do, and how each outcome is assessed.
    ar: ما ستكون قادرًا على فعله، وكيف يُقيَّم كل مخرج.
    fr: Ce que vous saurez faire, et comment chaque acquis est évalué.
  sec_schedule_d:
    en: Fourteen weeks, step by step. Tick a week when you have studied it.
    ar: الأسابيع خطوةً بخطوة. أشِّر على الأسبوع بعد دراسته.
    fr: Semaine après semaine. Cochez une semaine une fois étudiée.
  sec_assessment_d:
    en: A varied scheme so that every outcome is measured more than once.
    ar: أساليب متنوعة حتى يُقاس كل مخرج أكثر من مرة.
    fr: Un dispositif d'évaluation varié.
  sec_materials_d:
    en: Notes, problem sets, solutions, videos and more.
    ar: المذكرات وسلاسل التمارين والحلول والمقاطع المرئية وغيرها.
    fr: Polycopiés, séries d'exercices, corrigés, vidéos…
  sec_exams_d:
    en: What to expect on exam day, and past papers to practise with.
    ar: ما تتوقعه يوم الاختبار، واختبارات سابقة للتدرّب.
    fr: Le déroulement des examens et les sujets des années passées.
  sec_problems_d:
    en: Exam-style problems. Try first, then reveal the hint and the full solution.
    ar: مسائل على نمط الاختبارات. حاول أولًا، ثم اكشف التلميح والحل الكامل.
    fr: Problèmes de type examen. Cherchez d'abord, puis affichez l'indice et la solution.
  sec_quizzes_d:
    en: Instant feedback with an explanation for every answer. Your best score is saved.
    ar: تصحيح فوري مع شرح لكل إجابة. تُحفظ أفضل نتيجة لك.
    fr: Correction immédiate avec une explication pour chaque réponse.
  sec_lab_d:
    en: Change the parameters and watch the physics respond.
    ar: غيّر المعاملات وشاهد استجابة الظاهرة الفيزيائية.
    fr: Modifiez les paramètres et observez la physique.
  sec_library_d:
