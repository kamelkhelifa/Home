tagline:
  en: >
    Theoretical particle physicist working on all-order perturbative QCD and jet
    physics at high-energy colliders, and a teacher at heart.
  ar: >
    فيزيائي نظري متخصص في فيزياء الجسيمات، يعمل على الكروموديناميكا الكمية الاضطرابية
    بجميع الرتب وفيزياء النفثات في المصادمات عالية الطاقة، ومعلّمٌ في المقام الأول.

bio:
  en: >
    I am an Associate Professor of Physics at Qatar University. My research sits at the
    intersection of precision Quantum Chromodynamics and collider phenomenology: exact
    multi-loop calculations, all-order resummation and the analytical structure of jet
    observables at the LHC. I studied at The University of Manchester (MPhys, PhD) and
    have since taught physics for more than thirteen years across universities in Qatar,
    Saudi Arabia and Algeria. Alongside physics, I have completed two years of medical studies
    at the University of Chlef, now on hold since my move to Qatar University.
  ar: >
    أستاذ مشارك في الفيزياء بجامعة قطر. تقع أبحاثي في ملتقى الكروموديناميكا الكمية الدقيقة
    وفينومينولوجيا المصادمات: حسابات دقيقة متعددة الحلقات، وإعادة الجمع بجميع الرتب، والبنية
    التحليلية لمقادير النفثات المرصودة في مصادم الهادرونات الكبير. تكوّنت في جامعة مانشستر
    (ماجستير الفيزياء ثم الدكتوراه)، ودرّست الفيزياء منذ ذلك الحين أكثر من ثلاث عشرة سنة في
    جامعات بقطر والمملكة العربية السعودية والجزائر. وإلى جانب الفيزياء، أتممت سنتين من دراسة
    الطب بجامعة الشلف، وهي مجمّدة حاليًا منذ انتقالي إلى جامعة قطر.

