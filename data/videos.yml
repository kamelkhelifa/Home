# ─────────────────────────────────────────────────────────────
#  Chapter overview videos, each with its mind map and self-check questions.
#  Organised course → chapter. The video and the mind map are shown in the course page's Videos section;
#  the self-check is shown in its Self-check quizzes section, one foldable entry per chapter.
#  Files live in static/videos/<course>/<chapter>/.
#
#  To add a chapter: copy a block under `chapters:`.
#  `youtube:` — once the video is on YouTube, put its id here (the part after watch?v=);
#               the page then embeds YouTube (auto-translated voice-over and captions
#               available there) and the self-hosted MP4 can be deleted from static/.
#  `echo360:` — public Echo360 link; shown as a button, and as the main "Watch" link while there is no player.
#  Videos are NOT kept in this repository (GitHub Pages storage is small): leave `mp4:` empty and
#  put the Echo360 (or YouTube) link instead.
#  `chapters:` — jump points inside the video, in seconds.
# ─────────────────────────────────────────────────────────────

