courses:
  - id: phys193
    course: qu/phys193
    title: { en: "PHYS 193 · General Physics for Engineering II", ar: "PHYS 193 · الفيزياء العامة لطلبة الهندسة 2" }
    book: { en: "Serway & Jewett, Physics for Scientists and Engineers, 11th ed.", ar: "سيرواي وجيويت، «الفيزياء للعلماء والمهندسين»، الطبعة 11" }
    chapters:
      - id: ch30
        chapter: 30
        week: 11
        title: { en: "Faraday's Law", ar: "قانون فاراداي" }
        sections: "30.1 – 30.5"
        duration: "9:25"
        summary:
          en: >
            Faraday's law of induction, motional emf, Lenz's law, the general form of
            Faraday's law, and generators and motors — the five sections in one sitting,
            each with a "pause and predict" moment and its pitfall.
          ar: >
            قانون فاراداي للحث، والقوة الدافعة الحركية، وقانون لنز، والصيغة العامة لقانون
            فاراداي، والمولدات والمحركات — الأجزاء الخمسة في جلسة واحدة، مع لحظة «توقّف وتوقّع» وخطأ شائع لكل جزء.
        video:
          mp4: assets/videos/phys193/ch30/PHYS193_W11_Ch30_Overview.mp4
          captions: assets/videos/phys193/ch30/PHYS193_W11_Ch30_Overview.vtt
          poster: assets/videos/phys193/ch30/PHYS193_W11_Ch30_Overview_poster.jpg
          youtube:
          echo360:
          chapters:
            - { t: 0,   title: { en: "Why this chapter", ar: "لماذا هذا الفصل" } }
            - { t: 30,  title: { en: "§30.1 Faraday's law of induction", ar: "§30.1 قانون فاراداي للحث" } }
            - { t: 120, title: { en: "§30.2 Motional emf", ar: "§30.2 القوة الدافعة الحركية" } }
            - { t: 216, title: { en: "§30.3 Lenz's law", ar: "§30.3 قانون لنز" } }
            - { t: 320, title: { en: "§30.4 The general form of Faraday's law", ar: "§30.4 الصيغة العامة لقانون فاراداي" } }
            - { t: 414, title: { en: "§30.5 Generators and motors", ar: "§30.5 المولدات والمحركات" } }
            - { t: 516, title: { en: "Five things to remember", ar: "خمسة أشياء للتذكّر" } }
        mindmap:
          html: assets/videos/phys193/ch30/PHYS193_W11_Ch30_MindMap.html
          pdf: assets/videos/phys193/ch30/PHYS193_W11_Ch30_MindMap.pdf
        selfcheck:
          html: assets/videos/phys193/ch30/PHYS193_W11_Ch30_SelfCheck.html
          pdf: assets/videos/phys193/ch30/PHYS193_W11_Ch30_SelfCheck.pdf
