  selfcheck: { en: Self-check, ar: التحقق الذاتي }
  selfcheck_text: { en: "Ten questions, two per section, with instant feedback.", ar: "عشرة أسئلة، سؤالان لكل جزء، مع تغذية راجعة فورية." }
  open: { en: Open, ar: افتح }
