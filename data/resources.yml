        text: { en: "Course channels for undergraduate and master's physics.", ar: "قنوات مقررات الفيزياء في الليسانس والماستر." }

  - id: guides
    title: { en: "Software guides for HEP", ar: "أدلة برمجيات فيزياء الطاقات العالية" }
    icon: layers
    items:
      - label: { en: EVENT2, ar: EVENT2 }
        page: resources/event2
        kind: { en: Guide, ar: دليل }
        text: { en: "Compiling and running the EVENT2 NLO Monte Carlo for e⁺e⁻ event shapes.", ar: "تثبيت وتشغيل برنامج مونت كارلو EVENT2 من الرتبة التالية للرائدة لأشكال أحداث e⁺e⁻." }
      - label: { en: Herwig, ar: Herwig }
        page: resources/herwig
        kind: { en: Guide, ar: دليل }
        text: { en: "Installing and running the Herwig event generator, step by step.", ar: "تثبيت مولّد الأحداث Herwig وتشغيله خطوة بخطوة." }
      - label: { en: "Z production and jets at the LHC", ar: "إنتاج Z والنفثات في مصادم الهادرونات الكبير" }
        page: resources/herwig-z-jets
        kind: { en: Tutorial, ar: درس تطبيقي }
        text: { en: "A second Herwig run: simulating pp → Z + X at 7 TeV and analysing it with Rivet.", ar: "تشغيل ثانٍ لـ Herwig: محاكاة pp → Z + X عند 7 TeV وتحليلها بـ Rivet." }
      - label: { en: HERWIG via VirtualBox, ar: HERWIG عبر VirtualBox }
        page: resources/herwig-vbox
        kind: { en: Guide, ar: دليل }
        text: { en: Running HERWIG inside a ready-made virtual machine., ar: تشغيل HERWIG داخل آلة افتراضية جاهزة. }
      - label: { en: "FeynArts, FormCalc & LoopTools", ar: "FeynArts وFormCalc وLoopTools" }
        page: resources/feynarts
        kind: { en: Guide, ar: دليل }
        text: { en: Generating and evaluating one-loop Feynman diagrams., ar: توليد مخططات فاينمان ذات الحلقة الواحدة وحسابها. }

