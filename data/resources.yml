# ─────────────────────────────────────────────────────────────
#  Resources: my other websites, channels, projects, guides and articles
#  `page:` links to a full page in content/<lang>/<page>.html, `url:` to an external site.
#  Items with neither are shown as plain entries.
# ─────────────────────────────────────────────────────────────

hero_title: { en: "Everything else <em>I've built.</em>", ar: "كل ما بنيتُه <em>خارج القاعة.</em>" }
intro:
  en: >
    Everything I have built outside the lecture hall: course sites, video channels,
    conference pages, software guides, community projects and short articles on
    whatever I needed to learn at the time.
  ar: >
    كل ما بنيته خارج قاعة المحاضرات: مواقع المقررات، وقنوات الفيديو، وصفحات المؤتمرات،
    وأدلة البرمجيات، والمشاريع المجتمعية، ومقالات قصيرة في ما احتجت إلى تعلّمه حينها.

groups:
  - id: teaching-web
    title: { en: Teaching websites, ar: مواقع تعليمية }
    icon: book
    items:
      - label: { en: "Formula sheet & physical constants", ar: "جدول القوانين والثوابت الفيزيائية" }
        page: resources/formulas
        kind: { en: On this site, ar: في هذا الموقع }
        text: { en: "The mathematics and CODATA constants used across my courses, on one page you can filter or print on A4.", ar: "الرياضيات وثوابت CODATA المستعملة في مقرراتي، في صفحة واحدة يمكن تصفيتها أو طباعتها على ورقة A4." }
      - label: { en: Student Portal, ar: بوابة الطلاب }
        url: https://sites.google.com/view/kk-studentportal/
        text: { en: "Built for my students at Relizane University: course announcements and materials in one place.", ar: "أنشأتها لطلابي في جامعة غليزان: إعلانات المقررات وموادها في مكان واحد." }
      - label: { en: Personal Teaching Web (legacy), ar: موقع التدريس الشخصي (الأرشيف) }
        url: https://khelifak.wordpress.com/
        text: { en: "The original WordPress home of my courses and notes, now migrated to this site.", ar: "الموطن الأصلي لمقرراتي ومذكراتي على ووردبريس، وقد نُقل محتواه إلى هذا الموقع." }
        award: { en: "Teaching Excellence Award 2018 · Faculty of Science, Islamic University of Madinah", ar: "جائزة التميز في التدريس 2018 · كلية العلوم، الجامعة الإسلامية بالمدينة المنورة" }
      - label: { en: Chlef PhysicsWeb, ar: موقع الفيزياء بالشلف }
        url: https://chlefphys.wordpress.com/
        text: { en: Course website for the physics department at the University of Chlef., ar: موقع مقررات قسم الفيزياء بجامعة الشلف. }
      - label: { en: USTHB PhysicsWeb, ar: موقع الفيزياء بباب الزوار }
        url: https://usthbphysique.wordpress.com/
        text: { en: "Course website for first-year physics at USTHB, Algiers.", ar: "موقع مقررات الفيزياء للسنة الأولى بجامعة باب الزوار، الجزائر العاصمة." }
      - label: { en: "BAC Web (Majma' Al-Baccalaureate)", ar: "مجمع البكالوريا" }
        url: https://baccalauria.wordpress.com/
        text: { en: Free preparation material for the Algerian Baccalaureate., ar: مواد مجانية للتحضير لشهادة البكالوريا الجزائرية. }

