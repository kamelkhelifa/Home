    summary:
      en: >
        Studying towards the degree of Doctor of Medicine (M.D.), taught in French. I have
        completed the first two years; my studies are frozen for the 2025/26 and 2026/27
        academic years following my move to Qatar University.
      ar: >
        أدرس في مسار دكتوراه الطب، والتدريس فيه باللغة الفرنسية. أتممت السنتين الأولى والثانية،
        ودراستي مجمّدة للسنتين الجامعيتين ‎2025/26‎ و‎2026/27‎ بسبب انتقالي إلى جامعة قطر.
