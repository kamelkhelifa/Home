  - id: medicine
    kicker: { en: Track II, ar: المسار الثاني }
    title: { en: Medicine, ar: الطب }
    place: { en: "Faculty of Medicine, University of Chlef · Algeria", ar: "كلية الطب، جامعة الشلف · الجزائر" }
