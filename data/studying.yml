      - when: 2005 – 2009
        what: { en: MPhys Physics with Theoretical Physics, ar: ماجستير الفيزياء مع الفيزياء النظرية (MPhys) }
        where: { en: "School of Physics & Astronomy, The University of Manchester", ar: "كلية الفيزياء والفلك، جامعة مانشستر" }
        note: { en: "First Class with Honours · MPhys project “Looking for Extra Dimensions”, supervised by Prof. Apostolos Pilaftsis", ar: "مرتبة الشرف الأولى · مشروع التخرج «البحث عن أبعاد إضافية» بإشراف البروفيسور أبوستولوس بيلافتسيس" }
