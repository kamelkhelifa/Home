archive:
  page: studying/physics-manchester
  title: { en: Manchester MPhys lecture summaries, ar: ملخصات محاضرات ماجستير مانشستر }
  description:
    en: >
      Lecture summaries and exam reviews I wrote as an undergraduate on the four-year MPhys
      in Physics with Theoretical Physics (2005 – 2009), arranged by year and semester. They
      come as LaTeX-typeset PDFs and scanned handwritten notes, covering everything from
      Dynamics to Quantum Field Theory and The Early Universe.
    ar: >
      ملخصات محاضرات ومراجعات امتحانات كتبتها طالبًا في برنامج ماجستير الفيزياء مع الفيزياء
      النظرية ذي السنوات الأربع (2005 – 2009)، مرتبة حسب السنة والفصل الدراسي. بعضها ملفات PDF
      منسقة بـ LaTeX وبعضها نسخ ممسوحة بخط اليد، وتغطي كل شيء من الديناميكا إلى نظرية الحقول
      الكمومية والكون المبكر.
  topics:
    - { en: Dynamics, ar: الديناميكا }
    - { en: Advanced Quantum Mechanics, ar: ميكانيكا الكم المتقدمة }
    - { en: Gravitation, ar: الجاذبية }
    - { en: Quantum Field Theory, ar: نظرية الحقول الكمومية }
    - { en: The Early Universe, ar: الكون المبكر }

