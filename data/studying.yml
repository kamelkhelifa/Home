      - when: { en: Aug – Sep 2010, ar: أوت – سبتمبر 2010 }
        what: { en: 40th British Universities Summer School in Theoretical Elementary Particle Physics (BUSSTEPP), ar: المدرسة الصيفية الأربعون للجامعات البريطانية في فيزياء الجسيمات الأولية النظرية (BUSSTEPP) }
        where: { en: Swansea University, ar: جامعة سوانزي }
