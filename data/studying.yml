# ─────────────────────────────────────────────────────────────
#  Studying: two parallel journeys, Physics (Manchester) and Medicine (Chlef)
#  `page:` links a card to a full page in content/<lang>/<page>.html
# ─────────────────────────────────────────────────────────────

hero_title: { en: "Two journeys, <em>one habit.</em>", ar: "رحلتان، <em>وعادةٌ واحدة.</em>" }
intro:
  en: >
    Learning has never stopped being the main thread. A merit scholarship took me from
    Oued-Sly in Chlef to London and Manchester, where I spent seven years becoming a
    theoretical physicist. Years later, while teaching full-time, I went back to the
    Baccalaureate as a free candidate to begin a second degree, this time in medicine.
  ar: >
    لم يتوقف التعلّم يومًا عن أن يكون الخيط الناظم. حملتني منحة الاستحقاق من وادي سلي بالشلف
    إلى لندن ثم مانشستر، حيث قضيت سبع سنوات حتى صرت فيزيائيًا نظريًا. وبعد سنوات، وأنا أدرّس
    بدوام كامل، عدت إلى امتحان البكالوريا مترشحًا حرًّا لأبدأ شهادة ثانية، في الطب هذه المرة.

tracks:
  - id: physics
    kicker: { en: Track I, ar: المسار الأول }
    title: { en: Physics, ar: الفيزياء }
    place: { en: "The University of Manchester · United Kingdom", ar: "جامعة مانشستر · المملكة المتحدة" }
    years: 2005 – 2012
    summary:
      en: >
        Four-year Master of Physics with Theoretical Physics (First Class Honours),
        followed by a PhD in theoretical particle physics in the School of Physics &
        Astronomy, supervised by Prof. Mrinal Dasgupta.
