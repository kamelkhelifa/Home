        ماجستير الفيزياء مع الفيزياء النظرية في أربع سنوات (بمرتبة الشرف الأولى)، تلته دكتوراه
        في فيزياء الجسيمات النظرية بكلية الفيزياء والفلك، تحت إشراف البروفيسور مرينال داسغوبتا.
    milestones:
