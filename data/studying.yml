      - when: { en: Jun 2023, ar: جوان 2023 }
        what: { en: "Algerian Baccalaureate, sat again as a free candidate", ar: "شهادة البكالوريا مجددًا، مترشحًا حرًّا" }
        where: { en: Chlef, ar: الشلف }
        note: { en: "17.35 / 20, admitted to the Faculty of Medicine", ar: "17.35 / 20، والقبول في كلية الطب" }
      - when: { en: 2023 – 2024, ar: 2023 – 2024 }
        what: { en: "First year of medicine", ar: "السنة الأولى طب" }
        where: { en: "Medical annex of the University of Blida 1, Chlef", ar: "الملحقة الطبية لجامعة البليدة 1، الشلف" }
      - when: { en: 2024 – 2025, ar: 2024 – 2025 }
        what: { en: "Second year of medicine", ar: "السنة الثانية طب" }
        where: { en: "Medical annex, Chlef", ar: "الملحقة الطبية، الشلف" }
      - when: { en: 2025 – 2027, ar: 2025 – 2027 }
        what: { en: "Studies frozen (two academic years)", ar: "تجميد الدراسة (سنتان جامعيتان)" }
